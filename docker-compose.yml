# Local PostgreSQL for development and tests:  npm run db:up   (stop with: npm run db:down)
# Connection string for .env:  DATABASE_URL=postgres://shop:shop@localhost:5432/shop
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: shop, POSTGRES_PASSWORD: shop, POSTGRES_DB: shop }
    ports: ['5432:5432']
    volumes: ['shopdb:/var/lib/postgresql/data']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U shop'], interval: 3s, retries: 20 }
volumes: { shopdb: {} }
