async function productForm(id) {
  const cats = (await api('/api/admin/categories')).categories;
  const partners = (await api('/api/admin/partners')).partners.filter((x) => x.active);
  const p = id ? (await api('/api/admin/products/' + id)).product : { store: pstate.store || cfgStores[0].slug, name: '', brand: '', description: '', price: '', compare_price: 0, stock: 0, sku: '', emoji: '📦', images: [], size_label: 'Size', variants: [], featured: 0, bestseller: 0, new_arrival: 0, active: 1 };
  let images = [...p.images]; let variants = p.variants.map((v) => ({ ...v }));
  const draw = () => {
    openModal(`<h2>${id ? 'Edit product' : 'New product'}</h2><div class="fgrid">
    <label class="f full">Name<input id="pn" value="${e(p.name)}" maxlength="140"></label>
    <label class="f">Department<select id="pst">${cfgStores.map((s) => `<option value="${e(s.slug)}" ${s.slug === p.store ? 'selected' : ''}>${e(s.name)}</option>`).join('')}</select></label>
    <label class="f">Category<select id="pc"></select></label>
    <label class="f">Price (₦)<input id="pp" type="number" min="0" value="${e(p.price)}"></label><label class="f">Original price (₦, optional)<input id="pcp" type="number" min="0" value="${e(p.compare_price || '')}"></label>
    <label class="f">Brand<input id="pb" value="${e(p.brand)}" maxlength="60"></label><label class="f">SKU<input id="psku" value="${e(p.sku)}" maxlength="40"></label>
    <label class="f">Emoji (shown if no photo)<input id="pe" value="${e(p.emoji)}" maxlength="8"></label><label class="f">Stock ${variants.length ? '(from variants)' : ''}<input id="pstock" type="number" min="0" value="${e(p.stock)}" ${variants.length ? 'disabled' : ''}></label>
    <label class="f full">Pickup point (where the rider collects this item)<select id="ppartner"><option value="">Shop-Beta main store (nearest)</option>${partners.map((x) => `<option value="${x.id}" ${Number(p.partner_id) === Number(x.id) ? 'selected' : ''}>${e(x.name)}</option>`).join('')}</select></label>
    <label class="f full">Description<textarea id="pd" rows="4" maxlength="4000">${e(p.description)}</textarea></label>
    <div class="full"><b style="font-size:13px">Photos</b><div class="imgs">${images.map((u, i) => `<div class="im"><img src="${e(u)}" alt=""><button type="button" data-rmimg="${i}" aria-label="Remove photo">×</button></div>`).join('')}</div><input type="file" id="pfile" accept="image/png,image/jpeg,image/webp,image/gif"><div class="mu2">PNG, JPG, WEBP or GIF up to 2 MB. Or paste an https image link below.</div><div style="display:flex;gap:6px;margin-top:6px"><input id="purl" placeholder="https://…"><button type="button" class="btn ghost sm" id="padd">Add</button></div></div>
    <div class="full" style="margin-top:12px"><b style="font-size:13px">Variants (sizes / colours)</b> <span class="mu2">Leave empty if the product has none.</span><label class="f" style="margin-top:6px">Size label<input id="psl" value="${e(p.size_label)}" maxlength="20"></label>
    ${variants.map((v, i) => `<div class="vrow"><input data-v="${i}" data-k="size" placeholder="Size" value="${e(v.size || '')}"><input data-v="${i}" data-k="color" placeholder="Colour" value="${e(v.color || '')}"><input data-v="${i}" data-k="stock" type="number" min="0" placeholder="Stock" value="${e(v.stock)}"><button type="button" class="btn ghost sm" data-rmv="${i}" aria-label="Remove variant">×</button></div>`).join('')}<button type="button" class="btn ghost sm" id="vadd">+ Add variant</button></div>
    <div class="full" style="margin-top:12px"><label class="chk"><input type="checkbox" id="pf" ${p.featured ? 'checked' : ''}> Featured on the homepage</label><label class="chk"><input type="checkbox" id="pbs" ${p.bestseller ? 'checked' : ''}> Best seller</label><label class="chk"><input type="checkbox" id="pna" ${p.new_arrival ? 'checked' : ''}> New arrival</label><label class="chk"><input type="checkbox" id="pa" ${p.active ? 'checked' : ''}> Visible in the store</label></div></div>
    <div class="acts">${id ? '<button class="btn ghost" id="pdel" style="margin-right:auto;color:var(--bad)">Delete</button>' : ''}<button class="btn ghost" id="pcancel">Cancel</button><button class="btn" id="psave">Save product</button></div>`, true);
    const fillCats = () => { const st = $('#pst').value; $('#pc').innerHTML = '<option value="">None</option>' + cats.filter((c) => c.store === st).map((c) => `<option value="${c.id}" ${c.id === p.category_id ? 'selected' : ''}>${e(c.name)}</option>`).join(''); };
    fillCats(); $('#pst').addEventListener('change', () => { p.category_id = null; fillCats(); });
    const collect = () => { Object.assign(p, { name: $('#pn').value, store: $('#pst').value, category_id: $('#pc').value || null, price: $('#pp').value, compare_price: $('#pcp').value, brand: $('#pb').value, sku: $('#psku').value, emoji: $('#pe').value, description: $('#pd').value, size_label: $('#psl').value, featured: $('#pf').checked ? 1 : 0, bestseller: $('#pbs').checked ? 1 : 0, new_arrival: $('#pna').checked ? 1 : 0, active: $('#pa').checked ? 1 : 0 }); if (!variants.length) p.stock = $('#pstock').value; };
    $$('[data-v]', modal).forEach((i) => i.addEventListener('input', () => { variants[i.dataset.v][i.dataset.k] = i.value; }));
    $$('[data-rmv]', modal).forEach((b) => b.addEventListener('click', () => { collect(); variants.splice(b.dataset.rmv, 1); draw(); }));
    $$('[data-rmimg]', modal).forEach((b) => b.addEventListener('click', () => { collect(); images.splice(b.dataset.rmimg, 1); draw(); }));
    $('#vadd').addEventListener('click', () => { collect(); variants.push({ size: '', color: '', stock: 0 }); draw(); });
    $('#padd').addEventListener('click', () => { const u = $('#purl').value.trim(); if (!/^https:\/\//.test(u)) return toast('Image links must start with https://', 'bad'); collect(); images.push(u); draw(); });
    $('#pfile').addEventListener('change', guard(async () => {
      const f = $('#pfile').files[0]; if (!f) return; if (f.size > 2_000_000) return toast('That image is over 2 MB.', 'bad');
      const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
      const up = await api('/api/admin/upload', { body: { data } }); collect(); images.push(up.url); draw();
    }));
    $('#pcancel').addEventListener('click', closeModal);
    const del = $('#pdel'); if (del) del.addEventListener('click', guard(async () => { if (!confirm('Delete this product? Products that have orders are hidden instead.')) return; const r = await api('/api/admin/products/' + id, { method: 'DELETE' }); toast(r.archived ? 'Product hidden (it has orders)' : 'Product deleted'); closeModal(); route(); }));
    $('#psave').addEventListener('click', guard(async () => {
      collect(); const body = { ...p, images, variants };
      const saved = await api('/api/admin/products' + (id ? '/' + id : ''), { method: id ? 'PUT' : 'POST', body });
      const pp = $('#ppartner'); if (pp && (pp.value || Number(p.partner_id) || 0) !== (Number(p.partner_id) || 0)) await api('/api/admin/products/' + (id || saved.id) + '/partner', { method: 'PUT', body: { partnerId: pp.value ? Number(pp.value) : null } });
      toast('Product saved'); closeModal(); route();
    }));
  };
  draw();
}

  mn(hd('Marketing') + `<div class="panel"><h3>Abandoned carts (${a.carts.length})</h3><p class="mu2">Shoppers who entered an email at checkout but did not order. Reminder emails go out after one hour.</p><div class="tw"><table class="t"><tr><th>Email</th><th>Items</th><th>When</th><th>Reminded</th></tr>${a.carts.map((c) => `<tr><td>${e(c.email)}</td><td>${c.cart.length}</td><td class="mu2">${dt(c.created)}</td><td>${c.reminded ? 'Yes' : 'No'}</td></tr>`).join('') || '<tr><td colspan="4" class="mu">None right now.</td></tr>'}</table></div><div class="acts"><button class="btn" id="rem">Send reminders now</button></div></div>
   <div class="panel"><h3>Newsletter subscribers (${n.subscribers.length})</h3><div class="tw"><table class="t"><tr><th>Email</th><th>Joined</th></tr>${n.subscribers.map((s) => `<tr><td>${e(s.email)}</td><td class="mu2">${dt(s.created)}</td></tr>`).join('') || '<tr><td colspan="2" class="mu">No subscribers yet.</td></tr>'}</table></div></div>
   <div class="panel"><h3>Email outbox</h3><p class="mu2">${o.live ? 'Emails are sent through Resend.' : 'Email sending is not set up yet, so messages are only stored here. Add RESEND_API_KEY and MAIL_FROM to send them.'}</p><div class="tw"><table class="t"><tr><th>To</th><th>Subject</th><th>Sent</th><th>Queued</th></tr>${o.emails.map((m) => `<tr><td>${e(m.to_email)}</td><td>${e(m.subject)}</td><td>${m.sent ? 'Yes' : 'No'}</td><td class="mu2">${dt(m.created)}</td></tr>`).join('') || '<tr><td colspan="4" class="mu">Nothing queued.</td></tr>'}</table></div></div>`);
  { const holder = document.createElement('div'); holder.innerHTML = `<div class="panel"><h3>Background jobs</h3><p class="mu2">Emails and payment confirmations run in the background and retry on their own. ${jb.counts.queued} waiting, ${jb.counts.running} running, ${jb.counts.failed} failed.</p>${jb.failed.length ? `<div class="tw"><table class="t"><tr><th>Job</th><th>Details</th><th>Tries</th><th>Last error</th><th>Failed</th><th></th></tr>${jb.failed.map((j) => `<tr><td>${e(j.kind)}</td><td class="mu2">${e((j.payload && (j.payload.ref || j.payload.outboxId)) || '')}</td><td>${j.attempts}</td><td class="mu2">${e(j.last_error || '')}</td><td class="mu2">${dt(j.finished)}</td><td><button class="btn sm" data-jr="${j.id}">Retry</button> <button class="btn sm" data-jd="${j.id}">Dismiss</button></td></tr>`).join('')}</table></div>` : '<p class="mu">No failed jobs.</p>'}</div>`; $('#mn').appendChild(holder.firstChild); }
  onAll('[data-jr]', 'click', async (el) => { await api('/api/admin/jobs/' + el.dataset.jr + '/retry', { body: {} }); toast('Job queued again'); route(); });
  onAll('[data-jd]', 'click', async (el) => { if (!confirm('Dismiss this failed job? It will not be tried again.')) return; await api('/api/admin/jobs/' + el.dataset.jd, { method: 'DELETE' }); route(); });
  on('#rem', 'click', async () => { const r = await api('/api/admin/abandoned/remind', { body: {} }); toast(`${r.sent} reminder${r.sent === 1 ? '' : 's'} queued`); route(); });

views.deliveries = async () => {
  const [d, r] = await Promise.all([api('/api/admin/deliveries'), api('/api/admin/riders')]);
  const riders = r.riders.filter((x) => x.active), late = d.deliveries.filter((x) => x.late).length;
  mn(hd('Deliveries', '<button class="btn ghost sm" id="drf">Refresh</button>') + `<div class="panel"><p class="mu2">Orders that still need to reach the customer, most urgent first. ${late ? `<b style="color:var(--bad)">${late} late.</b>` : 'Nothing is late.'}</p>${d.deliveries.length ? `<div class="tw"><table class="t"><tr><th>Order</th><th>Customer</th><th>Status</th><th>Promised</th><th>Progress</th><th>Rider</th></tr>${d.deliveries.map((x) => `<tr style="${x.late ? 'background:rgba(220,38,38,.08)' : ''}"><td><a data-order="${x.id}" style="cursor:pointer"><b>${e(x.ref)}</b></a></td><td>${e(x.name)}<div class="mu2">${e(x.city || '')} ${e(x.state)} · ${e(x.phone)}</div></td><td>${pill(x.status)}${x.handover_locked ? ' <b style="color:var(--bad)">locked</b>' : ''}</td><td>${x.promised_at ? dt(x.promised_at) : '—'}${x.late ? ' <b style="color:var(--bad)">LATE</b>' : ''}</td><td class="mu2">${x.accepted_at ? 'accepted ✓ ' : ''}${x.picked_up_at ? 'picked up ✓ ' : ''}${x.on_way_at ? 'on the way ✓' : ''}</td><td><select data-assign="${x.id}"><option value="">${x.unassigned ? '⚠ Not assigned' : 'Not assigned'}</option>${riders.map((u) => `<option value="${u.id}" ${Number(x.rider_id) === Number(u.id) ? 'selected' : ''}>${e(u.name)}</option>`).join('')}</select></td></tr>`).join('')}</table></div>` : '<p class="mu">No deliveries in progress.</p>'}</div>`);

   <div class="panel"><h3>Riders</h3><p class="mu2">Riders sign in at <b>/rider</b> on their phone. Leave "states" empty for everywhere, or list states separated by commas.</p>${r.riders.length ? `<div class="tw"><table class="t"><tr><th>Name</th><th>Contact</th><th>States</th><th>Status</th><th></th></tr>${r.riders.map((x) => `<tr><td><b>${e(x.name)}</b></td><td>${e(x.phone)}<div class="mu2">${e(x.email)}</div></td><td>${e(x.coverage) || 'Everywhere'}</td><td>${x.active ? 'Active' : '<span class="mu">Off</span>'}</td><td><button class="btn ghost sm" data-rc="${x.id}">States</button> <button class="btn ghost sm" data-rt="${x.id}">${x.active ? 'Switch off' : 'Switch on'}</button></td></tr>`).join('')}</table></div>` : '<p class="mu">No riders yet.</p>'}</div>`);
  const pform = (x) => {
    x = x || { name: '', address: '', state: '', phone: '', lat: '', lng: '', radius_km: 15, is_default: 0, active: 1 };
    openModal(`<h2>${x.id ? 'Edit' : 'Add'} pickup point</h2><div class="fgrid"><label class="f full">Name<input id="xn" value="${e(x.name)}" maxlength="80"></label><label class="f full">Address<input id="xa" value="${e(x.address)}" maxlength="200"></label><label class="f">State<input id="xs" value="${e(x.state)}" maxlength="60"></label><label class="f">Phone<input id="xp" value="${e(x.phone)}" maxlength="30"></label>
     <label class="f">Latitude<input id="xlat" value="${e(x.lat)}" placeholder="6.6018"></label><label class="f">Longitude<input id="xlng" value="${e(x.lng)}" placeholder="3.3515"></label>
     <p class="mu2 full" style="margin:0">Find the coordinates: in Google Maps, press and hold on the shop, then copy the two numbers. Or stand at the shop and <button type="button" class="btn ghost sm" id="xhere">use my current location</button>.</p>
     <label class="f">Delivery radius (km)<input id="xr" type="number" min="1" value="${e(Number(x.radius_km))}"></label>
     <label class="chk"><input type="checkbox" id="xd" ${x.is_default ? 'checked' : ''}> Main store (default pickup point)</label><label class="chk"><input type="checkbox" id="xact" ${x.active ? 'checked' : ''}> Active</label></div>
     <div class="acts"><button class="btn ghost" id="xc">Cancel</button><button class="btn" id="xs2">Save</button></div>`, true);
    $('#xc').addEventListener('click', closeModal);
    $('#xhere').addEventListener('click', () => navigator.geolocation ? navigator.geolocation.getCurrentPosition((g) => { $('#xlat').value = g.coords.latitude.toFixed(6); $('#xlng').value = g.coords.longitude.toFixed(6); }, () => toast('Location not available', 'bad')) : toast('Location not available', 'bad'));
    $('#xs2').addEventListener('click', guard(async () => {
      const body = { name: $('#xn').value, address: $('#xa').value, state: $('#xs').value, phone: $('#xp').value, lat: $('#xlat').value, lng: $('#xlng').value, radius_km: $('#xr').value, is_default: $('#xd').checked, active: $('#xact').checked };

  onAll('[data-rc]', 'click', async (el) => { const x = r.riders.find((u) => String(u.id) === el.dataset.rc); const v = prompt('States this rider covers, separated by commas (empty = everywhere):', x.coverage); if (v === null) return; await api('/api/admin/riders/' + x.id, { method: 'PUT', body: { coverage: v, active: !!x.active } }); route(); });
  onAll('[data-rt]', 'click', async (el) => { const x = r.riders.find((u) => String(u.id) === el.dataset.rt); await api('/api/admin/riders/' + x.id, { method: 'PUT', body: { coverage: x.coverage, active: !x.active } }); toast(x.active ? 'Rider switched off and signed out' : 'Rider switched on'); route(); });

   <div class="panel"><h3>Delivery fees by state</h3><div class="tw"><table class="t"><tr><th>State</th><th>Fee (₦)</th><th>Delivery time</th><th>Pay on delivery</th></tr>${d.zones.map((z, i) => `<tr><td>${e(z.state)}</td><td><input type="number" min="0" data-z="${i}" data-k="fee" value="${z.fee}" style="width:110px"></td><td><input data-z="${i}" data-k="eta" value="${e(z.eta)}" maxlength="30" style="width:130px"></td><td><input type="checkbox" data-z="${i}" data-k="pod" ${z.pod ? 'checked' : ''} style="width:auto"></td></tr>`).join('')}</table></div></div>`);
  try {

      <p>${bk.last ? `Last good backup: <b>${dt(bk.last.created)}</b> (${mb(bk.last.bytes)}${bk.last.encrypted ? ', encrypted' : ', not encrypted'}).` : '<b>No backup has been made yet.</b>'}${bk.stale ? ' <b style="color:var(--danger,#b42318)">That is older than a day. Check below.</b>' : ''}${bk.lastFailure ? `<br><span style="color:var(--danger,#b42318)">Last attempt failed ${dt(bk.lastFailure.created)}: ${e(bk.lastFailure.error)}</span>` : ''}</p>
      <div class="acts"><button class="btn" id="bknow">Back up now</button></div>
      <div class="tw"><table class="t"><tr><th>File</th><th>Size</th><th>Made</th><th></th></tr>${bk.files.map((f) => `<tr><td class="mu2">${e(f.name)}</td><td>${mb(f.size)}</td><td class="mu2">${dt(f.created)}</td><td><a class="btn ghost sm" href="/api/admin/backups/${encodeURIComponent(f.name)}" download>Download</a></td></tr>`).join('') || '<tr><td colspan="4" class="mu">No backup files yet.</td></tr>'}</table></div>
      <p class="mu2">A backup runs every night. The last ${14} are kept. To restore one, follow docs/RESTORE.md.</p></div>`;
    $('#mn').appendChild(h.firstChild);
    try {
      const er = await api('/api/admin/errors'), openN = er.errors.filter((x) => !x.resolved_at).length;
      const eh = document.createElement('div');
      eh.innerHTML = `<div class="panel"><h3>Errors${openN ? ` (${openN} open)` : ''}</h3><p class="mu2">Alerts go to ${er.alerts.email ? 'your email' : ''}${er.alerts.email && er.alerts.webhook ? ' and ' : ''}${er.alerts.webhook ? 'your chat webhook' : ''}${!er.alerts.email && !er.alerts.webhook ? '<b>nowhere yet</b>: set ALERT_EMAIL and/or ALERT_WEBHOOK_URL' : ''}. The same mistake is counted, not repeated.</p>${er.errors.length ? `<div class="tw"><table class="t"><tr><th>What happened</th><th>Where</th><th>Times</th><th>Last</th><th></th></tr>${er.errors.map((x) => `<tr${x.resolved_at ? ' style="opacity:.5"' : ''}><td>${e(x.message)}</td><td class="mu2">${e(x.source)} ${e(x.route)}</td><td>${x.count}</td><td class="mu2">${dt(x.last_seen)}</td><td>${x.resolved_at ? 'fixed' : `<button class="btn ghost sm" data-fixed="${x.id}">Mark fixed</button>`}</td></tr>`).join('')}</table></div>` : '<p class="mu2">No errors recorded.</p>'}</div>`;
      $('#mn').appendChild(eh.firstChild);
      $$('[data-fixed]', $('#mn')).forEach((b) => b.addEventListener('click', async () => { await api('/api/admin/errors/' + b.dataset.fixed + '/resolve', { body: {} }); route(); }));
    } catch { /* optional */ }
    on('#bknow', 'click', async (ev) => { ev.target.disabled = true; ev.target.textContent = 'Backing up...'; try { const r = await api('/api/admin/backups', { body: {} }); toast('Backup saved (' + r.rows + ' rows)'); } catch (er) { toast(er.message); } route(); });
  } catch { /* the status panel is optional */ }
  on('#ssave', 'click', async () => {
    const settings = {}; $$('[data-s]', $('#mn')).forEach((i) => { settings[i.dataset.s] = i.value; });
    settings.pod_enabled = $('#spod').checked ? '1' : '0'; settings.paystack_enabled = $('#spay').checked ? '1' : '0'; settings.pod_confirm_required = $('#spodc').checked ? '1' : '0'; settings.pod_confirm_hours = $('#spodh').value;
    const zones = d.zones.map((z) => ({ ...z })); $$('[data-z]', $('#mn')).forEach((i) => { zones[i.dataset.z][i.dataset.k] = i.type === 'checkbox' ? (i.checked ? 1 : 0) : i.value; });
    await api('/api/admin/settings', { method: 'PUT', body: { settings, zones } }); toast('Settings saved');
  });
};

const wstate = { tab: 'quotes', qs: '', as: '', pq: '', only: '' };
const wd = (t) => (t ? new Date(t * 1000).toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' }) : '');
const WS = { requested: 'Needs quotation', quoted: 'Sent: waiting for buyer', accepted: 'Approved: waiting for payment', paid: 'Paid: ready to ship', shipped: 'Shipped', delivered: 'Delivered', declined: 'Declined', cancelled: 'Cancelled', expired: 'Expired' };
async function wholesaleQuote(ref) {
  const { quote: q } = await api('/api/admin/wholesale/quotes/' + encodeURIComponent(ref));
  const editable = ['requested', 'quoted'].includes(q.status), a = q.account, d = q.defaults;
  const money = (x) => naira(x);
  openModal(`<h3 style="margin-top:0">${e(q.ref)} · ${e(a.business_name)}</h3>
   <p class="mu2">${e(WS[q.status] || q.status)} · ${e(a.contact_name)}, ${e(a.phone)}, ${e(a.email)}${a.partner_store ? ' · <b>partner store</b>' : ''}<br>Deliver to: ${e(q.ship.name)}, ${e(q.ship.address)}, ${e([q.ship.city, q.ship.state].filter(Boolean).join(', '))}, ${e(q.ship.phone)}${q.buyer_note ? '<br>Buyer note: ' + e(q.buyer_note) : ''}</p>
   <div class="tw"><table class="t"><tr><th>Item</th><th>Retail</th><th>Qty</th><th>Unit price (₦)</th><th>In stock</th><th>Line</th></tr>${q.items.map((i) => `<tr><td>${e(i.name)}</td><td>${money(i.list_price)}</td><td>${editable ? `<input type="number" min="0" style="width:80px" data-qi="${i.id}" data-k="qty" value="${i.qty}">` : i.qty}</td><td>${editable ? `<input type="number" min="0" style="width:100px" data-qi="${i.id}" data-k="unit_price" value="${i.unit_price}">` : money(i.unit_price)}</td><td>${q.in_stock[i.id] == null ? '' : q.in_stock[i.id]}</td><td>${money(i.line_total)}</td></tr>`).join('')}</table></div>
   ${editable ? `<div class="row c2" style="margin-top:10px"><label>Logistics fee (₦)<input id="ql" type="number" min="0" value="${q.logistics_fee || ''}"></label><label>Service fee % (blank = ${d.service_pct}%)<input id="qp" type="number" min="0" max="30" step="0.5" value="${q.status === 'quoted' ? q.service_pct : ''}"></label></div>
   <div class="row c2"><label>Valid for (days)<input id="qv" type="number" min="1" max="60" value="${d.valid_days}"></label><label>Shipment plan<input id="qs" maxlength="400" value="${e(q.shipment_plan || '')}" placeholder="Truck from Lagos, pickup within 3 days of payment"></label></div>

   <div class="panel" style="border-left:4px solid ${rd.enabled ? 'var(--ok)' : 'var(--bad)'}"><b>${rd.enabled ? 'The pharmacy department is ON.' : 'The pharmacy department is OFF.'}</b>
    <p class="mu2">${rd.enabled ? 'Medicines that are approved and in date can be seen and ordered.' : 'No medicine can be listed, seen or ordered. Everything below can be prepared first. To switch it on, set <b>PHARMACY_ENABLED=1</b> on the server. Do this only after your lawyer has reviewed the rules, you have seen the real licences, and the checklist below is complete.'}</p></div>
   <div class="panel"><h3>Readiness checklist</h3><p class="mu2">This is a to-do list, not a legal opinion. Items marked (tick) are confirmed by you. Ask a Nigerian lawyer and the PCN to check the process and the compliance checklist (docs/PHARMACY.md).</p>
    ${rd.items.map((i) => `<div style="padding:5px 0;display:flex;gap:8px;align-items:center">${i.manual ? `<input type="checkbox" style="width:auto;flex:none" data-manual="${i.key === 'lawyer' ? 'pharm_legal_review' : 'pharm_licences_checked'}" ${i.ok ? 'checked' : ''}>` : (i.ok ? '✅' : i.optional ? '➖' : '⬜')} <span>${e(i.label)}</span></div>`).join('')}
    ${rd.expiring.length ? `<p class="err">Licences ending soon: ${rd.expiring.map((x) => e(x.pharmacy_name) + ' (' + dt(x.licence_expires) + ')').join(', ')}. Medicines from a pharmacy are hidden automatically when its licence ends.</p>` : ''}</div>
   <div class="panel"><h3>Homepage details</h3><p class="mu2">Shown in the footer only while the department is on.</p>
    <label class="f">PCN logo (image link or upload path)<input id="ph_logo" value="${e(S.pharm_pcn_logo)}"></label>
    <label class="f">Aggregator licence number<input id="ph_agg" value="${e(S.pharm_aggregator_licence)}"></label>
    <label class="f">Prescription-only statement<input id="ph_stm" maxlength="400" value="${e(S.pharm_statement)}" placeholder="Prescription-only medicines are supplied only against a valid prescription, checked by a licensed pharmacist."></label>
    <div class="row c2"><label class="f">Flag orders with more than this many of one item<input id="ph_lq" type="number" value="${e(S.pharm_large_qty || 10)}"></label><label class="f">Cancel unverified prescription orders after (hours)<input id="ph_uh" type="number" value="${e(S.pharm_unverified_hours || 48)}"></label></div>
    <label class="f">Days after delivery a problem can be reported<input id="ph_rd" type="number" value="${e(S.pharm_return_days || 7)}"></label><button class="btn" id="ph_save">Save</button></div>
   <div class="panel"><h3>Partner pharmacies</h3><p class="mu2">One record per pickup point. A pharmacy goes live only when its papers are complete, you approve it, and its licence year has not ended (licences run 1 January to 31 December). Changing licence details sends it back for approval.</p>
    ${ph.pharmacies.length ? `<div class="tw"><table class="t"><tr><th>Pharmacy</th><th>Pickup point</th><th>Licences</th><th>Superintendent</th><th>Year</th><th>Agreement</th><th>Status</th><th></th></tr>${ph.pharmacies.map((p) => `<tr><td>${e(p.pharmacy_name)}<br><span class="mu2">${p.products} product(s)</span></td><td>${e(p.partner_name)}</td><td>${e(p.premises_licence_no || '—')}<br>${e(p.epharmacy_licence_no || '—')}</td><td>${e(p.superintendent_name || '—')}<br>${e(p.superintendent_reg_no || '')}</td><td>${p.licence_year || '—'}${p.licence_expires && p.licence_expires < now ? ' <b class="err">ended</b>' : ''}</td><td>${p.agreement_file ? `<a href="/api/admin/pharmacy/pharmacies/${p.id}/agreement" target="_blank" rel="noopener">View</a>` : 'none'}<br><input type="file" data-ag="${p.id}" accept="application/pdf,image/jpeg,image/png" style="max-width:150px"></td><td>${pill(p.status)}</td><td style="white-space:nowrap"><button class="btn ghost sm" data-pe="${p.id}">Edit</button> ${p.status === 'approved' ? `<button class="btn ghost sm" data-ps="${p.id}">Suspend</button>` : `<button class="btn sm" data-pa="${p.id}">Approve</button>`}</td></tr>`).join('')}</table></div>` : '<p class="mu2">None yet.</p>'}
    <h4>Add a pharmacy</h4><div class="row c2"><label class="f">Pickup point<select id="pn_partner">${ph.partners.map((x) => `<option value="${x.id}">${e(x.name)}</option>`).join('')}</select></label><label class="f">Pharmacy name<input id="pn_name"></label></div>
    <div class="row c2"><label class="f">Premises licence no.<input id="pn_pl"></label><label class="f">E-pharmacy licence no.<input id="pn_el"></label></div><div class="row c2"><label class="f">Superintendent pharmacist<input id="pn_sn"></label><label class="f">Their PCN reg. no.<input id="pn_sr"></label></div>
    <label class="f">Licence year (for example ${new Date().getFullYear()})<input id="pn_yr" type="number" value="${new Date().getFullYear()}"></label><button class="btn" id="pn_add">Add pharmacy</button></div>
   <div class="panel"><h3>Pharmacist accounts</h3><p class="mu2">Pharmacists sign in at <b>/pharmacist</b>. Leave the pharmacy empty for <b>our own</b> superintendent pharmacist, who approves medicine listings and reviews flags. Administrators cannot open prescriptions.</p>
    ${pm.pharmacists.length ? `<div class="tw"><table class="t"><tr><th>Name</th><th>Email</th><th>PCN reg.</th><th>Pharmacy</th><th>Active</th></tr>${pm.pharmacists.map((p) => `<tr><td>${e(p.name)}</td><td>${e(p.email)}</td><td>${e(p.reg_no)}</td><td>${e(p.pharmacy_name || 'Ours (superintendent)')}</td><td><input type="checkbox" style="width:auto" data-pact="${p.id}" ${p.active ? 'checked' : ''}></td></tr>`).join('')}</table></div>` : ''}
    <h4>Add a pharmacist</h4><div class="row c2"><label class="f">Name<input id="pp_n"></label><label class="f">Email<input id="pp_e" type="email"></label></div><div class="row c2"><label class="f">PCN registration no.<input id="pp_r"></label><label class="f">Pharmacy<select id="pp_p"><option value="">Ours (superintendent)</option>${ph.pharmacies.map((x) => `<option value="${x.id}">${e(x.pharmacy_name)}</option>`).join('')}</select></label></div>
    <label class="f">Password (12+ characters)<input id="pp_pw" type="password" autocomplete="new-password"></label><button class="btn" id="pp_add">Add pharmacist</button></div>
   <div class="panel"><h3>Suspicious-order flags (${fl.flags.length} open)</h3>${fl.flags.map((f) => `<div style="padding:6px 0;border-bottom:1px solid var(--border)"><b>${e(f.ref)}</b> · ${e(f.kind.replace(/_/g, ' '))} · ${e(f.detail)} <button class="btn ghost sm" data-fc="${f.id}">Clear</button> <button class="btn ghost sm" data-fx="${f.id}">Confirm &amp; cancel order</button></div>`).join('') || '<p class="mu2">None.</p>'}</div>
   <div class="panel"><h3>Reported problems with medicines</h3>${rt.returns.map((x) => `<div style="padding:6px 0;border-bottom:1px solid var(--border)"><b>${e(x.ref)}</b> · ${e(x.reason)} · ${pill(x.status)} ${e(x.note)} ${x.resolution ? '→ ' + e(x.resolution) : ''} ${x.status === 'requested' ? `<button class="btn sm" data-ra="${x.id}">Approve</button> <button class="btn ghost sm" data-rj="${x.id}">Reject</button>` : ''}</div>`).join('') || '<p class="mu2">None.</p>'}<p class="mu2">Returned medicines are never put back on sale automatically.</p></div>
   <div class="panel"><h3>Record of who looked at what</h3><div class="tw"><table class="t"><tr><th>When</th><th>Who</th><th>Action</th><th>Record</th></tr>${au.audit.map((a) => `<tr><td>${dt(a.created)}</td><td>${e(a.user_name)} <span class="mu2">${e(a.role)}</span></td><td>${e(a.action)}</td><td>${e(a.entity)} ${e(a.entity_id)}</td></tr>`).join('')}</table></div></div>
   <div class="panel"><h3>NEPP</h3><p class="mu2">The connection to the national e-prescription platform is a placeholder only. We have not been given the official technical documentation, so nothing is connected and nothing is invented. Send the documentation to build it.</p></div>`);
  const P = (u, o) => api('/api/admin/pharmacy' + u, o);
  const go_ = (fn) => async (...a) => { try { await fn(...a); } catch (er) { toast(er.message, 'bad'); } };
  on('#ph_save', 'click', async () => { await P('/settings', { method: 'PUT', body: { pharm_pcn_logo: $('#ph_logo', $('#mn')).value, pharm_aggregator_licence: $('#ph_agg', $('#mn')).value, pharm_statement: $('#ph_stm', $('#mn')).value, pharm_large_qty: $('#ph_lq', $('#mn')).value, pharm_unverified_hours: $('#ph_uh', $('#mn')).value, pharm_return_days: $('#ph_rd', $('#mn')).value } }); toast('Saved'); route(); });
  onAll('[data-manual]', 'change', async (el) => { await P('/settings', { method: 'PUT', body: { [el.dataset.manual]: el.checked } }); route(); });
  on('#pn_add', 'click', async () => { const v = (i) => $('#' + i, $('#mn')).value; await P('/pharmacies', { body: { partner_id: v('pn_partner'), pharmacy_name: v('pn_name'), premises_licence_no: v('pn_pl'), epharmacy_licence_no: v('pn_el'), superintendent_name: v('pn_sn'), superintendent_reg_no: v('pn_sr'), licence_year: v('pn_yr') } }); toast('Added'); route(); });
  onAll('[data-pe]', 'click', async (el) => { const p = ph.pharmacies.find((x) => x.id == el.dataset.pe); const a = (q, d) => prompt(q, d || ''); const n = a('Pharmacy name', p.pharmacy_name); if (n === null) return; const pl = a('Premises licence no.', p.premises_licence_no); if (pl === null) return; const ep = a('E-pharmacy licence no.', p.epharmacy_licence_no); if (ep === null) return; const sn = a('Superintendent pharmacist', p.superintendent_name); if (sn === null) return; const sr = a('Superintendent PCN reg. no.', p.superintendent_reg_no); if (sr === null) return; const yr = a('Licence year', p.licence_year || new Date().getFullYear()); if (yr === null) return; await P('/pharmacies/' + p.id, { method: 'PUT', body: { pharmacy_name: n, premises_licence_no: pl, epharmacy_licence_no: ep, superintendent_name: sn, superintendent_reg_no: sr, licence_year: yr } }); toast('Saved. If it was approved, it needs approving again.'); route(); });
  onAll('[data-pa]', 'click', async (el) => { await P(`/pharmacies/${el.dataset.pa}/approve`, { body: {} }); toast('Approved'); route(); });
  onAll('[data-ps]', 'click', async (el) => { const note = prompt('Reason for suspending:'); if (!note) return; await P(`/pharmacies/${el.dataset.ps}/suspend`, { body: { note } }); route(); });
  onAll('[data-ag]', 'change', async (el) => { const f = el.files[0]; if (!f) return; if (f.size > 8e6) return toast('That file is over 8 MB', 'bad'); const data = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); }); await P(`/pharmacies/${el.dataset.ag}/agreement`, { method: 'PUT', body: { data, name: f.name } }); toast('Agreement uploaded'); route(); });
  on('#pp_add', 'click', async () => { const v = (i) => $('#' + i, $('#mn')).value; await P('/pharmacists', { body: { name: v('pp_n'), email: v('pp_e'), reg_no: v('pp_r'), pharmacy_id: v('pp_p') || null, password: v('pp_pw') } }); toast('Added'); route(); });
  onAll('[data-pact]', 'change', async (el) => { const p = pm.pharmacists.find((x) => x.id == el.dataset.pact); await P('/pharmacists/' + p.id, { method: 'PUT', body: { ...p, active: el.checked } }); toast('Saved'); });
  const flag = (sel, status) => onAll(sel, 'click', async (el) => { const note = prompt('Write a short note for the record:'); if (!note) return; await P('/flags/' + (el.dataset.fc || el.dataset.fx), { body: { status, note } }); route(); });
  flag('[data-fc]', 'cleared'); flag('[data-fx]', 'confirmed');
  const ret = (sel, status) => onAll(sel, 'click', async (el) => { const resolution = prompt('What was decided? (refund, replacement, or why refused)'); if (!resolution) return; await P('/returns/' + (el.dataset.ra || el.dataset.rj), { method: 'PUT', body: { status, resolution } }); route(); });
  ret('[data-ra]', 'approved'); ret('[data-rj]', 'rejected');
};

/* ---------------- boot ---------------- */
async function boot() {
  try { const m = await api('/api/me'); me = m.user && m.user.role === 'admin' ? m.user : null; } catch { me = null; }
  if (!me) return loginView();
  try { const c = await api('/api/config'); cfgStores = c.stores; } catch { /* retry in views */ }
  route();
}
boot();

}
if (/^\/admin(\/|$)/.test(location.pathname)) {
  document.body.classList.add('is-admin');
  for (const id of ['shell', 'scrim', 'drawer']) { const n = document.getElementById(id); if (n) n.remove(); }
  startAdmin();
} else {
  const a = document.getElementById('adm'); if (a) a.remove();
  startStore();
}
})();
</script>
</body>
</html>
