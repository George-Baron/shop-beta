async function rkLoad() {
  const d = await api(RIDER_API + '/riders?' + rq(RS.f)); RS.riders = d.riders; RS.cfg = d;
  const all = d.riders, n = (f) => all.filter(f).length;
  const sum = $('#rk-sum'); if (sum) sum.textContent = `${n((r) => r.availability !== 'offline')} online · ${n((r) => r.availability === 'available')} available · ${n((r) => r.availability === 'on_delivery')} on delivery · ${n((r) => r.marker === 'stale')} stale GPS`;
  const body = $('#rk-body'); if (!body) return;
  $('#rk-filters').style.display = ['map', 'list'].includes(RS.tab) ? '' : 'none';
  if (RS.tab === 'map') return rkMap(body);
  if (RS.tab === 'list') return rkList(body);
  if (RS.tab === 'dispatch') return rkDispatch(body);
  if (RS.tab === 'perf') return rkPerf(body);
  return rkAi(body);
}
function rkRow(r, extra = '') {
  const a = r.assignment;
  return `<tr class="click" data-rider="${r.id}"><td><b>${e(r.code)}</b></td><td>${e(r.name)}${r.unread ? ` <span class="dot">${r.unread}</span>` : ''}<br><span class="mu2">${e(r.phone)}</span></td><td>${mkPill(r.marker)}</td><td>${e(r.gps_label)}<br><span class="mu2">${r.position ? agoS(r.position.age_s) : '—'}</span></td><td>${a ? `<b>${e(a.order_ref)}</b><br><span class="mu2">${e(a.status.replace('_', ' '))}${a.straight_km != null ? ' · ' + a.straight_km + ' km away' : ''}</span>` : '<span class="mu2">—</span>'}</td><td>${r.active_deliveries}/${r.capacity}</td>${extra}</tr>`;
}
function rkList(body) {
  body.innerHTML = `<div class="panel"><div class="tw"><table class="t"><tr><th>ID</th><th>Rider</th><th>Status</th><th>Location</th><th>Delivery</th><th>Load</th></tr>${RS.riders.map((r) => rkRow(r)).join('') || '<tr><td colspan="6" class="mu2">No riders match.</td></tr>'}</table></div></div>`;
  onAll('[data-rider]', 'click', (el) => rkPanel(Number(el.dataset.rider)));
}
async function rkMap(body) {
  if (!RS.map) {
    body.innerHTML = `<div class="rk-split"><div id="rk-map" class="rk-map"></div><div class="rk-side"><div class="rk-legend">${Object.entries(MARK).map(([k, m]) => `<span><i style="background:${m[0]}"></i>${m[1]}</span>`).join('')}</div><div id="rk-mini"></div></div></div><p class="mu2">Only riders whose phone has sent a position are drawn. A faded marker with a red ring has not updated recently: its position is the last one known, not a live one.</p>`;
    const first = RS.riders.find((r) => r.position);
    const { L, map } = await makeMap($('#rk-map'), { tiles: RS.cfg.tiles, attribution: RS.cfg.attribution }, first ? [first.position.lat, first.position.lng] : [6.5244, 3.3792], 12);
    RS.L = L; RS.map = map; RS.fit = true; map.scrollWheelZoom.enable();
  }
  const L = RS.L, seen = new Set();
  for (const r of RS.riders) {
    if (!r.position) continue; seen.add(r.id);
    const m = MARK[r.marker] || MARK.offline, stale = r.gps === 'stale';
    const icon = L.divIcon({ className: '', iconSize: [34, 34], iconAnchor: [17, 17], html: `<div class="rk-mk ${stale ? 'stale' : ''}" style="background:${m[0]}">${e(r.code.replace('SB-', ''))}</div>` });
    let mk = RS.markers[r.id];
    if (!mk) { mk = RS.markers[r.id] = L.marker([r.position.lat, r.position.lng], { icon }).addTo(RS.map); mk.on('click', () => rkPanel(r.id)); }
    else { mk.setLatLng([r.position.lat, r.position.lng]); mk.setIcon(icon); }
    mk.bindTooltip(`${r.name} · ${m[1]} · ${agoS(r.position.age_s)}`);
  }
  for (const id of Object.keys(RS.markers)) if (!seen.has(Number(id))) { RS.map.removeLayer(RS.markers[id]); delete RS.markers[id]; }
  if (RS.fit && seen.size) { RS.fit = false; RS.map.fitBounds(L.latLngBounds([...seen].map((id) => { const p = RS.riders.find((r) => r.id === id).position; return [p.lat, p.lng]; })).pad(0.2), { maxZoom: 15 }); }
  $('#rk-mini').innerHTML = `<div class="tw"><table class="t">${RS.riders.map((r) => `<tr class="click" data-rider="${r.id}"><td><b>${e(r.code)}</b> ${e(r.name)}<br><span class="mu2">${e(r.gps_label)}${r.position ? ' · ' + agoS(r.position.age_s) : ''}</span></td><td>${mkPill(r.marker)}</td></tr>`).join('') || '<tr><td class="mu2">No riders yet.</td></tr>'}</table></div>`;
  onAll('[data-rider]', 'click', (el) => { const id = Number(el.dataset.rider), r = RS.riders.find((x) => x.id === id); if (r && r.position && RS.map) RS.map.setView([r.position.lat, r.position.lng], Math.max(RS.map.getZoom(), 14)); rkPanel(id); });
}

const rkMsg = (m) => `<div class="rd-msg ${m.from !== 'rider' ? 'me' : ''}"><div class="who">${m.from === 'rider' ? 'Rider' : m.from === 'ai' ? e(m.sender) + ' · AI' : e(m.sender || 'Desk')}${m.order_ref ? ' · ' + e(m.order_ref) : ''}</div>${m.attachment ? `<a href="${e(m.attachment)}" target="_blank" rel="noopener"><img src="${e(m.attachment)}" alt="Photo" loading="lazy"></a>` : ''}<div>${e(m.text)}</div><div class="t">${dt(m.at)}${m.from !== 'rider' ? (m.read ? ' ✓✓ read' : ' ✓ sent') : ''}</div></div>`;

/* ---- dispatch: orders waiting for a rider, the AI's ranking, and who has been offered what ---- */

   ${d.awaiting.length ? `<div class="tw"><table class="t"><tr><th>Order</th><th>Customer</th><th>Where</th><th>Promised</th><th></th></tr>${d.awaiting.map((o) => `<tr><td><b>${e(o.ref)}</b></td><td>${e(o.name)}</td><td>${e(o.city || '')} ${e(o.state || '')}</td><td>${o.promised_at ? dt(o.promised_at) : '—'}</td><td><button class="btn sm" data-rank="${o.id}" data-ref="${e(o.ref)}">Find best rider</button></td></tr>`).join('')}</table></div>` : '<p class="mu2">No order is waiting for a rider.</p>'}</div>
   <div class="panel"><h3>Offers waiting for an answer</h3>${d.offered.length ? `<div class="tw"><table class="t"><tr><th>Order</th><th>Rider</th><th>Offered by</th><th>Time left</th></tr>${d.offered.map((o) => `<tr><td><b>${e(o.ref)}</b></td><td>${e(o.code)} ${e(o.full_name)}</td><td>${o.offered_by === 'ai' ? 'AI' : 'Desk'}</td><td>${o.timeout_at ? Math.max(0, o.timeout_at - Math.floor(Date.now() / 1000)) + ' s' : 'waits for rider'}</td></tr>`).join('')}</table></div>` : '<p class="mu2">None.</p>'}</div>

/* ---- live updates ---- */
function rkConnect() {
  if (typeof EventSource === 'undefined') return;
  const es = RS.es = new EventSource(RIDER_API + '/stream');
  const kick = (k) => () => {
    if (!$('#rk-body')) { es.close(); RS.es = null; return; }
    if (RS.sel && (k === 'message' || k === 'read')) rkRefreshChat(RS.sel).catch(() => {});
    if (RS.t) return;   // one refresh is already queued; a steady stream of positions must not keep postponing it
    RS.t = setTimeout(() => { RS.t = 0; if ($('#rk-body') && !(document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName) && $('#rk-filters').contains(document.activeElement))) rkLoad().catch(() => {}); }, k === 'location' ? 2500 : 600);
  };
  for (const k of ['availability', 'location', 'assignment', 'offer', 'offer_closed', 'message', 'read', 'delivery', 'rider_updated', 'tracking']) es.addEventListener(k, kick(k));
}

async function openOrder(ref) {

  const lines = o.lines.map((l) => `<tr><td>${e(l.name)}${l.sku ? `<br><span class="mu2">${e(l.sku)}</span>` : ''}</td><td>${l.qty}</td><td>${st === 'picking' && work ? `<input type="number" min="0" max="${l.qty}" style="width:80px" data-pl="${l.id}" value="${l.qty_picked}">` : l.qty_picked}</td><td>${st === 'picking' && work ? `<input data-pn="${l.id}" maxlength="200" placeholder="if short" value="${e(l.short_note)}">` : e(l.short_note)}</td></tr>`).join('');

  if (st === 'picked' && work) actions.push('<div class="row c2"><label>Packages (cartons, bags, pallets)<input id="o-pk" type="number" min="1" step="1"></label><label>Packing note<input id="o-pn" maxlength="300"></label></div><button class="btn" id="o-pack">Mark packed</button>');

  openModal(`<h3 style="margin-top:0">${e(o.order_no)} <span class="mu2">· ${e(o.stage_label)}</span></h3>
  <p class="mu2">${e(o.buyer.business_name)} · ${e(o.buyer.contact_name)}, ${e(o.buyer.phone)}<br>Deliver to: ${e(o.ship.name)}, ${e(o.ship.address)}, ${e(o.ship.phone)}<br>Quote ${e(o.ref)} · invoice ${e(o.invoice_no)} · paid ${wd(o.paid_at)}${o.picker ? ' · picker ' + e(o.picker) : ''}${o.packer ? ' · packer ' + e(o.packer) : ''}</p>
  <div class="tw"><table class="t"><tr><th>Item</th><th>Ordered</th><th>Picked</th><th>Note</th></tr>${lines}</table></div>
  ${o.packages ? `<p class="mu2">${o.packages} package${o.packages === 1 ? '' : 's'}${o.package_note ? ' · ' + e(o.package_note) : ''}</p>` : ''}
  ${o.dispatched_at ? `<p class="mu2">Dispatched ${wdt(o.dispatched_at)} · ${e(o.carrier)}${o.tracking ? ' · ' + e(o.tracking) : ''}${o.driver_name ? ' · driver ' + e(o.driver_name) + ' ' + e(o.driver_phone) : ''}${o.vehicle_no ? ' · vehicle ' + e(o.vehicle_no) : ''}${o.failed_attempts ? ' · failed attempts: ' + o.failed_attempts : ''}</p>` : ''}
  ${o.delivered_at ? `<p class="mu2">Delivered ${wdt(o.delivered_at)} · received by ${e(o.received_by)}${o.delivery_note ? ' · ' + e(o.delivery_note) : ''}</p>` : ''}
  ${actions.join('')}
  <div style="margin-top:12px"><button class="btn ghost sm" id="o-pl">Print pick list</button> <button class="btn ghost sm" id="o-dn2">Print delivery note</button> <button class="btn ghost sm" id="o-inv">Print invoice</button> <button class="btn ghost sm" id="o-x">Close</button></div>
  <h4>History</h4>${o.events.map((x) => `<div class="mu2">${wdt(x.created)} · ${e(x.note || x.stage)} <span class="mu2">(${e(x.by)})</span></div>`).join('') || '<div class="mu2">Nothing yet.</div>'}`, true);
  const again = () => { views.warehouse(); return openOrder(ref); };                 // stay on the order so the next step is one tap away
  const go = (path, body, msg) => async () => { await api(A + '/' + path, { body: body ? body() : {} }); if (msg) toast(msg); await again(); };
  const mon = (id, fn) => { const el = $(id, modal); if (el) el.addEventListener('click', guard(fn)); };   // the dialog sits outside the page body, so on() would not find it

  bindG('#o-pack', go('pack', () => ({ packages: $('#o-pk').value, note: $('#o-pn').value }), 'Packed'));

  const head = (t) => `<h1>${t}</h1><p><b>${e(o.order_no)}</b> · quote ${e(o.ref)}<br>${e(o.buyer.business_name)}<br>Deliver to: ${e(o.ship.name)}, ${e(o.ship.address)}, ${e(o.ship.phone)}</p>`;
  mon('#o-pl', 'click', () => printHtml('Pick list ' + o.order_no, head('Pick list') + `<table><tr><th>Item</th><th>SKU</th><th class="r">Qty</th><th>Picked</th></tr>${o.lines.map((l) => `<tr><td>${e(l.name)}</td><td>${e(l.sku)}</td><td class="r">${l.qty}</td><td>☐</td></tr>`).join('')}</table><div class="sig"><div>Picked by</div><div>Checked by</div></div>`));
  mon('#o-dn2', 'click', () => printHtml('Delivery note ' + o.order_no, head('Delivery note') + `<table><tr><th>Item</th><th class="r">Qty</th></tr>${o.lines.map((l) => `<tr><td>${e(l.name)}</td><td class="r">${l.qty}</td></tr>`).join('')}</table><p>Packages: ${o.packages || ''} ${e(o.package_note)}<br>${o.driver_name ? 'Driver: ' + e(o.driver_name) + ' ' + e(o.driver_phone) + '<br>' : ''}${o.vehicle_no ? 'Vehicle: ' + e(o.vehicle_no) : ''}</p><div class="sig"><div>Received by (name and signature)</div><div>Date</div></div>`));
  mon('#o-inv', 'click', guard(async () => { const v = await api('/api/admin/warehouse/invoices/' + encodeURIComponent(o.ref)); printHtml('Invoice ' + o.invoice_no, invoiceHtml(v.invoice || v)); }));
}

    <label>What happened<select id="ak"><option value="adjustment">Stock count correction (add or remove)</option><option value="damaged">Damaged (remove)</option><option value="expired">Expired (remove)</option><option value="return">Returned by a customer (add)</option></select></label>

      if (items.some((i) => !Number.isInteger(i.qty) || i.qty < 1)) throw new Error('Enter a whole quantity of 1 or more on every line.');

      const r = await api(A + '/stock/receipt', { body: { items, reference: whs.ref, note: whs.note, opening: whs.opening, key: whs.key } });
      toast('Received · ' + r.grn); Object.assign(whs, { lines: [], ref: '', note: '', opening: false, key: '', tab: 'stock' }); views.warehouse();
    });
  }
};

      <div class="acts"><button class="btn" id="icommit" ${p.no_rate || !(s.new || s.possible_duplicate || s.duplicate) ? 'disabled' : ''}>Import ${s.new || 0} new products</button></div><p class="mu2">New products start as “Needs review”. Photos are copied into your own storage in the background.</p>`; }
    $$('[data-map]').forEach((sel) => sel.addEventListener('change', () => { st.mapping = {}; $$('[data-map]').forEach((x) => { if (x.value !== '') st.mapping[x.dataset.map] = Number(x.value); }); run(); }));
    const bind = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); }; // the wizard is in the modal, outside #mn, so the page-level on() cannot reach it
    bind('#irepr', 'click', () => run()); bind('#iwu', 'change', () => run());
    bind('#icommit', 'click', guard(async () => { const pos = $$('[data-pos]').filter((c) => c.checked).map((c) => Number(c.dataset.pos));
      const b = { ...payload(), mapping: st.prev.mapping, import_possible: pos, on_duplicate: $('#idup').value }; if ($('#ismin').value !== '' && $('#ismax').value !== '') { b.ship_min = $('#ismin').value; b.ship_max = $('#ismax').value; }
      const r = await DS('/import/commit', { body: b }); toast(`Imported ${r.created} new, updated ${r.updated}, skipped ${r.skipped}`);
      $('#iout').innerHTML = `<h3>Done</h3><p><b>${r.created}</b> products created (waiting for your review), ${r.updated} updated, ${r.skipped} skipped, ${r.errors} with problems. ${r.images_queued ? r.images_queued + ' products are having their photos copied now.' : ''}${r.needs_reprice ? `<br><b>${r.needs_reprice}</b> products have a new cost. Open them to check their price.` : ''}${r.created && r.no_ship_times ? '<br>These have no shipping times yet. Add them before approving.' : ''}</p>${r.problems.length ? `<p class="mu2">${r.problems.slice(0, 10).map((x) => `Row ${x.row}: ${e(x.message)}`).join('<br>')}</p>` : ''}<div class="acts"><button class="btn" id="idone">Review the new products</button></div>`;
      bind('#idone', 'click', () => { dstate.tab = 'products'; dstate.plist = 'pending'; closeModal(); views.dropship(); }); }));
  };
  const run = guard(async () => { st.prev = await DS('/import/preview', { body: payload() }); st.mapping = st.prev.mapping; draw(); });
  $('#iprev').addEventListener('click', () => { if (!st.data && !$('#itext').value.trim()) return toast('Choose a file or paste your rows first', 'bad'); if (!$('#ist').value) return toast('Choose the department first', 'bad'); st.mapping = null; run(); });
}

/* ---------------- boot ---------------- */
async function boot() {
  if (/^\/admin\/riders\/?$/.test(location.pathname) && !location.hash) location.hash = '#/riders';
  try { const m = await api('/api/me'); me = m.user && (m.user.role === 'admin' || m.user.role === 'staff') ? m.user : null; } catch { me = null; }
  if (!me) return loginView();
  try { const c = await api('/api/config'); cfgStores = c.stores; } catch { /* retry in views */ }
  route();
}
boot();

}
if (/^\/admin(\/|$)/.test(location.pathname)) {
  document.body.classList.add('is-admin');
  for (const id of ['shell', 'scrim', 'drawer']) { const n = document.getElementById(id); if (n) n.remove(); }
  startAdmin();
} else {
  const a = document.getElementById('adm'); if (a) a.remove();
  startStore();
}
})();
</script>
</body>
