// Runs before first paint: restores dark/light mode and the last department theme (no flash of the wrong design).
(function () {
  try {
    var r = document.documentElement;
    var m = JSON.parse(localStorage.getItem('sb_mode') || 'null'); if (m) r.setAttribute('data-mode', m);
    if (!r.getAttribute('data-store')) { var m2 = /^\/d\/([a-z-]+)/.exec(location.pathname); var s = m2 ? m2[1] : JSON.parse(localStorage.getItem('sb_store') || 'null'); if (s) r.setAttribute('data-store', s); }
  } catch (e) { /* storage blocked */ }
})();
</script>

<style>
:root{
 --bg:#fff;--surface:#fff;--surface-2:#f6f7f9;--text:#16181d;--muted:#667085;--border:#e5e8ee;

 --radius:14px;--radius-sm:10px;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.06);
 --font:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--display:var(--font);--ok:#16a34a;--warn:#d97706;--bad:#dc2626;
}

[data-store=beauty]{--accent:#d6246e;--accent-soft:#fde7f1;--accent-2:#7c3aed;--hero-bg:linear-gradient(120deg,#fde9ee,#f7e6f6 60%,#fff);--display:'Playfair Display',Georgia,serif;--radius:18px}
[data-store=electronics]{--bg:#0a0d0c;--surface:#121715;--surface-2:#0e1311;--text:#f2f6f4;--muted:#9aa8a1;--border:#232b28;--accent:#22c55e;--accent-ink:#04130a;--accent-soft:#0f2a1a;--head-bg:#0a0d0c;--head-ink:#f2f6f4;--hero-bg:radial-gradient(ellipse at 80% 20%,#0f3d22,#0a0d0c 65%);--hero-ink:#f2f6f4;--hero-muted:#a9b8b0;--shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.5)}
[data-store=pharmacy]{--accent:#2563eb;--accent-soft:#e6efff;--surface-2:#f3f7ff;--hero-bg:linear-gradient(120deg,#d7e8ff,#eef5ff 70%,#fff);--radius:12px}
[data-store=food]{--accent:#f97316;--accent-soft:#fff0dd;--accent-2:#facc15;--bg:#fffaf0;--surface-2:#fff4dc;--hero-bg:linear-gradient(120deg,#fde58a,#fff3c4 70%,#fffaf0);--radius:22px;--display:'Poppins','Plus Jakarta Sans',system-ui,sans-serif}

[data-mode=dark][data-store=supermarket]{--head-bg:#06301b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
.seo-static{max-width:900px;margin:0 auto;padding:8px 16px 40px;font-size:15px}.seo-static ul{padding-left:18px}.seo-static a{text-decoration:underline}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .2s}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0 0 .5em}h1{font-size:clamp(28px,4vw,46px);letter-spacing:-.02em}h2{font-size:clamp(20px,2.4vw,26px)}h3{font-size:18px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}.mu{color:var(--muted)}.hide{display:none!important}.sr{position:absolute;left:-9999px}
.loading-page{min-height:50vh;display:grid;place-items:center}.loading-page::after{content:'';width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.sm{padding:7px 14px;font-size:13px}.btn.lg{padding:14px 30px;font-size:16px}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--border)}.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}.btn.block{width:100%}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;outline:none}

.row{display:grid;gap:12px}.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:repeat(3,1fr)}@media(max-width:600px){.row.c2,.row.c3{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:13px;margin:6px 0}.note{background:var(--accent-soft);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px}

.icons{display:flex;gap:6px;margin-left:auto}.ibtn{position:relative;background:none;border:0;color:inherit;cursor:pointer;font-size:20px;padding:8px;border-radius:10px;display:grid;place-items:center}.ibtn:hover{background:rgba(127,127,127,.15)}

.menu-btn{display:none}
.tabs-dept{background:var(--surface-2);border-bottom:1px solid var(--border)}
.tabs-in{display:flex;gap:6px;max-width:1200px;margin:0 auto;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.dtab{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;color:var(--muted);border:1px solid transparent}

[data-store=supermarket] .nav2 a:hover,[data-store=supermarket] .nav2 a.on{color:var(--accent-2)}
@media(max-width:760px){.head-in{flex-wrap:wrap;gap:10px}.search{order:5;flex-basis:100%;max-width:none}.nav2{display:none}.logo span.t{font-size:18px}}
/* hero */
.hero{background:var(--hero-bg);color:var(--hero-ink);overflow:hidden}

.hero-art .big{font-size:150px;line-height:1;filter:drop-shadow(0 18px 24px rgba(0,0,0,.25));animation:float 5s ease-in-out infinite}
.hero-art .sm1,.hero-art .sm2,.hero-art .sm3{position:absolute;font-size:64px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.2));animation:float 6s ease-in-out infinite}
.hero-art .sm1{left:6%;top:12%;animation-delay:-1s}.hero-art .sm2{right:4%;top:8%;animation-delay:-2.5s}.hero-art .sm3{right:14%;bottom:2%;animation-delay:-4s}

section.blk{padding:30px 0}.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}.sec-head a{font-size:13px;font-weight:700;color:var(--accent)}

.cat .ci{width:68px;height:68px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:30px;transition:transform .15s}.cat:hover .ci{transform:translateY(-3px)}
.cats.square .cat{width:104px}.cats.square .cat .ci{border-radius:16px;width:92px;height:80px;border:1px solid var(--border);background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}

.pcard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}.pimg{position:relative;display:block;aspect-ratio:1/1;background:var(--surface-2)}.pimg img{width:100%;height:100%;object-fit:cover}

.pbody{padding:12px;display:flex;flex-direction:column;gap:5px;flex:1}.pname{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}

@media(max-width:700px){.trust{grid-template-columns:1fr}}
.promo2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.promo2{grid-template-columns:1fr}}
.promo{border-radius:var(--radius);padding:24px;background:linear-gradient(120deg,var(--accent-soft),var(--surface-2));border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;min-height:140px;overflow:hidden}.promo h3{margin:0 0 4px}.promo p{margin:0 0 12px;color:var(--muted);font-size:14px}.promo .pe{font-size:64px}

/* product page */
.pd{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:start}@media(max-width:800px){.pd{grid-template-columns:1fr}}
.gal .main{aspect-ratio:1/1;border-radius:var(--radius);overflow:hidden;background:var(--surface-2);border:1px solid var(--border);position:relative;cursor:zoom-in}.gal .main img,.gal .main .emoji-tile{width:100%;height:100%;object-fit:cover;transition:transform .2s;transform-origin:var(--zx,50%) var(--zy,50%)}.gal .main.zoom img{transform:scale(2)}.gal .main .emoji-tile{font-size:160px}
.thumbs{display:flex;gap:8px;margin-top:10px}.thumbs button{width:64px;height:64px;border-radius:10px;border:2px solid var(--border);padding:0;overflow:hidden;background:var(--surface-2);cursor:pointer}.thumbs button.on{border-color:var(--accent)}.thumbs img{width:100%;height:100%;object-fit:cover}
.pd h1{font-size:clamp(24px,3vw,34px)}.pd .price{font-size:28px;font-weight:800;margin:10px 0}.pd .price s{font-size:16px;color:var(--muted);font-weight:500;margin-left:8px}.pd .price .save{font-size:13px;color:var(--ok);margin-left:8px;font-weight:700}
.opt-label{font-weight:700;font-size:13px;margin:14px 0 6px}.stock{font-size:13px;font-weight:700}.stock.in{color:var(--ok)}.stock.low{color:var(--warn)}.stock.out{color:var(--bad)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:999px;overflow:hidden}.qty button{width:36px;height:36px;border:0;background:none;cursor:pointer;font-size:18px}.qty span{min-width:30px;text-align:center;font-weight:700}
.buy{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:32px 0 16px}.tabs2 button{background:none;border:0;padding:10px 16px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}.tabs2 button.on{color:var(--accent);border-color:var(--accent)}
.rev{padding:14px 0;border-bottom:1px solid var(--border)}.rev b{margin-right:8px}.dist{display:grid;grid-template-columns:44px 1fr 28px;gap:8px;align-items:center;font-size:13px;margin:3px 0}.bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden}.bar i{display:block;height:100%;background:#f5a524}
.starpick button{background:none;border:0;font-size:26px;color:var(--border);cursor:pointer}.starpick button.on{color:#f5a524}
/* drawer / modal / toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:90;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:var(--shadow)}.drawer.on{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}.drawer header h3{margin:0}.drawer .body{flex:1;overflow:auto;padding:14px 18px}.drawer footer{padding:16px 18px;border-top:1px solid var(--border)}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}.line .lt{width:64px;height:64px;border-radius:10px;overflow:hidden}.line .lt .emoji-tile{font-size:30px}.line .rm{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:0}
.sum{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}.sum.total{font-size:18px;font-weight:800;border-top:1px solid var(--border);margin-top:6px;padding-top:10px}
.free-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0}.free-bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)}.modal.on{display:flex}.modal .box{background:var(--surface);border-radius:var(--radius);padding:24px;width:min(460px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;display:grid;gap:8px;justify-items:center}.toast{background:#111;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow);transition:opacity .3s}.toast.out{opacity:0}.toast.bad{background:var(--bad)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.page{padding:28px 0}.prose{max-width:760px}.prose h2{margin-top:1.6em}.prose p,.prose li{color:var(--muted)}
.cookie{position:fixed;left:16px;right:16px;bottom:16px;z-index:70;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}

.rm{background:none;border:0;cursor:pointer;padding:0;color:var(--muted);font-size:12px}

<script>
(function () {
'use strict';
/* ===== core.js ===== */
// Shared state and helpers (no framework, no inline handlers: the CSP forbids them).

// The customer's chosen currency (storefront only). Prices are kept in Naira; this shows them in the customer's money at the current rate. The exact amount is fixed by the server at checkout.
const fxc = { code: 'NGN', rate: 1 };
const fmtMinor = (minor, code) => { try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: code }).format(Number(minor) / 10 ** new Intl.NumberFormat(undefined, { style: 'currency', currency: code }).resolvedOptions().maximumFractionDigits); } catch { return Number(minor) / 100 + ' ' + code; } };

// The final invoice is read from the frozen copy the server keeps; nothing here recalculates a price.
function invoiceHtml(v) {

  <p class="mu">Paid ${fdate(v.payment.paid_at)} by ${e(v.payment.method || 'bank transfer')}${v.payment.ref ? ', reference ' + e(v.payment.ref) : ''}. Quote ${e(v.quote_ref)}.</p>`;

async function api(path, opts = {}) {
  const o = { method: opts.method || 'GET', headers: {}, credentials: 'same-origin' };
  if (opts.body !== undefined) { o.method = opts.method || 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opts.body); }
  let r; try { r = await fetch(path, o); } catch { throw new Error('Network problem. Check your connection and try again.'); }
  let d = {}; try { d = await r.json(); } catch { /* empty */ }
  if (!r.ok || d.error) { const err = new Error(d.error || 'Something went wrong.'); err.status = r.status; throw err; }
  return d;
}

/* ---- photos: shrink in the browser, then upload with a progress bar ---- */
const IMG_ACCEPT = '.jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp';
// Phone photos are 3-8 MB. We resize to 1600 px on the long side and save as WebP (about 85% quality), so uploads are small and fast and fit the server's 2 MB limit.
async function prepImage(file) {
  if (!file) throw new Error('No photo chosen.');
  const heic = /\.(heic|heif)$/i.test(file.name) || /hei[cf]/i.test(file.type);
  if (!(['image/jpeg', 'image/png', 'image/webp'].includes(file.type) || /\.(jpe?g|png|webp)$/i.test(file.name))) throw new Error(`"${file.name}" is not a JPG, PNG or WEBP photo.` + (heic ? ' iPhone HEIC photos: in Settings > Camera > Formats choose "Most Compatible", or share the photo as a JPG.' : ''));
  if (file.size > 30e6) throw new Error(`"${file.name}" is over 30 MB. Choose a smaller photo.`);
  let bmp; try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch { throw new Error(`"${file.name}" could not be opened. The file may be damaged. Try another photo.`); }
  const encode = async (max, q) => {
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height)), w = Math.max(1, Math.round(bmp.width * k)), h = Math.max(1, Math.round(bmp.height * k));

  if (blob && blob.size > 1.9e6) blob = await encode(1200, 0.78);
  if (blob && blob.size > 1.9e6) blob = await encode(900, 0.7);
  if (bmp.close) bmp.close();
  if (!blob) throw new Error(`"${file.name}" could not be prepared. Try another photo.`);
  if (blob.size > 1.95e6) throw new Error(`"${file.name}" is still too large after resizing. Try a simpler photo.`);

function uploadImage(path, blob, onProgress, extra) {

/* ---- maps: Leaflet is served from our own server (/vendor/leaflet), tiles come from the configured provider ---- */
let leafletP;
function loadLeaflet() {
  if (!leafletP) leafletP = new Promise((res, rej) => {
    if (window.L) return res(window.L);
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/vendor/leaflet/leaflet.css'; document.head.appendChild(l);
    const sc = document.createElement('script'); sc.src = '/vendor/leaflet/leaflet.js';

  items: ls.get('sb_cart', []),
  save() { ls.set('sb_cart', this.items); emit(); },
  count() { return this.items.reduce((s, i) => s + i.qty, 0); },
  add(productId, variantId, qty = 1) {
    const it = this.items.find((i) => i.productId === productId && (i.variantId || null) === (variantId || null));
    if (it) it.qty = Math.min(99, it.qty + qty); else this.items.push({ productId, variantId: variantId || null, qty });
    this.save();
  },
  set(productId, variantId, qty) {
    const i = this.items.findIndex((x) => x.productId === productId && (x.variantId || null) === (variantId || null));
    if (i < 0) return; if (qty <= 0) this.items.splice(i, 1); else this.items[i].qty = Math.min(99, qty); this.save();
  },
  clear() { this.items = []; this.save(); },
  coupon: ls.get('sb_coupon', ''),
  setCoupon(c) { this.coupon = c || ''; ls.set('sb_coupon', this.coupon); emit(); },
};

/* ---- wishlist (local, merged into the account when signed in) ---- */
const wish = {
  ids: new Set(ls.get('sb_wish', [])),
  has(id) { return this.ids.has(id); },
  async toggle(id) {
    const on = !this.ids.has(id); if (on) this.ids.add(id); else this.ids.delete(id);
    ls.set('sb_wish', [...this.ids]); emit();
    if (store.user) { try { await api('/api/wishlist/' + id, { method: on ? 'POST' : 'DELETE', body: on ? {} : undefined }); } catch { /* local copy kept */ } }
    return on;
  },
};

function recent(id) { if (id === undefined) return ls.get('sb_recent', []); const l = ls.get('sb_recent', []).filter((x) => x !== id); l.unshift(id); ls.set('sb_recent', l.slice(0, 12)); }

/* ---- shared UI snippets ---- */
const stars = (r, n) => {

  return `<span class="stars" aria-label="${r || 0} out of 5">${'★'.repeat(full)}<i>${'★'.repeat(5 - full)}</i>${n != null ? `<small>(${n})</small>` : ''}</span>`;

const tile = (p, cls = '') => p.image

function productCard(p) {
  const hot = p.off ? `<span class="badge off">-${p.off}%</span>` : p.new_arrival ? '<span class="badge new">New</span>' : '';
  const out = p.stock <= 0 ? '<span class="badge out">Sold out</span>' : '';
  return `<article class="pcard">

    <button class="wish ${wish.has(p.id) ? 'on' : ''}" data-wish="${p.id}" aria-label="Save to wishlist" aria-pressed="${wish.has(p.id)}">${wish.has(p.id) ? '♥' : '♡'}</button>

// Cart and order lines grouped by who sells them ('' = Shop-Beta itself), in a stable order.
function byStore(lines, nameOf = (l) => l.vendorName || l.store || '') {
  const m = new Map();
  for (const l of lines) { const k = nameOf(l); if (!m.has(k)) m.set(k, []); m.get(k).push(l); }
  return [...m.entries()].sort((a, b) => (a[0] === '') - (b[0] === '') || a[0].localeCompare(b[0])).map(([name, ls2]) => ({ name, lines: ls2 }));
}
const groupHead = (name, groups) => (groups.length > 1 || name ? `<div class="sgroup">🏪 Sold by ${e(name || 'VELTO-MART')}</div>` : '');

function startStore() {
/* ===== cartui.js ===== */
let open = false, data = null, cfgRef = null, busy = 0;
function initCart(cfg) {
  cfgRef = cfg;

  d.addEventListener('click', async (ev) => {
    const t = ev.target;

    const m = t.closest('[data-qty]');
    if (m) { const [pid, vid, delta] = m.dataset.qty.split(','); const line = data.lines.find((l) => l.productId == pid && (l.variantId || '') == vid); cart.set(Number(pid), vid ? Number(vid) : null, (line ? line.qty : 1) + Number(delta)); return; }
    const r = t.closest('[data-rm]'); if (r) { const [pid, vid] = r.dataset.rm.split(','); cart.set(Number(pid), vid ? Number(vid) : null, 0); return; }

  });

function closeCart() { open = false; $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('on'); }
function openCart() { open = true; $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('on'); refresh(); }
async function priceNow(extra = {}) {
  return api('/api/cart/price', { body: { items: cart.items, coupon: cart.coupon, ...extra } });
}
async function refresh() {
  const my = ++busy; const d = $('#drawer');
  if (!d.innerHTML) d.innerHTML = '<div class="loading-page"></div>';
  if (!cart.items.length) { data = { lines: [] }; return paint(); }
  try { const r = await priceNow(); if (my !== busy) return; data = r;
    // drop items the server says no longer exist, and cap quantities to stock
    let changed = false;
    for (const i of r.issues || []) { if (/no longer available/.test(i.message)) { const idx = cart.items.findIndex((x) => x.productId === i.productId); if (idx >= 0) { cart.items.splice(idx, 1); changed = true; } } }
    for (const l of r.lines) { const it = cart.items.find((x) => x.productId === l.productId && (x.variantId || null) === (l.variantId || null)); if (it && it.qty !== l.qty) { it.qty = l.qty; changed = true; } }
    if (changed) { cart.save(); return; }
    if (r.couponError) { toast(r.couponError, 'bad'); cart.setCoupon(''); return; }
    paint(); } catch (er) { d.innerHTML = `<header><h3>Your cart</h3><button class="ibtn" id="cclose" aria-label="Close">✕</button></header><div class="body"><p class="err">${e(er.message)}</p></div>`; }
}

    ${(() => { const gs = byStore(r.lines); return gs.map((g) => groupHead(g.name, gs) + g.lines.map((l) => `<div class="line"><a class="lt" href="/product/${e(l.slug)}" data-link>${tile({ id: l.productId, emoji: l.emoji, image: l.image, name: l.name })}</a>

  ${r.lines.length ? `<footer>
    <div style="display:flex;gap:8px;margin-bottom:10px"><input id="ccode" placeholder="Promo code" value="${e(cart.coupon)}" aria-label="Promo code"><button class="btn ghost sm" id="capply">Apply</button></div>
    ${r.coupon ? `<div class="sum" style="color:var(--ok)"><span>Code ${e(r.coupon)} <button class="rm" id="cclear" style="color:var(--muted)">(remove)</button></span><span>−${naira(r.discount)}</span></div>` : ''}

    const tab = t.closest('[data-tab]'); if (tab) { $$('.tabs2 button').forEach((b) => b.classList.toggle('on', b === tab)); $('#tdesc').classList.toggle('hide', tab.dataset.tab !== 'desc'); $('#trev').classList.toggle('hide', tab.dataset.tab !== 'rev'); }
    if (t.closest('#addbtn')) { const v = find(); cart.add(p.id, v ? v.id : null, sel.qty); toast('Added to cart'); openCart(); try { if (window.gtag) window.gtag('event', 'add_to_cart', { value: p.price * sel.qty, currency: 'NGN' }); if (window.fbq) window.fbq('track', 'AddToCart'); } catch { /* blocked */ } }
    const star = t.closest('[data-star]'); if (star) { rating = Number(star.dataset.star); $$('.starpick button').forEach((b) => b.classList.toggle('on', Number(b.dataset.star) <= rating)); }
  });

  main.addEventListener('submit', async (ev) => {
    if (ev.target.id !== 'rform') return; ev.preventDefault();

}
function reviewsHtml(p) {

  return `<div class="row c2" style="align-items:start"><div>
    ${p.reviews.length ? `<div style="font-size:34px;font-weight:800">${p.rating} <span class="stars" style="font-size:20px">★</span></div>${p.dist.map((x) => `<div class="dist"><span>${x.stars} ★</span><div class="bar"><i style="width:${x.n / total * 100}%"></i></div><span>${x.n}</span></div>`).join('')}` : '<p class="mu">No reviews yet. Be the first!</p>'}
    ${p.reviews.map((r) => `<div class="rev"><b>${e(r.name)}</b>${stars(r.rating)}<div style="font-weight:600">${e(r.title)}</div><div class="mu">${e(r.body)}</div></div>`).join('')}</div>

    ${store.user ? '' : '<label class="f">Your name<input name="name" required maxlength="60"></label>'}<label class="f">Title<input name="title" maxlength="80"></label><label class="f">Your review<textarea name="body" rows="3" maxlength="1000" required></textarea></label><button class="btn">Submit review</button></form></div>`;

function ldjson(p, cfg) {
  const old = document.getElementById('ldp'); if (old && old.dataset.path === location.pathname) return; /* the server already wrote the full version for this address */ if (old) old.remove();
  const s = document.createElement('script'); s.type = 'application/ld+json'; s.id = 'ldp';
  s.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'Product', name: p.name, description: p.description, sku: p.sku, brand: { '@type': 'Brand', name: p.brand }, offers: { '@type': 'Offer', priceCurrency: 'NGN', price: p.price, availability: p.stock > 0 ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock', url: location.href }, ...(p.rating_n ? { aggregateRating: { '@type': 'AggregateRating', ratingValue: p.rating, reviewCount: p.rating_n } } : {}) });
  document.head.appendChild(s);
}

function faqWire() {
  const i = $('#faqq'); if (!i) return;
  i.addEventListener('input', () => {
    const t = i.value.trim().toLowerCase(); let shown = 0;
    $$('.faqi').forEach((d) => { const hit = !t || d.textContent.toLowerCase().includes(t); d.style.display = hit ? '' : 'none'; if (hit) shown++; if (t && hit) d.open = true; else if (!t) d.open = false; });

    $('#faqn').classList.toggle('hide', shown > 0);
  });
}

  });

  return 'Checkout';
}

// Shrinks a phone photo in the browser (longest side 1600 px, JPEG) so it uploads quickly and stays under the size limit.
const readAsData = (blob) => new Promise((resolve, reject) => { const fr = new FileReader(); fr.onload = () => resolve(fr.result); fr.onerror = () => reject(new Error('That file could not be read.')); fr.readAsDataURL(blob); });
async function shrinkPhoto(file) {   // data: links only: the site's security policy does not allow blob: images
  const src = await readAsData(file);
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); resolve(c.toDataURL('image/jpeg', 0.82)); };
    img.onerror = () => reject(new Error('That file is not a photo we can read.'));
    img.src = src;
  });
}
function returnCard(order) {

    ${r.note ? `<div class="mu">Note from our team: ${e(r.note)}</div>` : ''}
    ${(r.photos || []).length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${r.photos.map((p) => `<img data-retphoto="${r.id}:${p}" alt="Return photo" style="width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line,#e5e7eb)">`).join('')}</div>` : ''}
    ${r.can_cancel ? `<button class="btn ghost sm" data-retcancel="${r.id}" style="margin-top:6px">Cancel this request</button>` : ''}</div>`).join('');

      <label class="f">2. What condition is it in?<select id="rcond"><option value="">Choose…</option>${Object.entries(ri.conditions).map(([k, v]) => `<option value="${k}">${e(v)}</option>`).join('')}</select></label>

    ${order.handover_code ? `<div class="note" style="text-align:center;margin:10px 0"><div style="font-size:13px">Your delivery code</div><div style="font-size:36px;font-weight:800;letter-spacing:8px">${e(order.handover_code)}</div><div style="font-size:13px">Read this code to the rider only when your parcel is in your hands. It completes the delivery.${order.payment_method === 'pod' ? ' Have ' + naira(order.total) + ' ready.' : ''} Never share it before then.</div></div>` : ''}
    ${d.locked ? '<p style="color:var(--bad)">Delivery is paused after too many wrong codes. We will contact you.</p>' : ''}

}

const blobToData = (b) => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = () => rej(new Error('The photo could not be read.')); f.readAsDataURL(b); });
async function riderPage(main) {
  const path = location.pathname.replace(/\/+$/, '');
  if (!store.user || store.user.role !== 'rider') {
    if (path !== '/rider/login') history.replaceState({}, '', '/rider/login');
    return riderLogin(main);
  }
  if (path !== '/rider/dashboard') history.replaceState({}, '', '/rider/dashboard');
  return riderApp(main);
}
function riderLogin(main) {
  main.innerHTML = `<div class="wrap page" style="max-width:460px"><div class="card"><h1 style="font-size:26px">🛵 Rider sign in</h1><p class="mu">Sign in with the rider account the store gave you.</p>
   <form id="rl" novalidate>${field('re', 'Email', { type: 'email', req: 1, auto: 'username' })}${field('rp', 'Password', { type: 'password', req: 1, auto: 'current-password' })}<p class="err hide" id="rerr" role="alert"></p><button class="btn block lg">Sign in</button></form>
   <p class="mu" style="font-size:12px;margin-top:12px">Your location is only used after you choose <b>Go online</b>, and stops when you go offline.</p></div></div>`;
  $('#rl').addEventListener('submit', async (ev) => {
    ev.preventDefault(); const er = $('#rerr'); er.classList.add('hide');

      const r = await api('/api/auth/login', { body: { email: $('#re').value.trim(), password: $('#rp').value } });

async function riderApp(main) {
  const S = { me: null, orders: [], offers: [], msgs: [], tab: ls.get('sb_rtab', 'home'), now: Math.floor(Date.now() / 1000), maps: null, mapKey: '' };
  const T = { watch: null, last: 0, sending: false, wake: null, perm: 'unknown', pos: null, err: '' };   // the tracking session on this phone
  let es = null, dead = false;
  const alive = () => { if (dead || !main.isConnected) { stop(); return false; } return true; };
  const stop = () => { dead = true; if (T.watch != null) navigator.geolocation.clearWatch(T.watch); T.watch = null; if (es) es.close(); es = null; if (T.wake) { T.wake.release().catch(() => {}); T.wake = null; } };
  const on = () => S.me && S.me.tracking.active;
  const hhmm = (t) => (t ? new Date(t * 1000).toLocaleTimeString('en-NG', { hour: 'numeric', minute: '2-digit' }) : '');
  const typing = () => { const a = document.activeElement; return a && main.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName); };

  /* ---- loading ---- */
  const load = async () => {
    const [me, o, of] = await Promise.all([api('/api/rider/me'), api('/api/rider/orders'), api('/api/rider/offers')]);
    S.me = me; S.orders = o.orders.filter((x) => x.stages.accepted); S.offers = of.offers; S.now = of.now;
  };
  const loadMsgs = async () => { const m = await api('/api/rider/messages'); S.msgs = m.messages; S.ai = m.ai_name; if (S.me) S.me.unread = 0; };
  const refresh = async (force) => { await load(); if (S.tab === 'chat') await loadMsgs(); if (alive()) paint(force); syncTracking(); };

  /* ---- GPS: only inside a session the rider started, only while this page is open ---- */
  const interval = () => ((S.me && S.me.tracking.interval_s) || 60) * 1000;
  const sendFix = async (p, force) => {
    if (!on() || T.sending) return;
    const t = Date.now(); if (!force && t - T.last < interval() - 1500) return;
    T.sending = true; T.last = t;
    try {
      const r = await api('/api/rider/location', { body: { lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy, heading: p.coords.heading, speed: p.coords.speed, timestamp: p.timestamp } });
      if (r.interval && S.me) S.me.tracking.interval_s = r.interval;
      T.err = r.accepted === false ? ({ accuracy: 'The GPS signal is weak. Move to open sky.', jump: 'That position looked wrong, so it was ignored.' }[r.reason] || '') : '';
      S.me.tracking.last_fix_at = Math.floor(Date.now() / 1000); S.me.tracking.status = r.accepted === false ? S.me.tracking.status : 'live';
    } catch (er) { if (er.status === 409) { await refresh(true); } else T.err = er.message; }
    T.sending = false; if (alive()) paintBar();
  };
  const permFail = async (code) => {
    const st = code === 1 ? 'denied' : 'gps_disabled'; T.perm = st;
    if (on()) { try { const r = await api('/api/rider/permission', { body: { status: st } }); S.me = { ...S.me, tracking: r.tracking || S.me.tracking }; } catch { /* retry on next change */ } }
    if (alive()) paint(true);
  };
  const startWatch = () => {
    if (T.watch != null || !navigator.geolocation) return;
    T.watch = navigator.geolocation.watchPosition((p) => { T.perm = 'granted'; T.pos = p; sendFix(p); }, (er) => permFail(er.code), { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
    if (navigator.wakeLock) navigator.wakeLock.request('screen').then((w) => { T.wake = w; }).catch(() => {});
  };
  const stopWatch = () => { if (T.watch != null) navigator.geolocation.clearWatch(T.watch); T.watch = null; if (T.wake) { T.wake.release().catch(() => {}); T.wake = null; } };
  function syncTracking() { if (on()) startWatch(); else stopWatch(); }
  document.addEventListener('visibilitychange', () => { if (!dead && !document.hidden && on() && T.watch != null && T.wake == null && navigator.wakeLock) navigator.wakeLock.request('screen').then((w) => { T.wake = w; }).catch(() => {}); });

  const histLoad = async () => { try { const h = (await api('/api/rider/history')).history; const box = $('#hist'); if (box && h.length) box.innerHTML = `<div class="card"><b>Recent deliveries</b>${h.slice(0, 10).map((x) => `<div class="rd-pick"><span>${e(x.ref)} · ${e(x.city || '')}</span><span class="mu">${e(String(x.status).replace('_', ' '))}${x.delivered_at ? ' · ' + hhmm(x.delivered_at) : ''}</span></div>`).join('')}</div>`; } catch { /* optional */ } };

  /* ---- navigation map for each active delivery ---- */
  const drawMaps = async () => {
    for (const o of S.orders) {
      const box = $(`[data-map="${o.id}"]`, main); if (!box) continue;
      let rt = null; try { rt = await api(`/api/rider/orders/${o.id}/route`); } catch { /* the map still shows the stops */ }
      if (!box.isConnected) return;
      const eta = $(`[data-eta="${o.id}"]`, main);
      if (rt && rt.route && eta) { const arr = new Date(Date.now() + rt.route.minutes * 60000).toLocaleTimeString('en-NG', { hour: 'numeric', minute: '2-digit' }); eta.textContent = `${rt.to.kind === 'pickup' ? 'To pickup' : 'To customer'}: ${rt.route.km} km · about ${rt.route.minutes} min · arrive around ${arr}${rt.route.approx ? ' (rough estimate)' : ''}`; }
      else if (eta) eta.textContent = rt && rt.to && !rt.from ? 'Waiting for a fresh GPS position to work out the route.' : '';
      if (!rt || !rt.to) { box.remove(); continue; }
      try {
        const D = await dcfg(), pts = [[rt.to.lat, rt.to.lng]]; if (rt.from) pts.push([rt.from.lat, rt.from.lng]);
        const { L, map } = await makeMap(box, D, pts[0], 14);
        L.marker(pts[0]).addTo(map).bindPopup(rt.to.kind === 'pickup' ? 'Pickup: ' + rt.to.name : 'Customer');
        if (rt.from) L.circleMarker(pts[1], { radius: 8, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1 }).addTo(map).bindPopup('You');
        if (rt.route && rt.route.line) L.polyline(rt.route.line, { color: '#2563eb', weight: 5, opacity: 0.8 }).addTo(map);
        map.fitBounds(pts.length > 1 ? L.latLngBounds(pts) : L.latLngBounds([pts[0], pts[0]]).pad(0.002), { padding: [24, 24], maxZoom: 16 });
      } catch { box.remove(); }
    }
  };

  /* ---- actions ---- */
  const bind = () => {
    $$('[data-tab]', main).forEach((b) => b.addEventListener('click', async () => { S.tab = b.dataset.tab; ls.set('sb_rtab', S.tab); if (S.tab === 'chat') { try { await loadMsgs(); api('/api/rider/messages/read', { body: {} }).catch(() => {}); } catch { /* shown empty */ } } paint(true); }));
    const g = $('#go-on', main); if (g) g.addEventListener('click', goOnline);
    const off = $('#go-off', main); if (off) off.addEventListener('click', goOffline);
    $$('[data-st]', main).forEach((b) => b.addEventListener('click', async () => { try { const r = await api('/api/rider/status', { body: { status: b.dataset.st } }); S.me = { ...S.me, ...r }; await refresh(true); } catch (er) { toast(er.message, 'bad'); } }));
    $$('[data-accept]', main).forEach((b) => b.addEventListener('click', async () => { b.disabled = true; try { await api(`/api/rider/assignments/${b.dataset.accept}/accept`, { body: {} }); toast('Delivery accepted'); S.tab = 'orders'; await refresh(true); } catch (er) { toast(er.message, 'bad'); await refresh(true); } }));
    $$('[data-reject]', main).forEach((b) => b.addEventListener('click', async () => {
      const why = prompt('Why are you rejecting this delivery? (optional)\nExamples: too far, vehicle problem, taking a break', ''); if (why === null) return;
      b.disabled = true; try { await api(`/api/rider/assignments/${b.dataset.reject}/reject`, { body: { reason: why } }); toast('Rejected. It will be offered to someone else.'); await refresh(true); } catch (er) { toast(er.message, 'bad'); await refresh(true); }
    }));
    $$('[data-o]', main).forEach((box) => {
      const id = box.dataset.o, call = (a, body) => api(`/api/rider/orders/${id}/${a}`, { body: body || {} });
      const act = async (a, body) => { try { const r = await call(a, body); if (r && r.note) toast(r.note); await refresh(true); } catch (er) { toast(er.message, 'bad'); if (er.status === 423 || er.status === 409) refresh(true); } };
      $$('[data-pick]', box).forEach((b) => b.addEventListener('click', () => act('pickup', { partnerId: Number(b.dataset.pick) })));
      $$('[data-report]', box).forEach((b) => b.addEventListener('click', async () => { const note = prompt('Add a short note for the desk (optional)', ''); if (note === null) return; act('report', { type: b.dataset.report, note }); }));
      const pf = $('.proofin', box); if (pf) pf.addEventListener('change', () => { $('.proofnote', box).textContent = pf.files[0] ? '📷 ' + pf.files[0].name : ''; });
      $$('[data-act]', box).forEach((b) => b.addEventListener('click', async () => {
        if (b.dataset.act !== 'complete') return act(b.dataset.act);
        const code = $('.codein', box).value.trim(); if (!/^\d{6}$/.test(code)) return toast('Enter the 6-digit code from the customer.', 'bad');
        const nm = $('.namein', box); if (nm && nm.value.trim().length < 3) return toast('Ask for the buyer\'s full name and enter it.', 'bad');
        b.disabled = true; let proofImage = '';
        try { if (pf && pf.files[0]) proofImage = (await api('/api/rider/photo', { body: { data: await blobToData(await prepImage(pf.files[0])) } })).url; } catch (er) { toast(er.message, 'bad'); b.disabled = false; return; }
        const p = T.pos ? { lat: T.pos.coords.latitude, lng: T.pos.coords.longitude } : {};
        b.disabled = false; act('complete', { code, proofImage, ...(nm ? { recipientName: nm.value.trim() } : {}), ...p });
      }));
    });
    const mf = $('#mf', main);
    if (mf) {
      const send = async (text, attachment) => { try { await api('/api/rider/messages', { body: { text, attachment: attachment || '' } }); await loadMsgs(); paintMsgs(); } catch (er) { toast(er.message, 'bad'); } };
      mf.addEventListener('submit', (ev) => { ev.preventDefault(); const t = $('#mt').value.trim(); if (!t) return; $('#mt').value = ''; send(t); });
      $('#mphoto').addEventListener('change', async (ev) => { const f = ev.target.files[0]; if (!f) return; try { const url = (await api('/api/rider/photo', { body: { data: await blobToData(await prepImage(f)) } })).url; await send($('#mt').value.trim() || 'Photo', url); $('#mt').value = ''; } catch (er) { toast(er.message, 'bad'); } });
      $$('[data-q]', main).forEach((b) => b.addEventListener('click', () => send(b.dataset.q)));
    }
    const pi = $('#pimg', main); if (pi) pi.addEventListener('change', async (ev) => { const f = ev.target.files[0]; if (!f) return; try { await api('/api/rider/photo', { body: { data: await blobToData(await prepImage(f)), profile: true } }); await refresh(true); toast('Profile photo updated'); } catch (er) { toast(er.message, 'bad'); } });
    const lo = $('#rlo', main); if (lo) lo.addEventListener('click', async () => { if (on() && !confirm('You are online. Signing out will not stop the desk seeing you as online. Go offline first?')) return; stop(); await api('/api/auth/logout', { body: {} }); store.user = null; location.href = '/rider/login'; });
  };
  const paintMsgs = () => { const b = $('#msgs', main); if (b) { b.innerHTML = S.msgs.map(msgHtml).join('') || '<p class="mu">No messages yet.</p>'; b.scrollTop = b.scrollHeight; } };

  /* ---- live updates from the server, with a slow poll as a safety net ---- */
  const connect = () => {
    if (dead || typeof EventSource === 'undefined') return;
    es = new EventSource('/api/rider/stream');
    const again = (async () => { if (!alive()) return; if (S.tab === 'chat') { await loadMsgs().catch(() => {}); api('/api/rider/messages/read', { body: {} }).catch(() => {}); if (!typing()) paintMsgs(); } await refresh(false).catch(() => {}); });
    for (const k of ['offer', 'offer_closed', 'assignment', 'availability', 'delivery', 'rider_updated', 'message', 'read', 'tracking']) es.addEventListener(k, () => { if (k === 'offer') { try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch { /* optional */ } } again(); });
  };
  const tickTimer = setInterval(() => {
    if (!alive()) return clearInterval(tickTimer);
    S.now = Math.floor(Date.now() / 1000);
    $$('[data-to]', main).forEach((c) => { const l = Math.max(0, Number(c.dataset.to) - S.now); c.textContent = `${Math.floor(l / 60)}:${String(l % 60).padStart(2, '0')}`; if (l === 0 && !c.dataset.done) { c.dataset.done = '1'; refresh(true).catch(() => {}); } });
    paintBar();
  }, 1000);
  const slow = setInterval(() => { if (!alive()) return clearInterval(slow); refresh(false).catch(() => {}); }, 60000);

  try { await load(); } catch (er) { if (er.status === 401) { store.user = null; location.href = '/rider/login'; return 'Rider'; } throw er; }
  if (S.tab === 'chat') await loadMsgs().catch(() => {});
  paint(true); syncTracking(); connect();
  return 'Rider';
}

// Order page: status of the pharmacist's check, paying after approval, answering questions, reporting a problem.
function pharmOrderCard(o) {
  const p = o.pharmacy; if (!p) return '';
  let msg = '';
  if (o.status === 'cancelled') msg = 'This order was cancelled. Any reason from the pharmacist is in the updates below.';
  else if (p.rx_required && p.rx_status === 'submitted') msg = '🩺 <b>Waiting for the pharmacist</b> to check your prescription. Nothing is charged or sent until it is approved. We will email you.';
  else if (p.rx_required && p.rx_status === 'needs_info') msg = '❓ <b>The pharmacist needs more information</b> (see the updates below). Add a clearer or additional prescription:';
  else if (p.held) msg = '🔎 This order is being reviewed by our pharmacy team. We will contact you.';
  else if (p.needs_payment) msg = '✅ <b>Approved.</b> Please pay to confirm your order.';
  else if (p.rx_required) msg = '✅ Your prescription was approved by the pharmacist.';
  return `<div class="card" style="margin-bottom:16px" id="pharmcard"><h3 style="margin-top:0">💊 Pharmacy order</h3><p style="margin:0 0 8px">${msg}</p>
   ${p.temp_sensitive ? '<p class="mu" style="font-size:13px">This order contains temperature-sensitive medicines and goes with a cold-chain rider.</p>' : ''}
   ${p.needs_payment ? '<button class="btn" id="pharmpay">Pay now</button>' : ''}
   ${p.rx_status === 'needs_info' && o.status !== 'cancelled' ? '<button class="btn ghost" id="pharmmore">Choose or upload another prescription</button>' : ''}
   ${o.status === 'delivered' ? '<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:700">Report a problem with these medicines</summary><label class="f">What is wrong?<select id="retr"><option value="tampered">Packaging tampered with</option><option value="expired">Expired</option><option value="damaged">Damaged</option><option value="wrong_item">Not what I ordered</option></select></label><label class="f">Details<input id="retn" maxlength="500"></label><button class="btn sm" id="retgo">Send</button></details>' : ''}</div>`;
}

const app = {};
const ctx = app;
let cfg;

/* ---------- router ---------- */
function go(url, replace) { if (replace) history.replaceState({}, '', url); else history.pushState({}, '', url); route(); window.scrollTo(0, 0); }
async function route() {
  const u = new URL(location.href); const p = u.pathname.replace(/\/+$/, '') || '/'; const seg = p.split('/').filter(Boolean);
  let main = $('#main'); if (!main) return;
  // Fresh node for every page: page views attach their own click/submit listeners, and reusing one node would stack them up.
  { const fresh = main.cloneNode(false); main.replaceWith(fresh); main = fresh; }
  main.innerHTML = '<div class="loading-page"></div>';
  document.body.classList.toggle('is-rider', seg[0] === 'rider');
  try {
    let storeSlug = null;
    if (seg[0] === 'd' && seg[1]) storeSlug = seg[1];
    else if (u.searchParams.get('store')) storeSlug = u.searchParams.get('store');
    if (storeSlug && !cfg.stores.some((s) => s.slug === storeSlug)) storeSlug = null;
    if (storeSlug) setStoreTheme(storeSlug);
    let title = cfg.settings.store_name;
    if (p === '/' ) { go('/d/' + (cfg.stores.some((s) => s.slug === getStoreSlug()) ? getStoreSlug() : cfg.stores[0].slug), true); return; }
    else if (seg[0] === 'd' && seg.length === 2) title = await home(main, seg[1], cfg);
    else if (seg[0] === 'shop' || (seg[0] === 'd' && seg[2] === 'shop')) title = await shopView(main, u, cfg);
    else if (seg[0] === 'product' && seg[1]) title = await productView(main, seg[1], cfg);
    else if (seg[0] === 'dropshipping' && seg.length === 1) title = await dropshippingPage(main, cfg);
    else if (seg[0] === 'import-export' && seg.length === 1) { const t = 'Import & Export'; main.innerHTML = `<div class="wrap page" style="max-width:640px;text-align:center"><nav class="crumbs" style="text-align:left"><a href="/" data-link>Home</a> › ${e(t)}</nav><div class="card"><div style="font-size:46px">🚧</div><h1 style="margin:8px 0">${e(t)}</h1><p class="mu">This page is under construction. Please check back soon.</p><a class="btn" href="/" data-link>Back to home</a></div></div>`; title = t; }
    else if (seg[0] === 'stores' && seg.length === 1) title = await storesView(main, u, cfg);
    else if (seg[0] === 'store' && seg[1]) title = await storeView(main, seg[1], u, cfg);
    else if (seg[0] === 'sell' && seg.length === 1) title = await sellView(main, cfg);
    else if (seg[0] === 'page' && seg[1]) title = staticPage(main, seg[1], cfg);
    else if (['checkout', 'order', 'account', 'login', 'register', 'wishlist', 'track', 'forgot', 'rider', 'pharmacist', 'partner', 'supplier', 'wholesale', 'notifications'].includes(seg[0])) { title = await view(main, seg, u, cfg); refreshBell(); }
    else main.innerHTML = `<div class="wrap empty"><div class="em">🧭</div><h2>Page not found</h2><p><a class="btn" href="/" data-link>Back to the store</a></p></div>`;
    document.title = (title ? title + ' · ' : '') + cfg.settings.store_name;
    syncHeader(); $('#main').focus({ preventScroll: true });
  } catch (err) {
    main.innerHTML = `<div class="wrap empty"><div class="em">😕</div><h2>${err.status === 404 ? 'We could not find that' : 'Something went wrong'}</h2><p class="mu">${e(err.message)}</p><p><a class="btn" href="/" data-link>Back to the store</a> <button class="btn ghost" data-reload>Try again</button></p></div>`;
  }
  trackPage();
}
function trackPage() { try { if (window.gtag) window.gtag('event', 'page_view', { page_path: location.pathname }); if (window.fbq) window.fbq('track', 'PageView'); } catch { /* analytics blocked */ } }

async function supplierPortal(main) {

  const paintFiles = () => { const el = $('#rfiles'); if (el) el.innerHTML = files.map((f) => `<div style="display:flex;gap:8px;align-items:center;padding:3px 0"><a href="/api/wholesale/rfq/${e(ref)}/files/${f.id}">📎 ${e(f.name)}</a><span class="mu2">${Math.round(f.size / 1024)} KB</span><button type="button" class="btn ghost sm" data-rf="${f.id}">Remove</button></div>`).join('') || '<p class="mu2" style="margin:0">No files attached.</p>'; $$('[data-rf]').forEach((b) => b.addEventListener('click', run(async () => { await W(`/rfq/${ref}/files/${b.dataset.rf}`, { method: 'DELETE' }); files = files.filter((f) => String(f.id) !== b.dataset.rf); paintFiles(); }))); };

async function refreshBell() {

  $('#bellBtn').classList.remove('hide');
  try { const { unread } = await api('/api/notifications/count'); b.textContent = unread > 99 ? '99+' : unread; b.classList.toggle('hide', !unread); } catch { /* ignore */ }
}
async function notificationsPage(main) {
  if (!store.user) { go('/login?next=/notifications', true); return 'Notifications'; }

    const d = await api('/api/notifications?limit=20' + (before ? '&before=' + before : ''));
    const html = d.notifications.map((n) => `<a class="ntf ${n.read ? '' : 'new'}" href="${e(n.link || '#')}" data-nid="${n.id}" ${n.link && n.link.startsWith('/admin') ? '' : n.link ? 'data-link' : ''}><b>${e(n.title)}</b>${n.body ? `<div class="mu">${e(n.body)}</div>` : ''}<div class="mu2">${new Date(n.created * 1000).toLocaleString('en-NG')}</div></a>`).join('');

    else { $('#nlist').insertAdjacentHTML('beforeend', html); const m = $('#nmore'); if (d.more) m.dataset.b = d.notifications[d.notifications.length - 1].id; else m.remove(); }
    $$('[data-nid]').forEach((a) => { if (!a.dataset.w) { a.dataset.w = 1; a.addEventListener('click', () => { api('/api/notifications/read', { body: { id: Number(a.dataset.nid) } }).then(refreshBell).catch(() => {}); }); } });

/* ---------- shell ---------- */
function initAssistant() {
  if ($('#aibtn')) return;
  const box = document.createElement('div');
  box.innerHTML = `<button class="ai-btn" id="aibtn" aria-label="Open help chat">💬 Ask us</button>
   <section class="ai-panel" id="aip" role="dialog" aria-label="Help chat"><div class="ai-head"><b>Help &amp; support</b><button id="aix" aria-label="Close chat">×</button></div><div class="ai-log" id="ail" aria-live="polite"></div>
   <div class="ai-chips" id="aic"></div><p class="ai-note">Automated assistant. It can make mistakes, so check important details. Do not share passwords or card numbers.</p>
   <form class="ai-form" id="aif"><input id="aii" maxlength="500" placeholder="Type your question" autocomplete="off" aria-label="Your question"><button class="btn sm" id="ais">Send</button></form></section>`;
  document.body.append(...box.children);
  const log = $('#ail'), hist = []; let busy = false, started = false;
  const link = (t) => e(t).replace(/(^|\s)(\/(?:track|stores|sell|wholesale|login|register|account|shop|page\/[a-z]+|product\/[a-z0-9-]+)[^\s.,)]*)/g, '$1<a href="$2" data-link>$2</a>');
  const add = (who, text) => { const d = document.createElement('div'); d.className = 'ai-m ' + who; if (who === 'bot') d.innerHTML = link(text); else d.textContent = text; log.append(d); log.scrollTop = log.scrollHeight; return d; };
  const send = async (text) => {
    text = String(text || '').trim(); if (!text || busy) return; busy = true; $('#aic').innerHTML = '';
    add('me', text); hist.push({ role: 'user', content: text }); const wait = add('bot', '…'); $('#ais').disabled = true;
    try { const r = await api('/api/assistant/chat', { body: { messages: hist.slice(-10) } }); wait.innerHTML = link(r.reply); hist.push({ role: 'assistant', content: r.reply }); }
    catch (x) { wait.textContent = x.status === 429 ? 'You are sending messages very fast. Please wait a moment and try again.' : (x.message || 'Sorry, something went wrong.'); hist.pop(); }

    ${row('Order paid with', e(o.payment_method) + (o.wallet_amount ? ' + wallet ' + naira(o.wallet_amount / 100) : ''))}${row('Order total', naira(o.total))}${row('Refund the rules suggest', naira(r.requested_amount))}
    ${r.decided_by ? row('Decision', `${e(r.decided_by)} · ${dt(r.decided_at)}${r.decision_note ? '<br>' + e(r.decision_note) : ''}`) : ''}

    ${r.last_error ? `<div class="note" style="margin-top:8px"><b>The last settlement attempt failed:</b> ${e(r.last_error)} Nothing was refunded.</div>` : ''}
    ${(d.channels || []).some((c) => c.notes.length) ? `<div style="margin:10px 0;padding:10px 12px;border:1px solid #fde68a;background:#fffbeb;border-radius:8px"><b>Where these items came from</b>${d.channels.map((c) => `<div style="margin-top:6px"><span class="pill">${{ own: 'Our stock', partner: 'Partner store', dropship: 'Dropship', imported: 'Imported' }[c.channel]}</span> ${e(c.name)} × ${c.qty}${c.supplier_return ? ` · supplier return: ${e(c.supplier_return)}` : ''}${c.notes.map((n) => `<div class="mu2">${e(n)}</div>`).join('')}</div>`).join('')}</div>` : ''}
    ${r.recommended_by ? row('Reviewed by', `${e(r.recommended_by)}: recommends ${naira(r.recommended_amount)}${r.recommended_note ? '<br>' + e(r.recommended_note) : ''}`) : ''}${r.approval ? row('Approved by', r.approval === 'auto' ? 'Auto-approval rule (small amount)' : 'The owner') : ''}${r.auto_settle ? row('Refund sending', r.auto_settle === 'done' ? 'Sent automatically' : r.auto_settle === 'failed' ? '<b style="color:#b42318">Automatic refund failed: retry below</b>' : 'Cannot be sent automatically: settle by hand') : ''}
    ${(r.status === 'requested' || (r.status === 'recommended' && isOwner)) && canOrders ? `<h3 style="margin:14px 0 6px">${isOwner ? 'Your decision' : 'Your review'}</h3>

      <label class="f">Refund to ${isOwner ? 'approve' : 'recommend'} (₦, at most ${naira(d.max_refund)})<input id="ra" type="number" min="1" max="${d.max_refund}" value="${Math.min(r.recommended_amount != null ? r.recommended_amount : r.requested_amount, d.max_refund)}"></label>
      <label class="f">Note to the customer (needed if you change the amount or decline)<textarea id="rn" rows="2" maxlength="500"></textarea></label>
      <div class="acts"><button class="btn" id="rap">${isOwner ? 'Approve and refund' : 'Recommend to owner'}</button><button class="btn danger" id="rrj">Decline</button><button class="btn ghost" id="rcl">Close</button></div>` : ''}
    ${r.status === 'awaiting_settlement' && canFinance && P ? `<h3 style="margin:14px 0 6px">Settle the refund: ${naira(r.approved_amount)}</h3>
      <p class="mu2" style="margin:0 0 6px">${P.wallet ? `${naira(P.wallet / 100)} goes back to the customer's VELTO wallet (that part was paid from the wallet). ` : ''}${P.card ? `${naira(P.card / 100)} ${P.cash_order ? 'was paid in cash on delivery, so it cannot go back to a card' : 'goes back to the card or bank account the customer paid with'}.` : ''}</p>
      <label class="f">How do you want to pay it back?<select id="rm"><option value="original" ${P.cash_order ? 'disabled' : ''}>Original payment${P.can_auto ? ' (sent automatically by ' + (P.gateway === 'stripe' ? 'Stripe' : 'Paystack') + ')' : ''}</option>${P.has_wallet ? '<option value="wallet">VELTO wallet (instant)</option>' : ''}<option value="manual">Paid manually (bank transfer or the payment dashboard)</option></select></label>
      <label class="f hide" id="rrw">Reference of the refund you paid<input id="rr" maxlength="120" placeholder="Bank or Paystack reference"></label>
      ${(d.vendor_shares || []).length ? `<label class="chk"><input type="checkbox" id="rcv" checked> Take it off the partner's balance: ${d.vendor_shares.map((v) => e(v.name || 'Partner') + ' ' + naira(v.amount)).join(', ')}</label><p class="mu2" style="margin:0 0 6px;font-size:12px">Untick if we cover this one (for example a delivery mistake). Not applied when the whole order is refunded: that order simply drops out of the partner's earnings.</p>` : ''}
      <label class="chk"><input type="checkbox" id="rst" ${['unopened', 'opened_unused'].some((c) => r.condition === ({ unopened: 'Unopened', opened_unused: 'Opened but unused' })[c]) ? 'checked' : ''}> Put the returned items back in stock</label>
      <div class="acts"><button class="btn" id="rsl">Settle refund</button><button class="btn ghost" id="rcl">Close</button></div>` : ''}
    ${r.status === 'awaiting_settlement' && !canFinance ? '<p class="mu2">This refund is waiting for someone with Finance access to settle it.</p>' : ''}
    ${r.status === 'recommended' && !isOwner ? '<p class="mu2">This return is waiting for the owner\'s final approval.</p>' : ''}
    ${!['requested', 'awaiting_settlement'].includes(r.status) || (r.status === 'requested' && !canOrders) || (r.status === 'recommended' && isOwner && !canOrders) ? '<div class="acts"><button class="btn ghost" id="rcl">Close</button></div>' : ''}`, true);
  const mon = (sel, fn, ev = 'click') => { const x = $(sel, modal); if (x) x.addEventListener(ev, guard(fn)); };
  const send = (btn, url, body, msg) => async () => { const x = $(btn, modal); try { x.disabled = true; const r = await api(url, { body }); toast(typeof msg === 'function' ? msg(r) : msg); closeModal(); await views.returns(); } catch (er) { x.disabled = false; toast(er.message, 'bad'); } };
  mon('#rcl', closeModal);
  mon('#rap', () => send('#rap', `/api/admin/returns/${id}/approve`, { amount: Number($('#ra', modal).value), note: $('#rn', modal).value }, (x) => x.stage === 'recommended' ? 'Sent to the owner for final approval.' : x.auto && x.auto.ok ? 'Approved and refunded automatically.' : x.auto && x.auto.error ? 'Approved, but the automatic refund failed: ' + x.auto.error : 'Approved. This refund must be settled by hand (no automatic route for this payment).')());
  mon('#rrj', () => send('#rrj', `/api/admin/returns/${id}/reject`, { note: $('#rn', modal).value }, 'Declined. The customer has been told.')());
  if ($('#rm', modal)) { const sync = () => $('#rrw', modal).classList.toggle('hide', $('#rm', modal).value !== 'manual'); $('#rm', modal).addEventListener('change', sync); if (P && P.cash_order) $('#rm', modal).value = P.has_wallet ? 'wallet' : 'manual'; sync(); }
  mon('#rsl', () => send('#rsl', `/api/admin/returns/${id}/settle`, { method: $('#rm', modal).value, reference: $('#rr', modal).value, restock: $('#rst', modal).checked, charge_vendor: $('#rcv', modal) ? $('#rcv', modal).checked : true }, (x) => 'Refund settled' + (x.gateway_status && x.card ? ` (${x.gateway_status})` : ''))());
}

const deliveryAdmin = (o, riders) => {
  if (o.delivery === 'pickup' || ['pending', 'delivered', 'cancelled'].includes(o.status) && !o.rider_id) return '';
  const active = ['paid', 'confirmed', 'processing', 'shipped'].includes(o.status);
  const late = o.promised_at && active && Number(o.promised_at) < Date.now() / 1000;
  return `<div class="nop" style="margin-top:14px"><h3>Delivery</h3>${o.lat != null ? `<p class="mu2" style="margin:0 0 6px">Pin: <a href="https://www.google.com/maps?q=${o.lat},${o.lng}" target="_blank" rel="noopener">${o.lat.toFixed(5)}, ${o.lng.toFixed(5)}</a> · ${o.dist_km} km${o.landmark ? ' · ' + e(o.landmark) : ''}</p>` : ''}
   ${o.promised_at ? `<p style="margin:0 0 6px">Promised <b>${dt(o.promised_at)}</b>${late ? ' <b style="color:var(--bad)">LATE</b>' : ''}${o.delivered_at ? ' · delivered ' + dt(o.delivered_at) : ''}</p>` : ''}
   <p class="mu2" style="margin:0 0 6px">Placed ${dt(o.created)} · Accepted ${o.accepted_at ? dt(o.accepted_at) : '—'} · Picked up ${o.picked_up_at ? dt(o.picked_up_at) : '—'} · On the way ${o.on_way_at ? dt(o.on_way_at) : '—'}</p>
   ${active ? `<label class="f">Rider<select id="orider"><option value="">Not assigned</option>${riders.map((r) => `<option value="${r.id}" ${Number(o.rider_id) === Number(r.id) ? 'selected' : ''}>${e(r.name)}${r.coverage ? ' (' + e(r.coverage) + ')' : ''}</option>`).join('')}</select></label>` : ''}
   ${o.handover_locked ? '<p style="color:var(--bad);margin:6px 0"><b>Locked:</b> too many wrong handover codes.</p>' : ''}
   ${['processing', 'shipped'].includes(o.status) ? '<div class="acts" style="justify-content:flex-start"><button class="btn ghost sm" id="ho-complete">Complete without code…</button><button class="btn ghost sm" id="ho-reset">Unlock / new code…</button></div>' : ''}</div>`;
};
async function orderModal(id) {
  const { order: o } = await api('/api/admin/orders/' + id);

  <div class="tw"><table class="t" style="margin-top:12px"><tr><th>Item</th><th>Sold by</th><th>Qty</th><th>Price</th><th>Total</th><th>Our commission</th></tr>${o.items.map((i) => `<tr><td>${e(i.name)}<div class="mu2">${e(i.variant_label || '')}</div></td><td>${e(i.vendor_name || 'Shop-Beta')}</td><td>${i.qty}</td><td>${naira(i.price)}</td><td>${naira(i.price * i.qty)}</td><td>${i.vendor_id ? naira(i.commission) + ' <span class="mu2">(' + Number(i.commission_pct) + '%)</span>' : '—'}</td></tr>`).join('')}
  <tr><td colspan="3" class="mu2">Subtotal</td><td>${naira(o.subtotal)}</td></tr>${o.discount ? `<tr><td colspan="3" class="mu2">Discount ${e(o.coupon || '')}</td><td>−${naira(o.discount)}</td></tr>` : ''}<tr><td colspan="3" class="mu2">Delivery</td><td>${naira(o.delivery_fee)}</td></tr><tr><td colspan="3"><b>Total</b></td><td><b>${naira(o.total)}</b></td></tr></table></div>
  <h3 style="margin-top:14px">History</h3><ul class="tl">${o.events.map((x) => `<li><b>${e(x.status)}</b> · <span class="mu2">${dt(x.created)}</span>${x.note ? '<br>' + e(x.note) : ''}</li>`).join('')}</ul>
  ${o.status === 'refunded' ? '<p class="mu">This order is refunded and cannot be changed.</p>' : o.status === 'cancelled' && o.payment_status !== 'paid' ? '<p class="mu">This order is cancelled and cannot be changed.</p>' : `<div class="nop"><div class="fgrid"><label class="f">Update status<select id="ost">${STATUSES.map((s) => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></label><label class="f">Note (optional, shown in history)<input id="onote" maxlength="300"></label></div></div>`}
  ${deliveryAdmin(o, riders)}
  <div class="acts"><button class="btn ghost sm" id="oprint">🖨 Print packing slip</button><button class="btn ghost" id="oclose">Close</button>${o.status === 'cancelled' ? '' : '<button class="btn" id="osave">Save status</button>'}</div>`, true);
  const asg = $('#orider'); if (asg) asg.addEventListener('change', guard(async () => { await api(`/api/admin/orders/${id}/rider`, { method: 'PUT', body: { riderId: asg.value || null } }); toast('Rider updated'); orderModal(id); }));
  for (const act of ['complete', 'reset']) { const b = $('#ho-' + act); if (b) b.addEventListener('click', guard(async () => {
    const reason = prompt(act === 'complete' ? 'Why is this delivery being completed without the customer code? (saved on the order, at least 10 characters)' : 'Why is the delivery being unlocked? A new code will be issued. (saved on the order, at least 10 characters)'); if (!reason) return;
    const cash = act === 'complete' && o.payment_method === 'pod' ? confirm('Was the cash collected from the customer?') : false;

  })); }
  $('#oclose').addEventListener('click', closeModal); $('#oprint').addEventListener('click', () => window.print());
  const sv = $('#osave'); if (sv) sv.addEventListener('click', guard(async () => {
    const st = $('#ost').value; if (st === 'cancelled' && !confirm('Cancel this order? Stock will be returned.')) return;
    await api('/api/admin/orders/' + id, { method: 'PUT', body: { status: st, note: $('#onote').value } }); toast('Order updated'); closeModal(); route();
  }));
}

async function rfqDetailAdmin(ref) {

  const edit = can('rfq', true), pricing = edit && ['received', 'review', 'sourcing', 'quote_prepared', 'quote_sent'].includes(r.raw_status);
  const lines = r.items.map((i) => ({ ...i, drop: false, price: i.unit_price == null ? '' : i.unit_price, note: i.item_note || '' }));
  const q = r.quote || {};
  const act = [];
  if (edit) {
    if (r.raw_status === 'submitted') act.push(['received', 'Mark as received']);
    if (['submitted', 'received', 'sourcing'].includes(r.raw_status)) act.push(['review', 'Start review']);

  }
  mn(`<div class="hd"><h1><a class="btn ghost sm" id="rback">← All requests</a> ${e(r.ref)}</h1><div><span class="pill ${r.status === 'rejected' || r.status === 'expired' ? 'cancelled' : 'processing'}">${e(r.label)}</span> <a class="btn ghost sm" href="/api/admin/rfq/${e(r.ref)}/download.xlsx">Download Excel</a></div></div>
    <div class="panel"><div class="grid2"><div><b>${e(r.company)}</b><div class="mu">${e(r.contact_name)} · ${e(r.phone)} · ${e(r.email)}</div><div style="margin-top:6px">Deliver to <b>${e(r.delivery_location)}</b>${r.required_date ? ` · needed by <b>${e(r.required_date)}</b>` : ''}</div>${r.comments ? `<div class="mu" style="margin-top:6px">${e(r.comments)}</div>` : ''}</div>
      <div>${edit && r.raw_status !== 'draft' ? `<label class="f">Assigned to<select id="rasg"><option value="">Nobody</option>${officers.map((o) => `<option value="${o.id}" ${r.assigned_to === o.id ? 'selected' : ''}>${e(o.name)}</option>`).join('')}</select></label>` : `<div>Assigned to <b>${e(r.assigned_name) || 'nobody'}</b></div>`}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${act.map(([k, t]) => `<button class="btn sm" data-st="${k}">${t}</button>`).join('')}${edit && ['submitted', 'received', 'review', 'sourcing', 'quote_prepared'].includes(r.raw_status) ? '<button class="btn ghost sm" id="rrej">Reject request</button>' : ''}</div></div></div></div>

      <div><label class="f">Note to the buyer<textarea id="rnote" rows="2" maxlength="500">${e(q.note || '')}</textarea></label><label class="f">Shipment plan<textarea id="rship" rows="2" maxlength="500">${e(q.shipment_plan || '')}</textarea></label></div></div>

    ${edit && r.raw_status === 'quote_sent' ? '<p class="mu2">The quotation is with the buyer. Saving new prices above will pull it back for revision.</p>' : ''}
    ${edit && r.raw_status === 'accepted' ? '<div style="margin-top:12px"><p>The buyer accepted. Every line must be matched to a catalogue product with enough stock before you convert it. For items we do not stock yet, add the product in Products and match it here.</p><button class="btn" id="rconv">Convert to sales order</button></div>' : ''}
    ${r.sales_ref ? `<p style="margin-top:12px">Sales order <b>${e(r.sales_ref)}</b> · <a href="#/wholesale" id="rtow">open Wholesale</a></p>` : ''}</div>
    <div class="grid2"><div class="panel"><h3 style="margin-top:0">Documents</h3>${r.files.map((f) => `<div><a href="/api/admin/rfq/${e(r.ref)}/files/${f.id}">📎 ${e(f.name)}</a> <span class="mu2">${Math.round(f.size / 1024)} KB</span></div>`).join('') || '<p class="mu">None attached.</p>'}</div>
    <div class="panel"><h3 style="margin-top:0">History</h3>${r.events.map((x) => `<div style="font-size:13px;padding:2px 0"><span class="mu">${dt(x.created)}</span> · <b>${e(x.label)}</b>${x.note ? ' · ' + e(x.note) : ''} <span class="mu2">${e(x.by)}</span></div>`).join('')}</div></div>`);
  const total = () => {
    const pct = $('#rsvc') && $('#rsvc').value !== '' ? Number($('#rsvc').value) : null; let goods = 0, missing = 0;
    lines.forEach((l, n) => { const v = l.drop ? null : l.price === '' ? null : Number(String(l.price).replace(/[₦,\s]/g, '')); if (!l.drop && v === null) missing++; const lt = v === null ? 0 : v * l.qty; goods += lt; const c = $(`[data-lt="${n}"]`); if (c) c.textContent = v === null ? '' : naira(lt); });
    const t = $('#rtot'); if (t) t.innerHTML = `<div><span>Goods</span><b>${naira(goods)}</b></div><div><span>Service fee</span><b>${pct === null ? 'default %' : naira(Math.round(goods * pct / 100))}</b></div>${missing ? `<p class="err" style="margin:6px 0 0">${missing} line${missing === 1 ? '' : 's'} still without a price.</p>` : ''}`;

  const saveBody = () => ({ items: lines.map((l) => ({ id: l.id, unit_price: l.price === '' ? null : Number(String(l.price).replace(/[₦,\s]/g, '')), product_id: l.product_id || null, item_note: l.note, drop: l.drop })), logistics_fee: $('#rlog').value ? Number($('#rlog').value.replace(/[₦,\s]/g, '')) : 0, service_pct: $('#rsvc').value, valid_days: Number($('#rvd').value) || 7, quote_note: $('#rnote').value, shipment_plan: $('#rship').value });

    let tm; $('#mq').addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(find, 300); }); find();

    wirePerms(modal); $('#sx').addEventListener('click', closeModal); const cu = $('#scu'); if (cu) cu.addEventListener('change', () => $('#spm').classList.toggle('hide', !cu.checked));

/* ---------------- wallet, rewards and card (administrators) ---------------- */
const atime = (t) => (t ? new Date(t * 1000).toLocaleString('en-NG', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '');
const lbl = (k) => String(k).replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, (c) => c.toUpperCase());
// Shows any report object: numbers and text as tiles, nested objects as blocks, lists as small tables. Money in these reports is already in Naira.
const kvHtml = (o, depth = 0) => {
  if (o == null) return '<span class="mu">—</span>';
  if (Array.isArray(o)) {
    if (!o.length) return '<span class="mu">None</span>';
    if (typeof o[0] !== 'object') return e(o.join(', '));
    const cols = Object.keys(o[0]).filter((k) => typeof o[0][k] !== 'object');
    return `<div style="overflow:auto"><table class="tbl"><tr>${cols.map((c) => `<th>${e(lbl(c))}</th>`).join('')}</tr>${o.slice(0, 50).map((r) => `<tr>${cols.map((c) => `<td>${/^(created|updated|occurred|date|ends|starts)$/.test(c) && Number(r[c]) > 1e9 ? atime(Number(r[c])) : e(r[c])}</td>`).join('')}</tr>`).join('')}</table></div>`;
  }
  if (typeof o === 'object') {
    const sc = Object.entries(o).filter(([, v]) => v === null || typeof v !== 'object'), nested = Object.entries(o).filter(([, v]) => v !== null && typeof v === 'object');
    return `${sc.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:8px 0">${sc.map(([k, v]) => `<div class="stat"><div class="l">${e(lbl(k))}</div><div class="v" style="font-size:${depth ? 17 : 20}px">${typeof v === 'boolean' ? (v ? 'Yes' : 'No') : typeof v === 'number' ? v.toLocaleString('en-NG') : e(v === null ? '—' : v)}</div></div>`).join('')}</div>` : ''}${nested.map(([k, v]) => `<h4 style="margin:12px 0 4px">${e(lbl(k))}</h4>${kvHtml(v, depth + 1)}`).join('')}`;
  }
  return e(o);
};

    <div style="margin-top:12px"><button class="btn" id="igo" ${!good || (S.mode === 'update' && !S.confirm) ? 'disabled' : ''}>${S.mode === 'create' ? `Import ${good} product${good === 1 ? '' : 's'}` : `Apply ${good} change${good === 1 ? '' : 's'}`}</button> <button class="btn ghost" id="iback">Back to columns</button> <button class="btn ghost" id="ireset">Start over</button></div></div>`;
  };
  const stepProg = () => `<div class="panel"><h3 style="margin-top:0">Importing…</h3><div class="pbar2"><i style="width:${S.prog.pct}%"></i></div><p class="mu2">${S.prog.done.toLocaleString('en')} of ${S.prog.total.toLocaleString('en')} rows processed. Please keep this page open.</p></div>`;
  const stepDone = () => { const d = S.done; return `<div class="panel"><h3 style="margin-top:0">Import finished</h3><div class="stats"><span class="pill ok">${d.created} created</span> <span class="pill ok">${d.updated} updated</span> <span class="pill ${d.failed ? 'bad' : ''}">${d.failed} failed</span></div>${d.failed ? `<p><a class="btn ghost" href="/api/admin/catalog/history/${d.importId}/errors.csv" download>⬇ Download error report</a></p>` : ''}<p class="mu2">Add photos by opening each product on the Products page.</p><button class="btn" id="ireset">Import another file</button></div>`; };
  const exportBox = () => `<div class="panel"><h3 style="margin-top:0">Export products</h3><div class="tbar">
    <select id="xf">${Object.entries(FL).map(([k, v]) => `<option value="${k}">${e(v)}</option>`).join('')}</select>
    <select id="xc" style="display:none"><option value="">Choose category</option>${meta.lookups.categories.map((c) => `<option value="${c.id}">${e(c.name)} (${e(c.store)})</option>`).join('')}</select>

    <select id="xp" style="display:none"><option value="">Choose partner</option>${meta.lookups.partners.map((p) => `<option value="${p.id}">${e(p.name)}</option>`).join('')}</select>
    <select id="xfmt"><option value="xlsx">Excel (.xlsx)</option><option value="csv">CSV</option></select>
    <button class="btn" id="xgo">⬇ Export</button></div><p class="mu2">To export only some products, tick them on the Products page and press "Export selected". The export uses the same columns as the import template, so you can edit it and import it back in Update mode.</p></div>`;
  const histBox = () => `<div class="panel"><h3 style="margin-top:0">History</h3>${history.length ? `<div class="tw"><table class="t"><tr><th>When</th><th>Type</th><th>File</th><th>By</th><th>Result</th><th></th></tr>${history.map((h) => `<tr><td>${new Date(h.created * 1000).toLocaleString('en-NG', { dateStyle: 'medium', timeStyle: 'short' })}</td><td>${h.kind === 'export' ? 'Export' : h.mode === 'update' ? 'Import (update)' : 'Import (create)'}</td><td>${e(h.filename || h.detail || '')}</td><td>${e(h.user_name)}</td><td>${h.kind === 'export' ? h.total + ' rows' : `${h.created_n} created, ${h.updated_n} updated, ${h.failed_n} failed`}</td><td>${h.has_errors && h.kind === 'import' ? `<a href="/api/admin/catalog/history/${h.id}/errors.csv" download>Error report</a>` : ''}</td></tr>`).join('')}</table></div>` : '<p class="mu2">Nothing yet.</p>'}</div>`;

  function paint() {
    let body;
    if (S.busy) body = `<div class="panel"><p>${e(S.busy)}</p></div>`;
    else if (S.prog) body = stepProg();
    else if (S.done) body = stepDone();
    else if (S.v) body = stepPreview();
    else if (S.parsed) body = stepMap();
    else body = stepFile();
    mn(hd('Import & Export', '<a class="btn ghost sm" href="#/products">← Products</a>') + body + (S.prog || S.busy ? '' : exportBox() + histBox()));
    wire();
  }
  function wire() {
    const reset = () => { Object.assign(S, { file: null, parsed: null, mapping: {}, rows: [], v: null, confirm: false, prog: null, done: null }); paint(); };
    on('#ireset', 'click', reset);
    onAll('[name=imode]', 'change', (el) => { S.mode = el.value; });
    const take = guard(async (f) => {
      if (!f) return;
      if (!/\.(xlsx|csv)$/i.test(f.name)) throw new Error('Please choose an .xlsx or .csv file.');
      if (f.size > 10 * 1024 * 1024) throw new Error('That file is over 10 MB. Split it into smaller files.');
      S.busy = 'Reading ' + f.name + '…'; paint();
      try { S.parsed = await api('/api/admin/catalog/parse', { body: { filename: f.name, data: toB64(await f.arrayBuffer()) } }); S.file = f.name; S.mapping = { ...S.parsed.mapping }; }
      finally { S.busy = ''; paint(); }
    });
    on('#ifile', 'change', (ev) => take(ev.target.files[0]));
    const dz = $('#idrop'); if (dz) { dz.addEventListener('dragover', (ev) => { ev.preventDefault(); dz.classList.add('over'); }); dz.addEventListener('dragleave', () => dz.classList.remove('over')); dz.addEventListener('drop', (ev) => { ev.preventDefault(); dz.classList.remove('over'); take(ev.dataTransfer.files[0]); }); }
    onAll('[data-map]', 'change', (el) => { S.mapping[el.dataset.map] = el.value; });
    on('#imapok', 'click', guard(async () => { S.rows = buildRows(); await revalidate(); }));
    on('#iback', 'click', () => { S.v = null; paint(); });
    on('#imkcat', 'click', async () => { const r = await api('/api/admin/catalog/missing-categories', { body: { rows: S.rows, create: true } }); toast(r.created + ' categor' + (r.created === 1 ? 'y' : 'ies') + ' created' + (r.unknownDepartments.length ? '. Unknown departments left alone: ' + r.unknownDepartments.map((d) => d.name).join(', ') : '')); await revalidate(); });
    on('#iconf', 'change', (ev) => { S.confirm = ev.target.checked; const g = $('#igo'); if (g) g.disabled = !S.confirm; });
    onAll('[data-fix]', 'click', (el) => {
      const line = Number(el.dataset.fix), row = S.rows.find((r) => r.line === line), res = S.v.results.find((r) => r.line === line);
      openModal(`<h3>Fix line ${line}</h3><p style="color:var(--bad,#c0392b)">${res.errors.map(e).join('<br>')}</p><div class="fgrid">${meta.fields.map((f) => `<label>${e(f.header)}<input data-fx="${e(f.key)}" value="${e(row[f.key] || '')}"></label>`).join('')}</div><div style="margin-top:12px"><button class="btn" id="fxok">Save and re-check</button> <button class="btn ghost" id="fxno">Cancel</button></div>`, true);
      $('#fxno').addEventListener('click', closeModal);
      $('#fxok').addEventListener('click', guard(async () => { document.querySelectorAll('[data-fx]').forEach((i) => { row[i.dataset.fx] = i.value; }); closeModal(); await revalidate(); }));
    });
    on('#igo', 'click', guard(async () => {
      S.prog = { pct: 0, done: 0, total: S.rows.length }; paint();
      let importId, created = 0, updated = 0, failed = 0;
      try {
        for (let i = 0; i < S.rows.length; i += 500) {
          const chunk = S.rows.slice(i, i + 500);
          if (chunk.length) { const r = await api('/api/admin/catalog/commit', { body: { rows: chunk, mode: S.mode, importId, filename: S.file, total: S.rows.length, confirmUpdate: S.mode === 'update' ? true : undefined } }); importId = r.importId; created += r.created; updated += r.updated; failed += r.failed; }
          S.prog.done = Math.min(S.rows.length, i + 500); S.prog.pct = Math.round(S.prog.done / S.rows.length * 100); const bar = $('.pbar2 i'); if (bar) bar.style.width = S.prog.pct + '%'; const t = $('.pbar2 + p'); if (t) t.textContent = `${S.prog.done.toLocaleString('en')} of ${S.prog.total.toLocaleString('en')} rows processed. Please keep this page open.`;
        }
        S.done = { importId, created, updated, failed };
      } catch (err) { S.prog = null; paint(); throw err; }
      S.prog = null; S.v = null; history = await hist(); paint(); toast('Import finished');
    }));
    on('#xf', 'change', (ev) => { const v = ev.target.value; $('#xc').style.display = v === 'category' ? '' : 'none'; $('#xb').style.display = v === 'brand' ? '' : 'none'; $('#xp').style.display = v === 'partner' ? '' : 'none'; });
    on('#xgo', 'click', guard(async () => {
      const f = $('#xf').value, q = new URLSearchParams({ filter: f, format: $('#xfmt').value });
      if (f === 'category') { if (!$('#xc').value) throw new Error('Choose a category.'); q.set('category', $('#xc').value); }
      if (f === 'brand') { if (!$('#xb').value) throw new Error('Choose a brand.'); q.set('brand', $('#xb').value); }
      if (f === 'partner') { if (!$('#xp').value) throw new Error('Choose a partner.'); q.set('partner', $('#xp').value); }
      location.href = '/api/admin/catalog/export?' + q; setTimeout(async () => { history = await hist(); if (!S.parsed && !S.done) paint(); }, 2500);
    }));
  }
  paint();
};

const agoS = (s) => (s == null ? '—' : s < 5 ? 'just now' : s < 90 ? s + 's ago' : s < 5400 ? Math.round(s / 60) + ' min ago' : Math.round(s / 3600) + ' h ago');
const mkPill = (k) => { const m = MARK[k] || MARK.offline; return `<span class="rk-pill" style="background:${m[0]}">${m[1]}</span>`; };
const RIDER_API = '/api/admin/rider-ops';
const rq = (qs) => Object.entries(qs).filter(([, v]) => v).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');

    <select id="rf-f"><option value="">Any freshness</option>${[['live', 'Live'], ['recent', 'Recently updated'], ['stale', 'Stale'], ['gps_disabled', 'GPS disabled'], ['permission_denied', 'Permission denied'], ['offline', 'Offline']].map(([k, l]) => `<option value="${k}" ${RS.f.freshness === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
