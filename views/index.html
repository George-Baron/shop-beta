<script>
// Runs before first paint: restores dark/light mode and the last department theme (no flash of the wrong design).
(function () {
  try {
    var r = document.documentElement;
    var m = JSON.parse(localStorage.getItem('sb_mode') || 'null'); if (m) r.setAttribute('data-mode', m);
    if (!r.getAttribute('data-store')) { var m2 = /^\/d\/([a-z-]+)/.exec(location.pathname); var s = m2 ? m2[1] : JSON.parse(localStorage.getItem('sb_store') || 'null'); if (s) r.setAttribute('data-store', s); }
  } catch (e) { /* storage blocked */ }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Poppins:wght@600;700;800&display=swap">
<style>
:root{
 --bg:#fff;--surface:#fff;--surface-2:#f6f7f9;--text:#16181d;--muted:#667085;--border:#e5e8ee;
 --accent:#f26a21;--accent-ink:#fff;--accent-soft:#fff0e6;--accent-2:#ffb27a;
 --head-bg:#fff;--head-ink:#16181d;--hero-bg:linear-gradient(135deg,#fdeee3,#fff 70%);--hero-ink:#16181d;--hero-muted:#5b6270;
 --radius:14px;--radius-sm:10px;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.06);
 --font:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--display:var(--font);--ok:#16a34a;--warn:#d97706;--bad:#dc2626;
}
[data-store=fashion]{--accent:#f26a21;--accent-soft:#fff0e6;--hero-bg:linear-gradient(120deg,#fff1e6 0%,#fffaf6 55%,#fff 100%)}
[data-store=supermarket]{--accent:#16a34a;--accent-soft:#e3f6ea;--accent-2:#facc15;--head-bg:#0b4a2a;--head-ink:#fff;--hero-bg:linear-gradient(120deg,#0b4a2a,#13803f 85%);--hero-ink:#fff;--hero-muted:#cfeedd;--radius:12px}
[data-store=beauty]{--accent:#d6246e;--accent-soft:#fde7f1;--accent-2:#7c3aed;--hero-bg:linear-gradient(120deg,#fde9ee,#f7e6f6 60%,#fff);--display:'Playfair Display',Georgia,serif;--radius:18px}
[data-store=electronics]{--bg:#0a0d0c;--surface:#121715;--surface-2:#0e1311;--text:#f2f6f4;--muted:#9aa8a1;--border:#232b28;--accent:#22c55e;--accent-ink:#04130a;--accent-soft:#0f2a1a;--head-bg:#0a0d0c;--head-ink:#f2f6f4;--hero-bg:radial-gradient(ellipse at 80% 20%,#0f3d22,#0a0d0c 65%);--hero-ink:#f2f6f4;--hero-muted:#a9b8b0;--shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.5)}
[data-store=pharmacy]{--accent:#2563eb;--accent-soft:#e6efff;--surface-2:#f3f7ff;--hero-bg:linear-gradient(120deg,#d7e8ff,#eef5ff 70%,#fff);--radius:12px}
[data-store=food]{--accent:#f97316;--accent-soft:#fff0dd;--accent-2:#facc15;--bg:#fffaf0;--surface-2:#fff4dc;--hero-bg:linear-gradient(120deg,#fde58a,#fff3c4 70%,#fffaf0);--radius:22px;--display:'Poppins','Plus Jakarta Sans',system-ui,sans-serif}
[data-mode=dark]:not([data-store=electronics]){--bg:#0f1114;--surface:#171a1f;--surface-2:#12151a;--text:#eef0f4;--muted:#98a2b3;--border:#272c34;--head-bg:#12151a;--head-ink:#eef0f4;--hero-ink:#eef0f4;--hero-muted:#a8b0bd;--hero-bg:linear-gradient(120deg,#1b1f27,#12151a);--accent-soft:#2a1d14;--shadow:0 8px 24px rgba(0,0,0,.45)}
[data-mode=dark][data-store=supermarket]{--head-bg:#06301b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .2s}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0 0 .5em}h1{font-size:clamp(28px,4vw,46px);letter-spacing:-.02em}h2{font-size:clamp(20px,2.4vw,26px)}h3{font-size:18px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}.mu{color:var(--muted)}.hide{display:none!important}.sr{position:absolute;left:-9999px}
.loading-page{min-height:50vh;display:grid;place-items:center}.loading-page::after{content:'';width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.sm{padding:7px 14px;font-size:13px}.btn.lg{padding:14px 30px;font-size:16px}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--border)}.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}.btn.block{width:100%}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:block;font-weight:600;font-size:13px;margin-bottom:12px}label.f>input,label.f>select,label.f>textarea{margin-top:5px;font-weight:400}
.row{display:grid;gap:12px}.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:repeat(3,1fr)}@media(max-width:600px){.row.c2,.row.c3{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:13px;margin:6px 0}.note{background:var(--accent-soft);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* header */
.ann{background:var(--accent);color:var(--accent-ink);text-align:center;font-size:13px;font-weight:600;padding:7px 12px}
.head{background:var(--head-bg);color:var(--head-ink);position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border)}
.head-in{display:flex;align-items:center;gap:16px;padding:12px 16px;max-width:1200px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;font-family:var(--display);white-space:nowrap}.logo .mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:18px}
.search{flex:1;max-width:560px;position:relative}.search input{border-radius:999px;padding-left:16px;padding-right:44px;background:var(--surface-2)}
[data-store=supermarket] .search input{background:#fff;color:#16181d}[data-store=supermarket] .search button{color:#16181d}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:16px;padding:6px 10px}
.icons{display:flex;gap:6px;margin-left:auto}.ibtn{position:relative;background:none;border:0;color:inherit;cursor:pointer;font-size:20px;padding:8px;border-radius:10px;display:grid;place-items:center}.ibtn:hover{background:rgba(127,127,127,.15)}
.ibtn .dot{position:absolute;top:2px;right:0;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.menu-btn{display:none}
.tabs-dept{background:var(--surface-2);border-bottom:1px solid var(--border)}
.tabs-in{display:flex;gap:6px;max-width:1200px;margin:0 auto;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.dtab{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;color:var(--muted);border:1px solid transparent}
.dtab:hover{color:var(--text);background:var(--surface)}.dtab.on{background:var(--accent);color:var(--accent-ink)}
.nav2{display:flex;gap:22px;max-width:1200px;margin:0 auto;padding:0 16px 10px;font-size:14px;font-weight:600}.nav2 a{opacity:.85}.nav2 a:hover,.nav2 a.on{opacity:1;color:var(--accent)}
[data-store=supermarket] .nav2 a:hover,[data-store=supermarket] .nav2 a.on{color:var(--accent-2)}
@media(max-width:760px){.head-in{flex-wrap:wrap;gap:10px}.search{order:5;flex-basis:100%;max-width:none}.nav2{display:none}.logo span.t{font-size:18px}}
/* hero */
.hero{background:var(--hero-bg);color:var(--hero-ink);overflow:hidden}
.hero-in{max-width:1200px;margin:0 auto;padding:46px 16px;display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:center;min-height:340px}
.hero h1{margin-bottom:12px}.hero p{color:var(--hero-muted);font-size:17px;max-width:460px;margin:0 0 22px}
.hero .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--accent);margin-bottom:10px}
.hero-art{position:relative;height:300px;display:grid;place-items:center}
.hero-art .big{font-size:150px;line-height:1;filter:drop-shadow(0 18px 24px rgba(0,0,0,.25));animation:float 5s ease-in-out infinite}
.hero-art .sm1,.hero-art .sm2,.hero-art .sm3{position:absolute;font-size:64px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.2));animation:float 6s ease-in-out infinite}
.hero-art .sm1{left:6%;top:12%;animation-delay:-1s}.hero-art .sm2{right:4%;top:8%;animation-delay:-2.5s}.hero-art .sm3{right:14%;bottom:2%;animation-delay:-4s}
@keyframes float{50%{transform:translateY(-12px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:760px){.hero-in{grid-template-columns:1fr;padding:28px 16px;min-height:0}.hero-art{height:200px;order:-1}.hero-art .big{font-size:100px}.hero-art .sm1,.hero-art .sm2,.hero-art .sm3{font-size:42px}}
/* sections */
section.blk{padding:30px 0}.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}.sec-head a{font-size:13px;font-weight:700;color:var(--accent)}
.cats{display:flex;gap:18px;overflow-x:auto;padding:6px 2px 12px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;width:92px;text-align:center;font-size:13px;font-weight:600}
.cat .ci{width:68px;height:68px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:30px;transition:transform .15s}.cat:hover .ci{transform:translateY(-3px)}
.cats.square .cat{width:104px}.cats.square .cat .ci{border-radius:16px;width:92px;height:80px;border:1px solid var(--border);background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.pcard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.pcard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}.pimg{position:relative;display:block;aspect-ratio:1/1;background:var(--surface-2)}.pimg img{width:100%;height:100%;object-fit:cover}
.emoji-tile{width:100%;height:100%;display:grid;place-items:center;font-size:72px;background:linear-gradient(135deg,var(--accent-soft),var(--surface-2))}
.emoji-tile[data-h="1"]{background:linear-gradient(135deg,var(--surface-2),var(--accent-soft))}.emoji-tile[data-h="2"]{background:radial-gradient(circle at 30% 30%,var(--accent-soft),var(--surface-2))}
.emoji-tile span{filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}.badge.new{background:#7c3aed;color:#fff}.badge.out{background:#667085;color:#fff;left:auto;right:10px}
.wish{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;font-size:18px;display:grid;place-items:center;color:var(--muted);z-index:2}.wish.on{color:#e11d48}
.pbody{padding:12px;display:flex;flex-direction:column;gap:5px;flex:1}.pname{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.pprice{display:flex;gap:8px;align-items:baseline}.pprice b{font-size:16px}.pprice s{color:var(--muted);font-size:12px}.pbody .add{margin-top:auto}
.stars{color:#f5a524;font-size:13px;letter-spacing:1px}.stars i{color:var(--border);font-style:normal}.stars small{color:var(--muted);letter-spacing:0;margin-left:4px}.stars.none{color:var(--muted);font-size:12px;letter-spacing:0}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.trust .t{display:flex;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}.trust .t span{font-size:26px}.trust b{display:block;font-size:14px}.trust small{color:var(--muted)}
@media(max-width:700px){.trust{grid-template-columns:1fr}}
.promo2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.promo2{grid-template-columns:1fr}}
.promo{border-radius:var(--radius);padding:24px;background:linear-gradient(120deg,var(--accent-soft),var(--surface-2));border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;min-height:140px;overflow:hidden}.promo h3{margin:0 0 4px}.promo p{margin:0 0 12px;color:var(--muted);font-size:14px}.promo .pe{font-size:64px}
.banner{border-radius:var(--radius);background:linear-gradient(110deg,var(--accent),var(--accent-2));color:var(--accent-ink);padding:28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.banner h3{margin:0 0 4px;font-size:22px}.banner p{margin:0;opacity:.9}.banner .btn{background:#fff;color:#111;border-color:#fff}
/* footer */
footer.foot{background:var(--surface-2);border-top:1px solid var(--border);margin-top:40px;padding:36px 0 90px}
.foot-grid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:24px}@media(max-width:760px){.foot-grid{grid-template-columns:1fr 1fr}}
.foot h4{margin:0 0 10px;font-size:14px}.foot a{display:block;color:var(--muted);font-size:14px;padding:3px 0}.foot a:hover{color:var(--accent)}
.news{display:flex;gap:8px;margin-top:10px}.news input{border-radius:999px}.legal{margin-top:24px;padding-top:16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:13px}
.wa{position:fixed;right:16px;bottom:16px;z-index:60;width:54px;height:54px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
/* shop page */
.crumbs{font-size:13px;color:var(--muted);padding:14px 0}.crumbs a:hover{color:var(--accent)}
.shop{display:grid;grid-template-columns:250px 1fr;gap:24px;align-items:start}@media(max-width:860px){.shop{grid-template-columns:1fr}.filters{display:none}.filters.open{display:block}}
.filters{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:sticky;top:130px}.filters h4{margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.filters h4:first-child{margin-top:0}
.chk{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px;cursor:pointer}.chk input{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;background:var(--surface)}.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.shop-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.shop-top select{width:auto}
.pager{display:flex;gap:6px;justify-content:center;margin-top:24px;flex-wrap:wrap}.pager button{min-width:38px}
.empty{text-align:center;padding:50px 16px;color:var(--muted)}.empty .em{font-size:50px}
/* product page */
.pd{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:start}@media(max-width:800px){.pd{grid-template-columns:1fr}}
.gal .main{aspect-ratio:1/1;border-radius:var(--radius);overflow:hidden;background:var(--surface-2);border:1px solid var(--border);position:relative;cursor:zoom-in}.gal .main img,.gal .main .emoji-tile{width:100%;height:100%;object-fit:cover;transition:transform .2s;transform-origin:var(--zx,50%) var(--zy,50%)}.gal .main.zoom img{transform:scale(2)}.gal .main .emoji-tile{font-size:160px}
.thumbs{display:flex;gap:8px;margin-top:10px}.thumbs button{width:64px;height:64px;border-radius:10px;border:2px solid var(--border);padding:0;overflow:hidden;background:var(--surface-2);cursor:pointer}.thumbs button.on{border-color:var(--accent)}.thumbs img{width:100%;height:100%;object-fit:cover}
.pd h1{font-size:clamp(24px,3vw,34px)}.pd .price{font-size:28px;font-weight:800;margin:10px 0}.pd .price s{font-size:16px;color:var(--muted);font-weight:500;margin-left:8px}.pd .price .save{font-size:13px;color:var(--ok);margin-left:8px;font-weight:700}
.opt-label{font-weight:700;font-size:13px;margin:14px 0 6px}.stock{font-size:13px;font-weight:700}.stock.in{color:var(--ok)}.stock.low{color:var(--warn)}.stock.out{color:var(--bad)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:999px;overflow:hidden}.qty button{width:36px;height:36px;border:0;background:none;cursor:pointer;font-size:18px}.qty span{min-width:30px;text-align:center;font-weight:700}
.buy{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:32px 0 16px}.tabs2 button{background:none;border:0;padding:10px 16px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}.tabs2 button.on{color:var(--accent);border-color:var(--accent)}
.rev{padding:14px 0;border-bottom:1px solid var(--border)}.rev b{margin-right:8px}.dist{display:grid;grid-template-columns:44px 1fr 28px;gap:8px;align-items:center;font-size:13px;margin:3px 0}.bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden}.bar i{display:block;height:100%;background:#f5a524}
.starpick button{background:none;border:0;font-size:26px;color:var(--border);cursor:pointer}.starpick button.on{color:#f5a524}
/* drawer / modal / toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:90;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:var(--shadow)}.drawer.on{transform:none}

.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}.line .lt{width:64px;height:64px;border-radius:10px;overflow:hidden}.line .lt .emoji-tile{font-size:30px}.line .rm{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:0}
.sum{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}.sum.total{font-size:18px;font-weight:800;border-top:1px solid var(--border);margin-top:6px;padding-top:10px}
.free-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0}.free-bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)}.modal.on{display:flex}.modal .box{background:var(--surface);border-radius:var(--radius);padding:24px;width:min(460px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}

</head>
<body>
<div id="adm"></div>
<div id="shell"><div class="loading-page"></div></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Shopping cart" aria-hidden="true"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div id="toasts" aria-live="polite"></div>
<noscript><main style="max-width:700px;margin:40px auto;padding:0 16px;font-family:system-ui"><!--PRERENDER--><p>Please enable JavaScript to shop.</p></main></noscript>
<script>
(function () {
'use strict';
/* ===== core.js ===== */
// Shared state and helpers (no framework, no inline handlers: the CSP forbids them).
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const e = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const naira = (n) => '₦' + Number(n || 0).toLocaleString('en-NG');
const store = { cfg: null, user: null };

async function api(path, opts = {}) {
  const o = { method: opts.method || 'GET', headers: {}, credentials: 'same-origin' };
  if (opts.body !== undefined) { o.method = opts.method || 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opts.body); }
  let r; try { r = await fetch(path, o); } catch { throw new Error('Network problem. Check your connection and try again.'); }
  let d = {}; try { d = await r.json(); } catch { /* empty */ }
  if (!r.ok || d.error) { const err = new Error(d.error || 'Something went wrong.'); err.status = r.status; throw err; }
  return d;
}

const ls = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* ignore */ } },
};

/* ---- toasts ---- */
function toast(msg, kind = '') {
  const box = $('#toasts'); if (!box) return;
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; box.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 2800);
}

/* ---- cart (stored in the browser; the server re-prices everything at checkout) ---- */
const listeners = new Set();
const onChange = (fn) => listeners.add(fn);
const emit = () => listeners.forEach((f) => f());
const cart = {
  items: ls.get('sb_cart', []),
  save() { ls.set('sb_cart', this.items); emit(); },
  count() { return this.items.reduce((s, i) => s + i.qty, 0); },
  add(productId, variantId, qty = 1) {
    const it = this.items.find((i) => i.productId === productId && (i.variantId || null) === (variantId || null));
    if (it) it.qty = Math.min(99, it.qty + qty); else this.items.push({ productId, variantId: variantId || null, qty });
    this.save();
  },
  set(productId, variantId, qty) {
    const i = this.items.findIndex((x) => x.productId === productId && (x.variantId || null) === (variantId || null));
    if (i < 0) return; if (qty <= 0) this.items.splice(i, 1); else this.items[i].qty = Math.min(99, qty); this.save();
  },
  clear() { this.items = []; this.save(); },
  coupon: ls.get('sb_coupon', ''),
  setCoupon(c) { this.coupon = c || ''; ls.set('sb_coupon', this.coupon); emit(); },
};

/* ---- wishlist (local, merged into the account when signed in) ---- */
const wish = {
  ids: new Set(ls.get('sb_wish', [])),
  has(id) { return this.ids.has(id); },
  async toggle(id) {
    const on = !this.ids.has(id); if (on) this.ids.add(id); else this.ids.delete(id);
    ls.set('sb_wish', [...this.ids]); emit();
    if (store.user) { try { await api('/api/wishlist/' + id, { method: on ? 'POST' : 'DELETE', body: on ? {} : undefined }); } catch { /* local copy kept */ } }
    return on;
  },
};

function recent(id) { if (id === undefined) return ls.get('sb_recent', []); const l = ls.get('sb_recent', []).filter((x) => x !== id); l.unshift(id); ls.set('sb_recent', l.slice(0, 12)); }

/* ---- shared UI snippets ---- */
const stars = (r, n) => {
  const full = Math.round(r || 0);
  return `<span class="stars" aria-label="${r || 0} out of 5">${'★'.repeat(full)}<i>${'★'.repeat(5 - full)}</i>${n != null ? `<small>(${n})</small>` : ''}</span>`;
};
const tile = (p, cls = '') => p.image
  ? `<img class="${cls}" src="${e(p.image)}" alt="${e(p.name)}" loading="lazy">`
  : `<div class="emoji-tile ${cls}" data-h="${p.id % 6}" aria-hidden="true"><span>${e(p.emoji || '📦')}</span></div>`;

function productCard(p) {
  const hot = p.off ? `<span class="badge off">-${p.off}%</span>` : p.new_arrival ? '<span class="badge new">New</span>' : '';
  const out = p.stock <= 0 ? '<span class="badge out">Sold out</span>' : '';
  return `<article class="pcard">
    <a class="pimg" href="/product/${e(p.slug)}" data-link>${tile(p)}${hot}${out}</a>
    <button class="wish ${wish.has(p.id) ? 'on' : ''}" data-wish="${p.id}" aria-label="Save to wishlist" aria-pressed="${wish.has(p.id)}">${wish.has(p.id) ? '♥' : '♡'}</button>
    <div class="pbody">
      <a class="pname" href="/product/${e(p.slug)}" data-link>${e(p.name)}</a>
      ${p.rating_n ? stars(p.rating, p.rating_n) : '<span class="stars none">No reviews yet</span>'}
      <div class="pprice"><b>${naira(p.price)}</b>${p.compare_price > p.price ? `<s>${naira(p.compare_price)}</s>` : ''}</div>
      <button class="btn sm add" data-quick="${p.id}" ${p.stock <= 0 ? 'disabled' : ''}>${p.stock <= 0 ? 'Sold out' : 'Add to cart'}</button>
    </div></article>`;
}

function setStoreTheme(slug) {
  const r = document.documentElement;
  if (slug) { r.setAttribute('data-store', slug); ls.set('sb_store', slug); } else r.removeAttribute('data-store');
}
const getStoreSlug = () => document.documentElement.getAttribute('data-store') || ls.get('sb_store', 'fashion');

/* ===================== STOREFRONT ===================== */
function startStore() {
/* ===== cartui.js ===== */
let open = false, data = null, cfgRef = null, busy = 0;
function initCart(cfg) {
  cfgRef = cfg;
  const d = $('#drawer');
  d.addEventListener('click', async (ev) => {
    const t = ev.target;
    if (t.closest('#cclose')) return closeCart();
    const m = t.closest('[data-qty]');
    if (m) { const [pid, vid, delta] = m.dataset.qty.split(','); const line = data.lines.find((l) => l.productId == pid && (l.variantId || '') == vid); cart.set(Number(pid), vid ? Number(vid) : null, (line ? line.qty : 1) + Number(delta)); return; }
    const r = t.closest('[data-rm]'); if (r) { const [pid, vid] = r.dataset.rm.split(','); cart.set(Number(pid), vid ? Number(vid) : null, 0); return; }
    if (t.closest('#capply')) { const code = $('#ccode').value.trim(); if (!code) return; cart.setCoupon(code); return; }
    if (t.closest('#cclear')) { cart.setCoupon(''); return; }
    if (t.closest('#cgo')) { closeCart(); go('/checkout'); }
  });
  d.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.id === 'ccode') { ev.preventDefault(); $('#capply').click(); } });
  onChange(() => { if (open) refresh(); });
}
function closeCart() { open = false; $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('on'); }
function openCart() { open = true; $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('on'); refresh(); }
async function priceNow(extra = {}) {
  return api('/api/cart/price', { body: { items: cart.items, coupon: cart.coupon, ...extra } });
}
async function refresh() {
  const my = ++busy; const d = $('#drawer');
  if (!d.innerHTML) d.innerHTML = '<div class="loading-page"></div>';
  if (!cart.items.length) { data = { lines: [] }; return paint(); }
  try { const r = await priceNow(); if (my !== busy) return; data = r;
    // drop items the server says no longer exist, and cap quantities to stock
    let changed = false;
    for (const i of r.issues || []) { if (/no longer available/.test(i.message)) { const idx = cart.items.findIndex((x) => x.productId === i.productId); if (idx >= 0) { cart.items.splice(idx, 1); changed = true; } } }
    for (const l of r.lines) { const it = cart.items.find((x) => x.productId === l.productId && (x.variantId || null) === (l.variantId || null)); if (it && it.qty !== l.qty) { it.qty = l.qty; changed = true; } }
    if (changed) { cart.save(); return; }
    if (r.couponError) { toast(r.couponError, 'bad'); cart.setCoupon(''); return; }
    paint(); } catch (er) { d.innerHTML = `<header><h3>Your cart</h3><button class="ibtn" id="cclose" aria-label="Close">✕</button></header><div class="body"><p class="err">${e(er.message)}</p></div>`; }
}
function paint() {
  const d = $('#drawer'); const r = data; const free = Number(cfgRef.settings.free_shipping_threshold || 0);
  const rem = free ? Math.max(0, free - (r.subtotal - (r.discount || 0))) : 0;
  d.innerHTML = `<header><h3>Your cart (${cart.count()})</h3><button class="ibtn" id="cclose" aria-label="Close cart">✕</button></header>
  <div class="body">${!r.lines.length ? '<div class="empty"><div class="em">🛒</div><p>Your cart is empty.</p></div>' : `
    ${free ? `<div style="font-size:13px">${rem > 0 ? `Add <b>${naira(rem)}</b> more for free delivery` : '🎉 You qualify for free delivery'}</div><div class="free-bar"><i style="width:${Math.min(100, ((r.subtotal - (r.discount || 0)) / free) * 100)}%"></i></div>` : ''}
    ${r.lines.map((l) => `<div class="line"><a class="lt" href="/product/${e(l.slug)}" data-link>${tile({ id: l.productId, emoji: l.emoji, image: l.image, name: l.name })}</a>
      <div><a href="/product/${e(l.slug)}" data-link style="font-weight:600;font-size:14px">${e(l.name)}</a><div class="mu" style="font-size:12px">${e(l.variantLabel)}</div>
      <div class="qty" style="margin-top:6px"><button data-qty="${l.productId},${l.variantId || ''},-1" aria-label="Decrease">−</button><span>${l.qty}</span><button data-qty="${l.productId},${l.variantId || ''},1" aria-label="Increase" ${l.qty >= l.available ? 'disabled' : ''}>+</button></div></div>
      <div style="text-align:right"><b>${naira(l.price * l.qty)}</b><br><button class="rm" data-rm="${l.productId},${l.variantId || ''}">Remove</button></div></div>`).join('')}`}</div>
  ${r.lines.length ? `<footer>
    <div style="display:flex;gap:8px;margin-bottom:10px"><input id="ccode" placeholder="Promo code" value="${e(cart.coupon)}" aria-label="Promo code"><button class="btn ghost sm" id="capply">Apply</button></div>
    ${r.coupon ? `<div class="sum" style="color:var(--ok)"><span>Code ${e(r.coupon)} <button class="rm" id="cclear" style="color:var(--muted)">(remove)</button></span><span>−${naira(r.discount)}</span></div>` : ''}
    <div class="sum"><span>Subtotal</span><span>${naira(r.subtotal)}</span></div><div class="sum mu"><span>Delivery</span><span>Calculated at checkout</span></div>
    <button class="btn lg block" id="cgo" style="margin-top:10px">Checkout · ${naira(r.subtotal - (r.discount || 0))}</button></footer>` : ''}`;
}

/* ===== shop.js ===== */
/* ================= listing ================= */
async function shopView(main, u, cfg) {
  const q = Object.fromEntries(u.searchParams.entries());
  const seg = u.pathname.split('/').filter(Boolean); if (seg[0] === 'd' && seg[1]) q.store = seg[1];
  const params = new URLSearchParams(); for (const k of ['store', 'category', 'q', 'min', 'max', 'size', 'color', 'rating', 'sort', 'page', 'flag', 'instock']) if (q[k]) params.set(k, q[k]);
  const d = await api('/api/products?' + params.toString());
  const stObj = cfg.stores.find((s) => s.slug === q.store); const cats = cfg.categories.filter((c) => !q.store || c.store === q.store);
  const url = (over) => { const p = new URLSearchParams(params); for (const [k, v] of Object.entries(over)) { if (v === '' || v == null) p.delete(k); else p.set(k, v); } if (!('page' in over)) p.delete('page'); return '/shop?' + p.toString(); };

   <div class="shop"><aside class="filters" id="filters">
     <h4>Department</h4><div class="chips"><a class="chip ${!q.store ? 'on' : ''}" href="${url({ store: '', category: '' })}" data-link>All</a>${cfg.stores.map((s) => `<a class="chip ${q.store === s.slug ? 'on' : ''}" href="${url({ store: s.slug, category: '' })}" data-link>${e(s.tab_label)}</a>`).join('')}</div>
     ${cats.length ? `<h4>Category</h4><div class="chips">${cats.map((c) => `<a class="chip ${q.category === c.slug ? 'on' : ''}" href="${url({ category: q.category === c.slug ? '' : c.slug })}" data-link>${e(c.name)}</a>`).join('')}</div>` : ''}
     <h4>Price (₦)</h4><div class="row c2"><input id="pmin" type="number" min="0" placeholder="Min" value="${e(q.min || '')}" aria-label="Minimum price"><input id="pmax" type="number" min="0" placeholder="Max" value="${e(q.max || '')}" aria-label="Maximum price"></div><button class="btn sm ghost" id="papply" style="margin-top:8px">Apply</button>

     ${d.facets.colors.length ? `<h4>Colour</h4><div class="chips">${d.facets.colors.map((s) => `<a class="chip ${q.color === s ? 'on' : ''}" href="${url({ color: q.color === s ? '' : s })}" data-link>${e(s)}</a>`).join('')}</div>` : ''}
     <h4>Rating</h4><div class="chips">${[4, 3].map((r) => `<a class="chip ${q.rating == r ? 'on' : ''}" href="${url({ rating: q.rating == r ? '' : r })}" data-link>${r}★ &amp; up</a>`).join('')}</div>
     <h4>Availability</h4><label class="chk"><input type="checkbox" id="instock" ${q.instock ? 'checked' : ''}> In stock only</label>
     <p style="margin-top:14px"><a href="/shop${q.store ? '?store=' + e(q.store) : ''}" data-link class="mu" style="font-size:13px">Clear all filters</a></p></aside>
   <div>${d.products.length ? `<div class="grid">${d.products.map(productCard).join('')}</div>` : `<div class="empty"><div class="em">🔎</div><h3>No products found</h3><p>Try removing a filter or searching for something else.</p></div>`}
   ${d.pages > 1 ? `<nav class="pager" aria-label="Pages">${Array.from({ length: d.pages }, (_, i) => `<a class="btn sm ${d.page === i + 1 ? '' : 'ghost'}" href="${url({ page: i + 1 })}" data-link>${i + 1}</a>`).join('')}</nav>` : ''}</div></div></div>`;
  $('#sort').addEventListener('change', (ev) => go(url({ sort: ev.target.value })));

async function productView(main, slug, cfg) {
  const d = await api('/api/products/' + encodeURIComponent(slug)); const p = d.product;
  recent(p.id);
  const hasVar = p.variants.length > 0;
  const sizes = [...new Set(p.variants.map((v) => v.size).filter(Boolean))], colors = [...new Set(p.variants.map((v) => v.color).filter(Boolean))];
  const sel = { size: sizes.length === 1 ? sizes[0] : '', color: colors.length === 1 ? colors[0] : '', qty: 1 };
  const st = cfg.stores.find((s) => s.slug === p.store);
  const imgs = p.images.length ? p.images : [];
  const find = () => p.variants.find((v) => (!sizes.length || v.size === sel.size) && (!colors.length || v.color === sel.color));
  const stockOf = () => (hasVar ? (find() ? find().stock : null) : p.stock);
  const rec = recent().filter((i) => i !== p.id);
  let recProducts = []; if (rec.length) { try { recProducts = (await api('/api/products/by-ids', { body: { ids: rec.slice(0, 8) } })).products; } catch { /* optional */ } }
  main.innerHTML = `<div class="wrap">
   <nav class="crumbs"><a href="/" data-link>Home</a> › <a href="/d/${e(p.store)}" data-link>${e(st ? st.name : p.store)}</a> › ${p.category ? `<a href="/shop?store=${e(p.store)}&category=${e(p.category_slug)}" data-link>${e(p.category)}</a> › ` : ''}${e(p.name)}</nav>
   <div class="pd"><div class="gal"><div class="main" id="gmain">${imgs.length ? `<img src="${e(imgs[0])}" alt="${e(p.name)}">` : tile(p)}</div>${imgs.length > 1 ? `<div class="thumbs">${imgs.map((s, i) => `<button class="${i ? '' : 'on'}" data-img="${e(s)}" aria-label="Image ${i + 1}"><img src="${e(s)}" alt=""></button>`).join('')}</div>` : ''}</div>
   <div><div class="mu" style="font-size:13px;font-weight:700">${e(p.brand)}</div><h1>${e(p.name)}</h1>
     <div>${p.rating_n ? stars(p.rating, p.rating_n + ' reviews') : '<span class="mu">No reviews yet</span>'}</div>
     <div class="price">${naira(p.price)}${p.compare_price > p.price ? `<s>${naira(p.compare_price)}</s><span class="save">Save ${p.off}%</span>` : ''}</div>
     ${sizes.length ? `<div class="opt-label">${e(p.size_label || 'Size')}</div><div class="chips" id="osize">${sizes.map((s) => `<button class="chip ${sel.size === s ? 'on' : ''}" data-size="${e(s)}">${e(s)}</button>`).join('')}</div>` : ''}
     ${colors.length ? `<div class="opt-label">Colour</div><div class="chips" id="ocolor">${colors.map((s) => `<button class="chip ${sel.color === s ? 'on' : ''}" data-color="${e(s)}">${e(s)}</button>`).join('')}</div>` : ''}
     <p class="stock" id="stock" style="margin:14px 0 0"></p>
     <div class="buy"><div class="qty"><button id="qm" aria-label="Decrease">−</button><span id="qv">1</span><button id="qp" aria-label="Increase">+</button></div>
       <button class="btn lg" id="addbtn">Add to cart</button><button class="btn ghost lg" data-wish="${p.id}" id="wbtn">${wish.has(p.id) ? '♥ Saved' : '♡ Save'}</button></div>
     <div class="note">🚚 Delivery fee depends on your state, and is free over ${naira(cfg.settings.free_shipping_threshold)}. 💳 Pay by card, transfer or pay on delivery.</div>
     <p class="mu" style="font-size:12px;margin-top:10px">SKU ${e(p.sku)}</p></div></div>
   <div class="tabs2" role="tablist"><button class="on" data-tab="desc">Description</button><button data-tab="rev">Reviews (${p.rating_n})</button></div>
   <div id="tdesc" class="prose"><p style="color:var(--text)">${e(p.description).replace(/\n/g, '<br>')}</p></div>
   <div id="trev" class="hide">${reviewsHtml(p)}</div>
   ${d.related.length ? `<section class="blk"><div class="sec-head"><h2>You may also like</h2></div><div class="grid">${d.related.map(productCard).join('')}</div></section>` : ''}
   ${recProducts.length ? `<section class="blk"><div class="sec-head"><h2>Recently viewed</h2></div><div class="grid">${recProducts.map(productCard).join('')}</div></section>` : ''}</div>`;
  const upd = () => {
    const s = stockOf(), el = $('#stock'); const need = hasVar && (!find());
    el.className = 'stock ' + (need ? '' : s <= 0 ? 'out' : s <= 5 ? 'low' : 'in');
    el.textContent = need ? 'Select your options' : s <= 0 ? 'Out of stock' : s <= 5 ? `Only ${s} left!` : 'In stock';
    $('#addbtn').disabled = need || s <= 0; $('#qv').textContent = sel.qty;
    if (!need && sel.qty > s) { sel.qty = Math.max(1, s); $('#qv').textContent = sel.qty; }
  };
  main.addEventListener('click', (ev) => {
    const t = ev.target;
    const sz = t.closest('[data-size]'); if (sz) { sel.size = sel.size === sz.dataset.size ? '' : sz.dataset.size; $$('#osize .chip').forEach((c) => c.classList.toggle('on', c.dataset.size === sel.size)); upd(); }
    const co = t.closest('[data-color]'); if (co) { sel.color = sel.color === co.dataset.color ? '' : co.dataset.color; $$('#ocolor .chip').forEach((c) => c.classList.toggle('on', c.dataset.color === sel.color)); upd(); }
    if (t.closest('#qm')) { sel.qty = Math.max(1, sel.qty - 1); upd(); }
    if (t.closest('#qp')) { const s = stockOf() ?? 99; sel.qty = Math.min(Math.max(1, s), sel.qty + 1, 99); upd(); }
    const th = t.closest('[data-img]'); if (th) { $('#gmain').innerHTML = `<img src="${e(th.dataset.img)}" alt="${e(p.name)}">`; $$('.thumbs button').forEach((b) => b.classList.toggle('on', b === th)); }
    const tab = t.closest('[data-tab]'); if (tab) { $$('.tabs2 button').forEach((b) => b.classList.toggle('on', b === tab)); $('#tdesc').classList.toggle('hide', tab.dataset.tab !== 'desc'); $('#trev').classList.toggle('hide', tab.dataset.tab !== 'rev'); }
    if (t.closest('#addbtn')) { const v = find(); cart.add(p.id, v ? v.id : null, sel.qty); toast('Added to cart'); openCart(); try { if (window.gtag) window.gtag('event', 'add_to_cart', { value: p.price * sel.qty, currency: 'NGN' }); if (window.fbq) window.fbq('track', 'AddToCart'); } catch { /* blocked */ } }
    const star = t.closest('[data-star]'); if (star) { rating = Number(star.dataset.star); $$('.starpick button').forEach((b) => b.classList.toggle('on', Number(b.dataset.star) <= rating)); }
  });
  let rating = 0;
  main.addEventListener('submit', async (ev) => {
    if (ev.target.id !== 'rform') return; ev.preventDefault();
    if (!rating) return toast('Please choose a star rating', 'bad');
    try { await api('/api/products/' + p.id + '/reviews', { body: { rating, title: ev.target.title.value, body: ev.target.body.value, name: ev.target.name ? ev.target.name.value : '' } }); toast('Thank you for your review!'); go('/product/' + p.slug); } catch (er) { toast(er.message, 'bad'); }
  });
  const gm = $('#gmain'); if (imgs.length) { gm.addEventListener('mousemove', (ev) => { const r = gm.getBoundingClientRect(); gm.style.setProperty('--zx', ((ev.clientX - r.left) / r.width * 100) + '%'); gm.style.setProperty('--zy', ((ev.clientY - r.top) / r.height * 100) + '%'); }); gm.addEventListener('mouseenter', () => gm.classList.add('zoom')); gm.addEventListener('mouseleave', () => gm.classList.remove('zoom')); gm.addEventListener('click', () => gm.classList.toggle('zoom')); }
  upd();
  ldjson(p, cfg);
  return p.name;
}
function reviewsHtml(p) {
  const total = p.reviews.length || 1;
  return `<div class="row c2" style="align-items:start"><div>
    ${p.reviews.length ? `<div style="font-size:34px;font-weight:800">${p.rating} <span class="stars" style="font-size:20px">★</span></div>${p.dist.map((x) => `<div class="dist"><span>${x.stars} ★</span><div class="bar"><i style="width:${x.n / total * 100}%"></i></div><span>${x.n}</span></div>`).join('')}` : '<p class="mu">No reviews yet. Be the first!</p>'}
    ${p.reviews.map((r) => `<div class="rev"><b>${e(r.name)}</b>${stars(r.rating)}<div style="font-weight:600">${e(r.title)}</div><div class="mu">${e(r.body)}</div></div>`).join('')}</div>
    <form id="rform" class="card"><h3>Write a review</h3><div class="starpick" role="radiogroup" aria-label="Rating">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-star="${n}" aria-label="${n} stars">★</button>`).join('')}</div>
    ${store.user ? '' : '<label class="f">Your name<input name="name" required maxlength="60"></label>'}<label class="f">Title<input name="title" maxlength="80"></label><label class="f">Your review<textarea name="body" rows="3" maxlength="1000" required></textarea></label><button class="btn">Submit review</button></form></div>`;
}
function ldjson(p, cfg) {
  const old = document.getElementById('ldp'); if (old) old.remove();
  const s = document.createElement('script'); s.type = 'application/ld+json'; s.id = 'ldp';
  s.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'Product', name: p.name, description: p.description, sku: p.sku, brand: { '@type': 'Brand', name: p.brand }, offers: { '@type': 'Offer', priceCurrency: 'NGN', price: p.price, availability: p.stock > 0 ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock', url: location.href }, ...(p.rating_n ? { aggregateRating: { '@type': 'AggregateRating', ratingValue: p.rating, reviewCount: p.rating_n } } : {}) });
  document.head.appendChild(s);
}

async function home(main, slug) {
  const d = await api('/api/home/' + encodeURIComponent(slug));
  const k = hero[slug] ? slug : 'fashion';
  main.innerHTML = hero[k](d) + body[k](d);

}

/* ===== account.js ===== */
const STATUS = { pending: 'Order placed', paid: 'Paid', processing: 'Being prepared', shipped: 'Shipped', delivered: 'Delivered', cancelled: 'Cancelled' };
const FLOW = ['pending', 'paid', 'processing', 'shipped', 'delivered'];
const fmt = (t) => new Date(t * 1000).toLocaleString('en-NG', { dateStyle: 'medium', timeStyle: 'short' });
const field = (id, label, o = {}) => `<label class="f">${label}<input id="${id}" ${o.type ? `type="${o.type}"` : ''} ${o.req ? 'required' : ''} ${o.auto ? `autocomplete="${o.auto}"` : ''} ${o.ph ? `placeholder="${e(o.ph)}"` : ''} value="${e(o.val || '')}" ${o.max ? `maxlength="${o.max}"` : ''}></label>`;

async function view(main, seg, u, cfg) {
  const name = seg[0];
  if (name === 'checkout') return checkout(main, cfg);
  if (name === 'order') return orderPage(main, seg[1], u, cfg);
  if (name === 'login' || name === 'register') return authPage(main, name, u, cfg);
  if (name === 'forgot') return forgotPage(main, u);
  if (name === 'account') return account(main, u, cfg);
  if (name === 'wishlist') return wishlist(main);
  if (name === 'track') return track(main);
  return '';
}

/* ---------------- checkout ---------------- */
async function checkout(main, cfg) {
  if (!cart.items.length) { main.innerHTML = '<div class="wrap empty"><div class="em">🛒</div><h2>Your cart is empty</h2><p><a class="btn" href="/" data-link>Continue shopping</a></p></div>'; return 'Checkout'; }
  const user = store.user; let addrs = []; if (user) { try { addrs = (await api('/api/addresses')).addresses; } catch { /* optional */ } }
  const saved = ls.get('sb_checkout', {}); const A = addrs[0] || {};
  const st = { state: A.state || saved.state || '', delivery: 'standard', payment: '', data: null };
  main.innerHTML = `<div class="wrap page"><h1>Checkout</h1>${user ? '' : '<p class="note">Checking out as a guest. <a href="/login?next=/checkout" data-link style="color:var(--accent);font-weight:700">Sign in</a> to use saved addresses and track orders.</p>'}
   <form id="cof" class="row" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start" novalidate>
    <div style="display:grid;gap:18px">
     <div class="card"><h3>1. Contact</h3><div class="row c2">${field('cn', 'Full name', { req: 1, auto: 'name', val: user ? user.name : saved.name, max: 80 })}${field('cp', 'Phone', { req: 1, type: 'tel', auto: 'tel', ph: '0801 234 5678', val: (user && user.phone) || saved.phone })}</div>${field('ce', 'Email (for your receipt)', { req: 1, type: 'email', auto: 'email', val: user ? user.email : saved.email })}</div>
     <div class="card"><h3>2. Delivery address</h3>${addrs.length ? `<label class="f">Saved addresses<select id="saddr"><option value="">Enter a new address</option>${addrs.map((a) => `<option value="${a.id}">${e(a.label)} · ${e(a.address)}, ${e(a.state)}</option>`).join('')}</select></label>` : ''}
       <label class="f">State<select id="cs" required><option value="">Choose your state…</option>${cfg.zones.map((z) => `<option ${z.state === st.state ? 'selected' : ''}>${e(z.state)}</option>`).join('')}</select></label>
       <div id="addrfields"><div class="row c2">${field('cc', 'City / area', { val: A.city || saved.city, max: 60 })}${field('ca', 'Street address', { val: A.address || saved.address, max: 200 })}</div></div>
       <label class="f">Delivery notes (optional)<input id="cnotes" maxlength="300" placeholder="Landmark, gate code, preferred time…"></label></div>
     <div class="card"><h3>3. Delivery option</h3><div id="dopts" class="mu">Choose your state to see delivery options.</div></div>
     <div class="card"><h3>4. Payment</h3><div id="popts"></div></div></div>
    <aside class="card" style="position:sticky;top:130px"><h3>Order summary</h3><div id="osum" class="loading-page" style="min-height:120px"></div>
     <div style="display:flex;gap:8px;margin:12px 0"><input id="ocode" placeholder="Promo code" value="${e(cart.coupon)}"><button type="button" class="btn ghost sm" id="oapply">Apply</button></div>
     <p class="err hide" id="cerr" role="alert"></p><button class="btn lg block" id="place" disabled>Place order</button><p class="mu" style="font-size:12px;margin-top:8px">🔒 Secure checkout. Prices are confirmed by our server.</p></aside></form></div>`;
  const pay = cfg.payments;
  const methods = [];
  if (pay.paystack) methods.push(['paystack', '💳 Pay online', 'Card, bank transfer or USSD via Paystack' + (pay.demo ? ' (demo mode: no real money)' : '')]);
  if (pay.pod) methods.push(['pod', '💵 Pay on delivery', 'Pay cash or transfer to our rider when your order arrives']);
  st.payment = methods.length ? methods[0][0] : '';
  $('#popts').innerHTML = methods.length ? methods.map(([v, t, d], i) => `<label class="chk" style="padding:10px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px"><input type="radio" name="pm" value="${v}" ${i ? '' : 'checked'}><span><b>${t}</b><br><small class="mu">${d}</small></span></label>`).join('') : '<p class="err">No payment method is available right now.</p>';
  const err = (m) => { const el = $('#cerr'); el.textContent = m || ''; el.classList.toggle('hide', !m); };
  async function reprice() {
    try { const r = await priceNow({ state: st.state, delivery: st.delivery }); st.data = r;
      if (r.couponError) { err(r.couponError); cart.setCoupon(''); } 
      if (r.issues.length) err(r.issues[0].message);
      if (!r.lines.length) { go('/checkout', true); return; }
      const d = r.delivery;
      $('#osum').className = ''; $('#osum').innerHTML = r.lines.map((l) => `<div class="line" style="grid-template-columns:48px 1fr auto"><div class="lt" style="width:48px;height:48px">${tile({ id: l.productId, emoji: l.emoji, image: l.image, name: l.name })}</div><div style="font-size:13px"><b>${e(l.name)}</b><br><span class="mu">${e(l.variantLabel)} × ${l.qty}</span></div><b style="font-size:13px">${naira(l.price * l.qty)}</b></div>`).join('')
        + `<div class="sum"><span>Subtotal</span><span>${naira(r.subtotal)}</span></div>${r.discount ? `<div class="sum" style="color:var(--ok)"><span>Discount (${e(r.coupon)})</span><span>−${naira(r.discount)}</span></div>` : ''}<div class="sum"><span>Delivery</span><span>${d.options ? (d.fee ? naira(d.fee) : 'Free') : '—'}</span></div><div class="sum total"><span>Total</span><span>${naira(r.total)}</span></div>`;
      if (d.options) $('#dopts').innerHTML = Object.entries(d.options).map(([k, o]) => `<label class="chk" style="padding:10px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px"><input type="radio" name="dm" value="${k}" ${d.selected === k ? 'checked' : ''}><span style="flex:1"><b>${e(o.label)}</b> · ${o.fee ? naira(o.fee) : 'Free'}<br><small class="mu">${e(o.eta)}</small></span></label>`).join('') + (d.free ? '<p class="note">🎉 You qualify for free standard delivery.</p>' : d.threshold ? `<p class="mu" style="font-size:13px">Spend ${naira(d.threshold)} to get free standard delivery.</p>` : '');
      st.delivery = d.selected || st.delivery;
      const zone = cfg.zones.find((z) => z.state === st.state);
      $$('input[name=pm]').forEach((i) => { if (i.value === 'pod') { const ok = zone && zone.pod && st.delivery !== 'pickup'; i.disabled = !ok; if (!ok && i.checked) { const o = $$('input[name=pm]').find((x) => x.value !== 'pod' && !x.disabled); if (o) { o.checked = true; st.payment = o.value; } } } });
      $('#addrfields').classList.toggle('hide', st.delivery === 'pickup');
      $('#place').disabled = !st.state || !methods.length;
    } catch (er) { err(er.message); }
  }
  $('#cof').addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.id === 'cs') { st.state = t.value; reprice(); }
    if (t.name === 'dm') { st.delivery = t.value; reprice(); }
    if (t.name === 'pm') st.payment = t.value;
    if (t.id === 'saddr') { const a = addrs.find((x) => x.id == t.value); if (a) { $('#cs').value = a.state; $('#cc').value = a.city || ''; $('#ca').value = a.address; st.state = a.state; reprice(); } }
    if (t.id === 'ce' && /^[^@\s]+@[^@\s]+\.\S+$/.test(t.value)) api('/api/cart/abandon', { body: { email: t.value, items: cart.items } }).catch(() => {});
  });
  $('#oapply').addEventListener('click', () => { cart.setCoupon($('#ocode').value.trim()); err(''); reprice(); });
  $('#cof').addEventListener('submit', async (ev) => {
    ev.preventDefault(); err('');
    const g = (i) => $('#' + i).value.trim();
    if (!g('cn') || !g('ce') || !g('cp')) return err('Please fill in your name, email and phone number.');
    if (!st.state) return err('Please choose your state.');
    if (st.delivery !== 'pickup' && !g('ca')) return err('Please enter your street address.');
    const btn = $('#place'); btn.disabled = true; btn.textContent = 'Placing order…';
    ls.set('sb_checkout', { name: g('cn'), email: g('ce'), phone: g('cp'), state: st.state, city: g('cc'), address: g('ca') });
    try {
      const r = await api('/api/checkout', { body: { items: cart.items, coupon: cart.coupon, contact: { name: g('cn'), email: g('ce'), phone: g('cp') }, address: { state: st.state, city: g('cc'), address: g('ca') }, delivery: st.delivery, payment: st.payment, notes: g('cnotes') } });
      try { sessionStorage.setItem('sb_last', JSON.stringify({ ref: r.ref, email: g('ce') })); } catch { /* private mode */ }
      try { if (window.gtag) window.gtag('event', 'begin_checkout', { value: st.data.total, currency: 'NGN' }); if (window.fbq) window.fbq('track', 'InitiateCheckout'); } catch { /* blocked */ }
      if (r.next === 'paystack') { location.href = r.url; return; }
      cart.clear(); cart.setCoupon('');
      go('/order/' + r.ref + (r.next === 'demo' ? '?demo=1' : '?new=1'));
    } catch (er) { err(er.message); btn.disabled = false; btn.textContent = 'Place order'; reprice(); }
  });
  reprice();
  return 'Checkout';
}

/* ---------------- order page ---------------- */
async function orderPage(main, ref, u, cfg) {
  let last = {}; try { last = JSON.parse(sessionStorage.getItem('sb_last') || '{}'); } catch { /* ignore */ }
  const email = last.ref === ref ? last.email : (u.searchParams.get('email') || '');
  const load = () => api('/api/orders/lookup', { body: { ref, email } });
  let order;
  try {
    if (u.searchParams.get('paid') || u.searchParams.get('reference') || u.searchParams.get('trxref')) { try { await api('/api/paystack/verify?reference=' + encodeURIComponent(ref)); } catch { /* shown below */ } }
    order = (await load()).order;
  } catch (er) {
    main.innerHTML = `<div class="wrap page"><div class="card" style="max-width:480px;margin:auto"><h2>Find your order</h2><p class="mu">${e(er.message)}</p><form id="lf">${field('lr', 'Order number', { val: ref })}${field('le', 'Email used at checkout', { type: 'email' })}<button class="btn block">View order</button></form></div></div>`;
    $('#lf').addEventListener('submit', (ev) => { ev.preventDefault(); go('/order/' + encodeURIComponent($('#lr').value.trim().toUpperCase()) + '?email=' + encodeURIComponent($('#le').value.trim())); });
    return 'Order';
  }
  const backFromPay = u.searchParams.get('paid') || u.searchParams.get('reference') || u.searchParams.get('trxref');
  if (order.payment_status === 'paid' && backFromPay) { cart.clear(); cart.setCoupon(''); }
  const stepIdx = order.status === 'cancelled' ? -1 : FLOW.indexOf(order.status);
  const awaiting = order.payment_method === 'paystack' && order.payment_status !== 'paid' && order.status === 'pending';
  main.innerHTML = `<div class="wrap page" style="max-width:860px">
   <div class="card" style="text-align:center;margin-bottom:16px"><div style="font-size:46px">${order.status === 'cancelled' ? '✖️' : awaiting ? '⏳' : '✅'}</div><h1 style="margin:6px 0">${order.status === 'cancelled' ? 'Order cancelled' : awaiting ? 'Waiting for payment' : u.searchParams.get('new') || backFromPay ? 'Thank you for your order!' : 'Order ' + e(order.ref)}</h1>
    <p class="mu">Order <b>${e(order.ref)}</b> · ${fmt(order.created)}${order.payment_method === 'pod' && order.status === 'pending' ? '<br>Please have ' + naira(order.total) + ' ready on delivery.' : ''}</p>
    ${awaiting ? `<div class="note" style="text-align:left;max-width:520px;margin:12px auto"><b>Complete your payment</b><br>${cfg.payments.demo ? 'Demo mode: no real money is charged.' : 'Your payment is not confirmed yet.'}<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">${cfg.payments.demo ? '<button class="btn sm" id="demopay">Pay ' + naira(order.total) + ' (demo)</button><button class="btn ghost sm" id="demofail">Simulate failed payment</button>' : '<button class="btn sm" id="recheck">I have paid, check again</button>'}</div></div>` : ''}</div>
   ${order.status !== 'cancelled' ? `<div class="card" style="margin-bottom:16px"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;font-size:12px">${FLOW.map((s, i) => `<div><div style="height:6px;border-radius:3px;background:${i <= stepIdx ? 'var(--accent)' : 'var(--border)'};margin-bottom:6px"></div><span class="${i <= stepIdx ? '' : 'mu'}" style="font-weight:${i === stepIdx ? 800 : 500}">${STATUS[s]}</span></div>`).join('')}</div></div>` : ''}
   <div class="row c2" style="align-items:start"><div class="card"><h3>Items</h3>${order.items.map((i) => `<div class="line" style="grid-template-columns:48px 1fr auto"><div class="lt" style="width:48px;height:48px">${tile({ id: i.product_id, emoji: i.emoji, image: i.image, name: i.name })}</div><div style="font-size:14px"><b>${e(i.name)}</b><br><span class="mu">${e(i.variant_label)} × ${i.qty}</span></div><b>${naira(i.price * i.qty)}</b></div>`).join('')}
     <div class="sum"><span>Subtotal</span><span>${naira(order.subtotal)}</span></div>${order.discount ? `<div class="sum"><span>Discount ${e(order.coupon || '')}</span><span>−${naira(order.discount)}</span></div>` : ''}<div class="sum"><span>Delivery</span><span>${order.delivery_fee ? naira(order.delivery_fee) : 'Free'}</span></div><div class="sum total"><span>Total</span><span>${naira(order.total)}</span></div></div>
    <div style="display:grid;gap:16px"><div class="card"><h3>Delivery</h3><p style="margin:0">${e(order.name)}<br>${e(order.address)}${order.city ? ', ' + e(order.city) : ''}, ${e(order.state)}<br>${e(order.phone)}</p><p class="mu" style="margin-bottom:0">${e({ standard: 'Standard delivery', express: 'Express delivery', pickup: 'Store pickup' }[order.delivery] || '')} · ${order.payment_method === 'pod' ? 'Pay on delivery' : order.payment_status === 'paid' ? 'Paid online' : 'Online payment pending'}</p></div>
     <div class="card"><h3>Updates</h3>${order.events.slice().reverse().map((ev) => `<div style="font-size:13px;margin-bottom:8px"><b>${e(STATUS[ev.status] || ev.status)}</b> <span class="mu">· ${fmt(ev.created)}</span>${ev.note ? `<br><span class="mu">${e(ev.note)}</span>` : ''}</div>`).join('')}</div></div></div>
   <p style="text-align:center;margin-top:20px"><button class="btn ghost sm" id="print">🖨 Print receipt</button> ${order.status === 'pending' && order.payment_status !== 'paid' ? '<button class="btn ghost sm" id="cancelo">Cancel order</button>' : ''} <a class="btn sm" href="/" data-link>Continue shopping</a></p></div>`;
  const rerender = () => go('/order/' + ref + (email ? '?email=' + encodeURIComponent(email) : ''), true);
  const dp = $('#demopay'); if (dp) dp.addEventListener('click', async () => { try { await api('/api/pay/demo/' + ref, { body: { outcome: 'ok' } }); cart.clear(); cart.setCoupon(''); toast('Payment received (demo)'); go('/order/' + ref + '?new=1', true); } catch (er) { toast(er.message, 'bad'); } });
  const df = $('#demofail'); if (df) df.addEventListener('click', async () => { await api('/api/pay/demo/' + ref, { body: { outcome: 'fail' } }); toast('Payment failed. The order was cancelled.', 'bad'); rerender(); });
  const rc = $('#recheck'); if (rc) rc.addEventListener('click', async () => { await api('/api/paystack/verify?reference=' + encodeURIComponent(ref)).catch(() => {}); rerender(); });
  $('#print').addEventListener('click', () => window.print());
  const co = $('#cancelo'); if (co) co.addEventListener('click', async () => { if (!confirm('Cancel this order?')) return; try { await api('/api/orders/' + ref + '/cancel', { body: { email } }); toast('Order cancelled'); rerender(); } catch (er) { toast(er.message, 'bad'); } });
  return 'Order ' + order.ref;
}

/* ---------------- track ---------------- */
async function track(main) {

  $('#tf').addEventListener('submit', (ev) => { ev.preventDefault(); go('/order/' + encodeURIComponent($('#tr').value.trim().toUpperCase()) + '?email=' + encodeURIComponent($('#te').value.trim())); });
  return 'Track order';
}

/* ---------------- auth ---------------- */
async function afterAuth(user, u) {
  store.user = user;
  try { await api('/api/wishlist-merge', { body: { ids: [...wish.ids] } }); const d = await api('/api/wishlist'); d.ids.forEach((i) => wish.ids.add(i)); ls.set('sb_wish', [...wish.ids]); } catch { /* optional */ }
  const next = u.searchParams.get('next');
  go(next && next.startsWith('/') ? next : user.role === 'admin' ? '/account' : '/account', true);

async function authPage(main, mode, u) {
  if (store.user) { go('/account', true); return ''; }
  const reg = mode === 'register';
  main.innerHTML = `<div class="wrap page"><div class="card" style="max-width:440px;margin:auto"><h1 style="font-size:28px">${reg ? 'Create your account' : 'Welcome back'}</h1>
   <form id="af" novalidate>${reg ? field('an', 'Full name', { req: 1, auto: 'name', max: 80 }) : ''}${field('ae', 'Email', { type: 'email', req: 1, auto: 'email' })}${reg ? field('ap', 'Phone (optional)', { type: 'tel', auto: 'tel' }) : ''}${field('aw', reg ? 'Password (8+ characters)' : 'Password', { type: 'password', req: 1, auto: reg ? 'new-password' : 'current-password' })}
   <p class="err hide" id="aerr" role="alert"></p><button class="btn block lg">${reg ? 'Create account' : 'Sign in'}</button></form>
   <p style="text-align:center;margin-top:14px" class="mu">${reg ? 'Already have an account? <a style="color:var(--accent);font-weight:700" href="/login' + location.search + '" data-link>Sign in</a>' : 'New here? <a style="color:var(--accent);font-weight:700" href="/register' + location.search + '" data-link>Create an account</a><br><a href="/forgot" data-link>Forgot password?</a>'}</p></div></div>`;

function go(url, replace) { if (replace) history.replaceState({}, '', url); else history.pushState({}, '', url); route(); window.scrollTo(0, 0); }
async function route() {
  const u = new URL(location.href); const p = u.pathname.replace(/\/+$/, '') || '/'; const seg = p.split('/').filter(Boolean);
  let main = $('#main'); if (!main) return;
  // Fresh node for every page: page views attach their own click/submit listeners, and reusing one node would stack them up.
  { const fresh = main.cloneNode(false); main.replaceWith(fresh); main = fresh; }
  main.innerHTML = '<div class="loading-page"></div>';
  try {
    let storeSlug = null;
    if (seg[0] === 'd' && seg[1]) storeSlug = seg[1];
    else if (u.searchParams.get('store')) storeSlug = u.searchParams.get('store');
    if (storeSlug && !cfg.stores.some((s) => s.slug === storeSlug)) storeSlug = null;
    if (storeSlug) setStoreTheme(storeSlug);
    let title = cfg.settings.store_name;
    if (p === '/' ) { go('/d/' + (cfg.stores.some((s) => s.slug === getStoreSlug()) ? getStoreSlug() : cfg.stores[0].slug), true); return; }
    else if (seg[0] === 'd' && seg.length === 2) title = await home(main, seg[1], cfg);
    else if (seg[0] === 'shop' || (seg[0] === 'd' && seg[2] === 'shop')) title = await shopView(main, u, cfg);
    else if (seg[0] === 'product' && seg[1]) title = await productView(main, seg[1], cfg);
    else if (seg[0] === 'page' && seg[1]) title = staticPage(main, seg[1], cfg);
    else if (['checkout', 'order', 'account', 'login', 'register', 'wishlist', 'track', 'forgot'].includes(seg[0])) { title = await view(main, seg, u, cfg); }
    else main.innerHTML = `<div class="wrap empty"><div class="em">🧭</div><h2>Page not found</h2><p><a class="btn" href="/" data-link>Back to the store</a></p></div>`;
    document.title = (title ? title + ' · ' : '') + cfg.settings.store_name;
    syncHeader(); $('#main').focus({ preventScroll: true });
  } catch (err) {
    main.innerHTML = `<div class="wrap empty"><div class="em">😕</div><h2>${err.status === 404 ? 'We could not find that' : 'Something went wrong'}</h2><p class="mu">${e(err.message)}</p><p><a class="btn" href="/" data-link>Back to the store</a> <button class="btn ghost" data-reload>Try again</button></p></div>`;
  }
  trackPage();
}

async function productForm(id) {
  const cats = (await api('/api/admin/categories')).categories;
  const p = id ? (await api('/api/admin/products/' + id)).product : { store: pstate.store || cfgStores[0].slug, name: '', brand: '', description: '', price: '', compare_price: 0, stock: 0, sku: '', emoji: '📦', images: [], size_label: 'Size', variants: [], featured: 0, bestseller: 0, new_arrival: 0, active: 1 };
  let images = [...p.images]; let variants = p.variants.map((v) => ({ ...v }));
  const draw = () => {
    openModal(`<h2>${id ? 'Edit product' : 'New product'}</h2><div class="fgrid">
    <label class="f full">Name<input id="pn" value="${e(p.name)}" maxlength="140"></label>
    <label class="f">Department<select id="pst">${cfgStores.map((s) => `<option value="${e(s.slug)}" ${s.slug === p.store ? 'selected' : ''}>${e(s.name)}</option>`).join('')}</select></label>
    <label class="f">Category<select id="pc"></select></label>
    <label class="f">Price (₦)<input id="pp" type="number" min="0" value="${e(p.price)}"></label><label class="f">Original price (₦, optional)<input id="pcp" type="number" min="0" value="${e(p.compare_price || '')}"></label>
    <label class="f">Brand<input id="pb" value="${e(p.brand)}" maxlength="60"></label><label class="f">SKU<input id="psku" value="${e(p.sku)}" maxlength="40"></label>
    <label class="f">Emoji (shown if no photo)<input id="pe" value="${e(p.emoji)}" maxlength="8"></label><label class="f">Stock ${variants.length ? '(from variants)' : ''}<input id="pstock" type="number" min="0" value="${e(p.stock)}" ${variants.length ? 'disabled' : ''}></label>
    <label class="f full">Description<textarea id="pd" rows="4" maxlength="4000">${e(p.description)}</textarea></label>
    <div class="full"><b style="font-size:13px">Photos</b><div class="imgs">${images.map((u, i) => `<div class="im"><img src="${e(u)}" alt=""><button type="button" data-rmimg="${i}" aria-label="Remove photo">×</button></div>`).join('')}</div><input type="file" id="pfile" accept="image/png,image/jpeg,image/webp,image/gif"><div class="mu2">PNG, JPG, WEBP or GIF up to 2 MB. Or paste an https image link below.</div><div style="display:flex;gap:6px;margin-top:6px"><input id="purl" placeholder="https://…"><button type="button" class="btn ghost sm" id="padd">Add</button></div></div>
    <div class="full" style="margin-top:12px"><b style="font-size:13px">Variants (sizes / colours)</b> <span class="mu2">Leave empty if the product has none.</span><label class="f" style="margin-top:6px">Size label<input id="psl" value="${e(p.size_label)}" maxlength="20"></label>
    ${variants.map((v, i) => `<div class="vrow"><input data-v="${i}" data-k="size" placeholder="Size" value="${e(v.size || '')}"><input data-v="${i}" data-k="color" placeholder="Colour" value="${e(v.color || '')}"><input data-v="${i}" data-k="stock" type="number" min="0" placeholder="Stock" value="${e(v.stock)}"><button type="button" class="btn ghost sm" data-rmv="${i}" aria-label="Remove variant">×</button></div>`).join('')}<button type="button" class="btn ghost sm" id="vadd">+ Add variant</button></div>
    <div class="full" style="margin-top:12px"><label class="chk"><input type="checkbox" id="pf" ${p.featured ? 'checked' : ''}> Featured on the homepage</label><label class="chk"><input type="checkbox" id="pbs" ${p.bestseller ? 'checked' : ''}> Best seller</label><label class="chk"><input type="checkbox" id="pna" ${p.new_arrival ? 'checked' : ''}> New arrival</label><label class="chk"><input type="checkbox" id="pa" ${p.active ? 'checked' : ''}> Visible in the store</label></div></div>
    <div class="acts">${id ? '<button class="btn ghost" id="pdel" style="margin-right:auto;color:var(--bad)">Delete</button>' : ''}<button class="btn ghost" id="pcancel">Cancel</button><button class="btn" id="psave">Save product</button></div>`, true);
    const fillCats = () => { const st = $('#pst').value; $('#pc').innerHTML = '<option value="">None</option>' + cats.filter((c) => c.store === st).map((c) => `<option value="${c.id}" ${c.id === p.category_id ? 'selected' : ''}>${e(c.name)}</option>`).join(''); };
    fillCats(); $('#pst').addEventListener('change', () => { p.category_id = null; fillCats(); });
    const collect = () => { Object.assign(p, { name: $('#pn').value, store: $('#pst').value, category_id: $('#pc').value || null, price: $('#pp').value, compare_price: $('#pcp').value, brand: $('#pb').value, sku: $('#psku').value, emoji: $('#pe').value, description: $('#pd').value, size_label: $('#psl').value, featured: $('#pf').checked ? 1 : 0, bestseller: $('#pbs').checked ? 1 : 0, new_arrival: $('#pna').checked ? 1 : 0, active: $('#pa').checked ? 1 : 0 }); if (!variants.length) p.stock = $('#pstock').value; };
    $$('[data-v]', modal).forEach((i) => i.addEventListener('input', () => { variants[i.dataset.v][i.dataset.k] = i.value; }));
    $$('[data-rmv]', modal).forEach((b) => b.addEventListener('click', () => { collect(); variants.splice(b.dataset.rmv, 1); draw(); }));
    $$('[data-rmimg]', modal).forEach((b) => b.addEventListener('click', () => { collect(); images.splice(b.dataset.rmimg, 1); draw(); }));
    $('#vadd').addEventListener('click', () => { collect(); variants.push({ size: '', color: '', stock: 0 }); draw(); });
    $('#padd').addEventListener('click', () => { const u = $('#purl').value.trim(); if (!/^https:\/\//.test(u)) return toast('Image links must start with https://', 'bad'); collect(); images.push(u); draw(); });
    $('#pfile').addEventListener('change', guard(async () => {
      const f = $('#pfile').files[0]; if (!f) return; if (f.size > 2_000_000) return toast('That image is over 2 MB.', 'bad');
      const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
      const up = await api('/api/admin/upload', { body: { data } }); collect(); images.push(up.url); draw();
    }));
    $('#pcancel').addEventListener('click', closeModal);
    const del = $('#pdel'); if (del) del.addEventListener('click', guard(async () => { if (!confirm('Delete this product? Products that have orders are hidden instead.')) return; const r = await api('/api/admin/products/' + id, { method: 'DELETE' }); toast(r.archived ? 'Product hidden (it has orders)' : 'Product deleted'); closeModal(); route(); }));
    $('#psave').addEventListener('click', guard(async () => {
      collect(); const body = { ...p, images, variants };
      await api('/api/admin/products' + (id ? '/' + id : ''), { method: id ? 'PUT' : 'POST', body }); toast('Product saved'); closeModal(); route();
    }));
  };
  draw();
}

    $('#cx').addEventListener('click', closeModal); $('#cs').addEventListener('click', guard(async () => { await api('/api/admin/coupons', { body: { code: $('#kc').value, type: $('#kt').value, value: $('#kv').value, min_spend: $('#km').value, max_uses: $('#kx').value, expires_at: $('#ke').value, active: $('#ka').checked } }); toast('Coupon saved'); closeModal(); route(); }));
  };
  on('#nc', 'click', () => form());
  onAll('[data-ec]', 'click', (el) => form(d.coupons.find((c) => c.code === el.dataset.ec)));
  onAll('[data-dc]', 'click', async (el) => { if (!confirm('Delete this coupon?')) return; await api('/api/admin/coupons/' + encodeURIComponent(el.dataset.dc), { method: 'DELETE' }); toast('Deleted'); route(); });
};

/* ---------------- reviews ---------------- */
views.reviews = async () => {
  const d = await api('/api/admin/reviews');
  mn(hd('Reviews') + `<div class="panel"><div class="tw"><table class="t"><tr><th>Product</th><th>Rating</th><th>Review</th><th>By</th><th></th></tr>${d.reviews.map((r) => `<tr><td>${e(r.product)}</td><td>${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</td><td>${e(r.title)}<div class="mu2">${e(r.body)}</div></td><td>${e(r.name)}<div class="mu2">${dt(r.created)}</div></td><td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" data-ar="${r.id}" data-v="${r.approved ? 0 : 1}">${r.approved ? 'Hide' : 'Approve'}</button> <button class="btn ghost sm" data-dr="${r.id}">Delete</button></td></tr>`).join('') || '<tr><td colspan="5" class="mu">No reviews yet.</td></tr>'}</table></div></div>`);
  onAll('[data-ar]', 'click', async (el) => { await api('/api/admin/reviews/' + el.dataset.ar, { method: 'PUT', body: { approved: el.dataset.v === '1' } }); route(); });
  onAll('[data-dr]', 'click', async (el) => { if (!confirm('Delete this review?')) return; await api('/api/admin/reviews/' + el.dataset.dr, { method: 'DELETE' }); route(); });
};

/* ---------------- messages ---------------- */
views.messages = async () => {
  const d = await api('/api/admin/messages'); unreadCount = d.messages.filter((m) => !m.read).length;
  mn(hd('Messages') + (d.messages.map((m) => `<div class="panel" style="${m.read ? 'opacity:.75' : ''}"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${e(m.subject || '(no subject)')}</b><span class="mu2">${dt(m.created)}</span></div><div class="mu2">${e(m.name)} · <a href="mailto:${e(m.email)}" style="color:var(--accent)">${e(m.email)}</a></div><p style="white-space:pre-wrap">${e(m.body)}</p><button class="btn ghost sm" data-mr="${m.id}" data-v="${m.read ? 0 : 1}">${m.read ? 'Mark unread' : 'Mark read'}</button> <button class="btn ghost sm" data-md="${m.id}">Delete</button></div>`).join('') || '<div class="panel mu">No messages yet.</div>'));
  onAll('[data-mr]', 'click', async (el) => { await api('/api/admin/messages/' + el.dataset.mr, { method: 'PUT', body: { read: el.dataset.v === '1' } }); route(); });
  onAll('[data-md]', 'click', async (el) => { if (!confirm('Delete this message?')) return; await api('/api/admin/messages/' + el.dataset.md, { method: 'DELETE' }); route(); });
};

/* ---------------- marketing: newsletter, abandoned carts, email outbox ---------------- */
views.marketing = async () => {
  const [n, a, o] = await Promise.all([api('/api/admin/newsletter'), api('/api/admin/abandoned'), api('/api/admin/outbox')]);
  mn(hd('Marketing') + `<div class="panel"><h3>Abandoned carts (${a.carts.length})</h3><p class="mu2">Shoppers who entered an email at checkout but did not order. Reminder emails go out after one hour.</p><div class="tw"><table class="t"><tr><th>Email</th><th>Items</th><th>When</th><th>Reminded</th></tr>${a.carts.map((c) => `<tr><td>${e(c.email)}</td><td>${c.cart.length}</td><td class="mu2">${dt(c.created)}</td><td>${c.reminded ? 'Yes' : 'No'}</td></tr>`).join('') || '<tr><td colspan="4" class="mu">None right now.</td></tr>'}</table></div><div class="acts"><button class="btn" id="rem">Send reminders now</button></div></div>
   <div class="panel"><h3>Newsletter subscribers (${n.subscribers.length})</h3><div class="tw"><table class="t"><tr><th>Email</th><th>Joined</th></tr>${n.subscribers.map((s) => `<tr><td>${e(s.email)}</td><td class="mu2">${dt(s.created)}</td></tr>`).join('') || '<tr><td colspan="2" class="mu">No subscribers yet.</td></tr>'}</table></div></div>
   <div class="panel"><h3>Email outbox</h3><p class="mu2">${o.live ? 'Emails are sent through Resend.' : 'Email sending is not set up yet, so messages are only stored here. Add RESEND_API_KEY and MAIL_FROM to send them.'}</p><div class="tw"><table class="t"><tr><th>To</th><th>Subject</th><th>Sent</th><th>Queued</th></tr>${o.emails.map((m) => `<tr><td>${e(m.to_email)}</td><td>${e(m.subject)}</td><td>${m.sent ? 'Yes' : 'No'}</td><td class="mu2">${dt(m.created)}</td></tr>`).join('') || '<tr><td colspan="4" class="mu">Nothing queued.</td></tr>'}</table></div></div>`);
  on('#rem', 'click', async () => { const r = await api('/api/admin/abandoned/remind', { body: {} }); toast(`${r.sent} reminder${r.sent === 1 ? '' : 's'} queued`); route(); });
};

/* ---------------- settings ---------------- */
const SF = [['store_name', 'Store name'], ['tagline', 'Tagline'], ['logo_url', 'Logo URL (https://…)'], ['announcement', 'Announcement bar'], ['contact_email', 'Contact email'], ['contact_phone', 'Contact phone'], ['whatsapp', 'WhatsApp number (digits, with country code)'], ['address', 'Address'], ['pickup_address', 'Store pickup address'], ['instagram', 'Instagram link'], ['facebook', 'Facebook link'], ['x_twitter', 'X / Twitter link'], ['tiktok', 'TikTok link'], ['free_shipping_threshold', 'Free delivery above (₦, 0 = off)'], ['express_multiplier', 'Express delivery price multiplier'], ['return_days', 'Return window (days)'], ['tax_note', 'Price / VAT note'], ['ga_id', 'Google Analytics ID (G-XXXX)'], ['meta_pixel_id', 'Meta Pixel ID']];
views.settings = async () => {
  const d = await api('/api/admin/settings'); const s = d.settings;
  mn(hd('Settings', '<button class="btn" id="ssave">Save changes</button>') + `<div class="panel"><h3>Store</h3><div class="fgrid">${SF.map(([k, l]) => `<label class="f"><span>${l}</span><input data-s="${k}" maxlength="300" value="${e(s[k])}"></label>`).join('')}</div></div>
   <div class="panel"><h3>Payments</h3><label class="chk"><input type="checkbox" id="spod" ${s.pod_enabled === '1' ? 'checked' : ''}> Pay on delivery</label><label class="chk"><input type="checkbox" id="spay" ${s.paystack_enabled === '1' ? 'checked' : ''}> Pay online with Paystack</label><p class="mu2">${d.paystack.live ? '✅ Paystack live keys are configured on the server.' : '⚠️ No PAYSTACK_SECRET_KEY is set, so online payment runs in demo mode (no real money). Set it as an environment variable on your host to take real payments.'}</p></div>
   <div class="panel"><h3>Delivery fees by state</h3><div class="tw"><table class="t"><tr><th>State</th><th>Fee (₦)</th><th>Delivery time</th><th>Pay on delivery</th></tr>${d.zones.map((z, i) => `<tr><td>${e(z.state)}</td><td><input type="number" min="0" data-z="${i}" data-k="fee" value="${z.fee}" style="width:110px"></td><td><input data-z="${i}" data-k="eta" value="${e(z.eta)}" maxlength="30" style="width:130px"></td><td><input type="checkbox" data-z="${i}" data-k="pod" ${z.pod ? 'checked' : ''} style="width:auto"></td></tr>`).join('')}</table></div></div>`);
  on('#ssave', 'click', async () => {
    const settings = {}; $$('[data-s]', $('#mn')).forEach((i) => { settings[i.dataset.s] = i.value; });
    settings.pod_enabled = $('#spod').checked ? '1' : '0'; settings.paystack_enabled = $('#spay').checked ? '1' : '0';
    const zones = d.zones.map((z) => ({ ...z })); $$('[data-z]', $('#mn')).forEach((i) => { zones[i.dataset.z][i.dataset.k] = i.type === 'checkbox' ? (i.checked ? 1 : 0) : i.value; });
    await api('/api/admin/settings', { method: 'PUT', body: { settings, zones } }); toast('Settings saved');
  });
};

/* ---------------- boot ---------------- */
async function boot() {
  try { const m = await api('/api/me'); me = m.user && m.user.role === 'admin' ? m.user : null; } catch { me = null; }
  if (!me) return loginView();
  try { const c = await api('/api/config'); cfgStores = c.stores; } catch { /* retry in views */ }
  route();
}
boot();

}
if (/^\/admin(\/|$)/.test(location.pathname)) {
  document.body.classList.add('is-admin');
  for (const id of ['shell', 'scrim', 'drawer']) { const n = document.getElementById(id); if (n) n.remove(); }
  startAdmin();
} else {
  const a = document.getElementById('adm'); if (a) a.remove();
  startStore();
}
})();
</script>
</body>
</html>
