<script>
// Runs before first paint: restores dark/light mode and the last department theme (no flash of the wrong design).
(function () {
  try {
    var r = document.documentElement;
    var m = JSON.parse(localStorage.getItem('sb_mode') || 'null'); if (m) r.setAttribute('data-mode', m);
    if (!r.getAttribute('data-store')) { var m2 = /^\/d\/([a-z-]+)/.exec(location.pathname); var s = m2 ? m2[1] : JSON.parse(localStorage.getItem('sb_store') || 'null'); if (s) r.setAttribute('data-store', s); }
  } catch (e) { /* storage blocked */ }
})();
</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Poppins:wght@600;700;800&display=swap">
<style>
:root{
 --bg:#fff;--surface:#fff;--surface-2:#f6f7f9;--text:#16181d;--muted:#667085;--border:#e5e8ee;
 --accent:#f26a21;--accent-ink:#fff;--accent-soft:#fff0e6;--accent-2:#ffb27a;
 --head-bg:#fff;--head-ink:#16181d;--hero-bg:linear-gradient(135deg,#fdeee3,#fff 70%);--hero-ink:#16181d;--hero-muted:#5b6270;
 --radius:14px;--radius-sm:10px;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.06);
 --font:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--display:var(--font);--ok:#16a34a;--warn:#d97706;--bad:#dc2626;
}
[data-store=fashion]{--accent:#f26a21;--accent-soft:#fff0e6;--hero-bg:linear-gradient(120deg,#fff1e6 0%,#fffaf6 55%,#fff 100%)}
[data-store=supermarket]{--accent:#16a34a;--accent-soft:#e3f6ea;--accent-2:#facc15;--head-bg:#0b4a2a;--head-ink:#fff;--hero-bg:linear-gradient(120deg,#0b4a2a,#13803f 85%);--hero-ink:#fff;--hero-muted:#cfeedd;--radius:12px}
[data-store=beauty]{--accent:#d6246e;--accent-soft:#fde7f1;--accent-2:#7c3aed;--hero-bg:linear-gradient(120deg,#fde9ee,#f7e6f6 60%,#fff);--display:'Playfair Display',Georgia,serif;--radius:18px}
[data-store=electronics]{--bg:#0a0d0c;--surface:#121715;--surface-2:#0e1311;--text:#f2f6f4;--muted:#9aa8a1;--border:#232b28;--accent:#22c55e;--accent-ink:#04130a;--accent-soft:#0f2a1a;--head-bg:#0a0d0c;--head-ink:#f2f6f4;--hero-bg:radial-gradient(ellipse at 80% 20%,#0f3d22,#0a0d0c 65%);--hero-ink:#f2f6f4;--hero-muted:#a9b8b0;--shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.5)}
[data-store=pharmacy]{--accent:#2563eb;--accent-soft:#e6efff;--surface-2:#f3f7ff;--hero-bg:linear-gradient(120deg,#d7e8ff,#eef5ff 70%,#fff);--radius:12px}
[data-store=food]{--accent:#f97316;--accent-soft:#fff0dd;--accent-2:#facc15;--bg:#fffaf0;--surface-2:#fff4dc;--hero-bg:linear-gradient(120deg,#fde58a,#fff3c4 70%,#fffaf0);--radius:22px;--display:'Poppins','Plus Jakarta Sans',system-ui,sans-serif}
[data-mode=dark]:not([data-store=electronics]){--bg:#0f1114;--surface:#171a1f;--surface-2:#12151a;--text:#eef0f4;--muted:#98a2b3;--border:#272c34;--head-bg:#12151a;--head-ink:#eef0f4;--hero-ink:#eef0f4;--hero-muted:#a8b0bd;--hero-bg:linear-gradient(120deg,#1b1f27,#12151a);--accent-soft:#2a1d14;--shadow:0 8px 24px rgba(0,0,0,.45)}
[data-mode=dark][data-store=supermarket]{--head-bg:#06301b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .2s}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0 0 .5em}h1{font-size:clamp(28px,4vw,46px);letter-spacing:-.02em}h2{font-size:clamp(20px,2.4vw,26px)}h3{font-size:18px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}.mu{color:var(--muted)}.hide{display:none!important}.sr{position:absolute;left:-9999px}
.loading-page{min-height:50vh;display:grid;place-items:center}.loading-page::after{content:'';width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.sm{padding:7px 14px;font-size:13px}.btn.lg{padding:14px 30px;font-size:16px}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--border)}.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}.btn.block{width:100%}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:block;font-weight:600;font-size:13px;margin-bottom:12px}label.f>input,label.f>select,label.f>textarea{margin-top:5px;font-weight:400}
.row{display:grid;gap:12px}.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:repeat(3,1fr)}@media(max-width:600px){.row.c2,.row.c3{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:13px;margin:6px 0}.note{background:var(--accent-soft);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px}

.icons{display:flex;gap:6px;margin-left:auto}.ibtn{position:relative;background:none;border:0;color:inherit;cursor:pointer;font-size:20px;padding:8px;border-radius:10px;display:grid;place-items:center}.ibtn:hover{background:rgba(127,127,127,.15)}

.menu-btn{display:none}

.tabs-in::-webkit-scrollbar{display:none}
.dtab{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;color:var(--muted);border:1px solid transparent}
.dtab:hover{color:var(--text);background:var(--surface)}.dtab.on{background:var(--accent);color:var(--accent-ink)}
.nav2{display:flex;gap:22px;max-width:1200px;margin:0 auto;padding:0 16px 10px;font-size:14px;font-weight:600}.nav2 a{opacity:.85}.nav2 a:hover,.nav2 a.on{opacity:1;color:var(--accent)}
[data-store=supermarket] .nav2 a:hover,[data-store=supermarket] .nav2 a.on{color:var(--accent-2)}
@media(max-width:760px){.head-in{flex-wrap:wrap;gap:10px}.search{order:5;flex-basis:100%;max-width:none}.nav2{display:none}.logo span.t{font-size:18px}}
/* hero */
.hero{background:var(--hero-bg);color:var(--hero-ink);overflow:hidden}
.hero-in{max-width:1200px;margin:0 auto;padding:46px 16px;display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:center;min-height:340px}

.hero-art .sm1{left:6%;top:12%;animation-delay:-1s}.hero-art .sm2{right:4%;top:8%;animation-delay:-2.5s}.hero-art .sm3{right:14%;bottom:2%;animation-delay:-4s}

@media(max-width:760px){.hero-in{grid-template-columns:1fr;padding:28px 16px;min-height:0}.hero-art{height:200px;order:-1}.hero-art .big{font-size:100px}.hero-art .sm1,.hero-art .sm2,.hero-art .sm3{font-size:42px}}

section.blk{padding:30px 0}.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}.sec-head a{font-size:13px;font-weight:700;color:var(--accent)}

.cats.square .cat{width:104px}.cats.square .cat .ci{border-radius:16px;width:92px;height:80px;border:1px solid var(--border);background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.pcard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.pcard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}.pimg{position:relative;display:block;aspect-ratio:1/1;background:var(--surface-2)}.pimg img{width:100%;height:100%;object-fit:cover}

.badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}.badge.new{background:#7c3aed;color:#fff}.badge.out{background:#667085;color:#fff;left:auto;right:10px}

.pbody{padding:12px;display:flex;flex-direction:column;gap:5px;flex:1}.pname{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}

.stars{color:#f5a524;font-size:13px;letter-spacing:1px}.stars i{color:var(--border);font-style:normal}.stars small{color:var(--muted);letter-spacing:0;margin-left:4px}.stars.none{color:var(--muted);font-size:12px;letter-spacing:0}

@media(max-width:700px){.trust{grid-template-columns:1fr}}
.promo2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.promo2{grid-template-columns:1fr}}
.promo{border-radius:var(--radius);padding:24px;background:linear-gradient(120deg,var(--accent-soft),var(--surface-2));border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;min-height:140px;overflow:hidden}.promo h3{margin:0 0 4px}.promo p{margin:0 0 12px;color:var(--muted);font-size:14px}.promo .pe{font-size:64px}
.banner{border-radius:var(--radius);background:linear-gradient(110deg,var(--accent),var(--accent-2));color:var(--accent-ink);padding:28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.banner h3{margin:0 0 4px;font-size:22px}.banner p{margin:0;opacity:.9}.banner .btn{background:#fff;color:#111;border-color:#fff}
/* partner stores */
.sold{font-size:12px;color:var(--muted);display:block}.sold:hover{color:var(--accent)}
.sgroup{margin:6px 0 2px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

footer.foot{background:var(--surface-2);border-top:1px solid var(--border);margin-top:40px;padding:36px 0 90px}
.foot-grid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:24px}@media(max-width:760px){.foot-grid{grid-template-columns:1fr 1fr}}

<body>
<div id="adm"></div>
<div id="shell"><div class="loading-page"></div></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Shopping cart" aria-hidden="true"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div id="toasts" aria-live="polite"></div>
<noscript><main style="max-width:700px;margin:40px auto;padding:0 16px;font-family:system-ui"><!--PRERENDER--><p>Please enable JavaScript to shop.</p></main></noscript>
<script>
(function () {
'use strict';
/* ===== core.js ===== */
// Shared state and helpers (no framework, no inline handlers: the CSP forbids them).
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const e = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const naira = (n) => '₦' + Number(n || 0).toLocaleString('en-NG');
const store = { cfg: null, user: null };

async function api(path, opts = {}) {
  const o = { method: opts.method || 'GET', headers: {}, credentials: 'same-origin' };
  if (opts.body !== undefined) { o.method = opts.method || 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opts.body); }
  let r; try { r = await fetch(path, o); } catch { throw new Error('Network problem. Check your connection and try again.'); }
  let d = {}; try { d = await r.json(); } catch { /* empty */ }
  if (!r.ok || d.error) { const err = new Error(d.error || 'Something went wrong.'); err.status = r.status; throw err; }
  return d;
}

/* ---- maps: Leaflet is served from our own server (/vendor/leaflet), tiles come from the configured provider ---- */
let leafletP;
function loadLeaflet() {
  if (!leafletP) leafletP = new Promise((res, rej) => {
    if (window.L) return res(window.L);
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/vendor/leaflet/leaflet.css'; document.head.appendChild(l);
    const sc = document.createElement('script'); sc.src = '/vendor/leaflet/leaflet.js';
    const n = document.querySelector('script[nonce]'); if (n && n.nonce) sc.nonce = n.nonce;
    sc.onload = () => { window.L.Icon.Default.imagePath = '/vendor/leaflet/images/'; res(window.L); };
    sc.onerror = () => { leafletP = null; rej(new Error('The map could not load.')); };
    document.head.appendChild(sc);
  });
  return leafletP;
}
let dcfgP; const dcfg = () => (dcfgP = dcfgP || api('/api/delivery/config').catch(() => ({ mapped: false })));
const tm = (t) => { if (!t) return ''; const d = new Date(t * 1000), today = new Date(); const hm = d.toLocaleTimeString('en-NG', { hour: 'numeric', minute: '2-digit' }); return d.toDateString() === today.toDateString() ? hm : d.toLocaleDateString('en-NG', { weekday: 'short', day: 'numeric', month: 'short' }) + ', ' + hm; };
async function makeMap(el, cfgD, center, zoom) {
  const L = await loadLeaflet();
  const map = L.map(el, { scrollWheelZoom: false }).setView(center, zoom);
  if (cfgD.tiles) L.tileLayer(cfgD.tiles, { maxZoom: 19, attribution: cfgD.attribution }).addTo(map);
  else el.style.background = '#e6ebf0';
  return { L, map };
}

const ls = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* ignore */ } },
};

/* ---- toasts ---- */
function toast(msg, kind = '') {
  const box = $('#toasts'); if (!box) return;
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; box.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 2800);
}

/* ---- cart (stored in the browser; the server re-prices everything at checkout) ---- */
const listeners = new Set();
const onChange = (fn) => listeners.add(fn);
const emit = () => listeners.forEach((f) => f());
const cart = {
  items: ls.get('sb_cart', []),
  save() { ls.set('sb_cart', this.items); emit(); },
  count() { return this.items.reduce((s, i) => s + i.qty, 0); },
  add(productId, variantId, qty = 1) {
    const it = this.items.find((i) => i.productId === productId && (i.variantId || null) === (variantId || null));
    if (it) it.qty = Math.min(99, it.qty + qty); else this.items.push({ productId, variantId: variantId || null, qty });
    this.save();
  },
  set(productId, variantId, qty) {
    const i = this.items.findIndex((x) => x.productId === productId && (x.variantId || null) === (variantId || null));
    if (i < 0) return; if (qty <= 0) this.items.splice(i, 1); else this.items[i].qty = Math.min(99, qty); this.save();
  },
  clear() { this.items = []; this.save(); },
  coupon: ls.get('sb_coupon', ''),
  setCoupon(c) { this.coupon = c || ''; ls.set('sb_coupon', this.coupon); emit(); },
};

/* ---- wishlist (local, merged into the account when signed in) ---- */
const wish = {
  ids: new Set(ls.get('sb_wish', [])),
  has(id) { return this.ids.has(id); },
  async toggle(id) {
    const on = !this.ids.has(id); if (on) this.ids.add(id); else this.ids.delete(id);
    ls.set('sb_wish', [...this.ids]); emit();
    if (store.user) { try { await api('/api/wishlist/' + id, { method: on ? 'POST' : 'DELETE', body: on ? {} : undefined }); } catch { /* local copy kept */ } }
    return on;
  },
};

function recent(id) { if (id === undefined) return ls.get('sb_recent', []); const l = ls.get('sb_recent', []).filter((x) => x !== id); l.unshift(id); ls.set('sb_recent', l.slice(0, 12)); }

/* ---- shared UI snippets ---- */
const stars = (r, n) => {
  const full = Math.round(r || 0);
  return `<span class="stars" aria-label="${r || 0} out of 5">${'★'.repeat(full)}<i>${'★'.repeat(5 - full)}</i>${n != null ? `<small>(${n})</small>` : ''}</span>`;
};
const tile = (p, cls = '') => p.image
  ? `<img class="${cls}" src="${e(p.image)}" alt="${e(p.name)}" loading="lazy">`
  : `<div class="emoji-tile ${cls}" data-h="${p.id % 6}" aria-hidden="true"><span>${e(p.emoji || '📦')}</span></div>`;

function productCard(p) {
  const hot = p.off ? `<span class="badge off">-${p.off}%</span>` : p.new_arrival ? '<span class="badge new">New</span>' : '';
  const out = p.stock <= 0 ? '<span class="badge out">Sold out</span>' : '';
  return `<article class="pcard">
    <a class="pimg" href="/product/${e(p.slug)}" data-link>${tile(p)}${hot}${out}</a>
    <button class="wish ${wish.has(p.id) ? 'on' : ''}" data-wish="${p.id}" aria-label="Save to wishlist" aria-pressed="${wish.has(p.id)}">${wish.has(p.id) ? '♥' : '♡'}</button>
    <div class="pbody">
      <a class="pname" href="/product/${e(p.slug)}" data-link>${e(p.name)}</a>
      ${p.vendor ? `<a class="sold" href="/store/${e(p.vendor.slug)}" data-link>🏪 ${e(p.vendor.name)}</a>` : ''}
      ${p.rating_n ? stars(p.rating, p.rating_n) : '<span class="stars none">No reviews yet</span>'}
      <div class="pprice"><b>${naira(p.price)}</b>${p.compare_price > p.price ? `<s>${naira(p.compare_price)}</s>` : ''}</div>
      <button class="btn sm add" data-quick="${p.id}" ${p.stock <= 0 ? 'disabled' : ''}>${p.stock <= 0 ? 'Sold out' : 'Add to cart'}</button>
    </div></article>`;
}

// Cart and order lines grouped by who sells them ('' = Shop-Beta itself), in a stable order.
function byStore(lines, nameOf = (l) => l.vendorName || l.store || '') {
  const m = new Map();
  for (const l of lines) { const k = nameOf(l); if (!m.has(k)) m.set(k, []); m.get(k).push(l); }
  return [...m.entries()].sort((a, b) => (a[0] === '') - (b[0] === '') || a[0].localeCompare(b[0])).map(([name, ls2]) => ({ name, lines: ls2 }));
}
const groupHead = (name, groups) => (groups.length > 1 || name ? `<div class="sgroup">🏪 Sold by ${e(name || 'Shop-Beta')}</div>` : '');

function setStoreTheme(slug) {
  const r = document.documentElement;
  if (slug) { r.setAttribute('data-store', slug); ls.set('sb_store', slug); } else r.removeAttribute('data-store');
}
const getStoreSlug = () => document.documentElement.getAttribute('data-store') || ls.get('sb_store', 'fashion');

/* ===================== STOREFRONT ===================== */
function startStore() {
/* ===== cartui.js ===== */
let open = false, data = null, cfgRef = null, busy = 0;
function initCart(cfg) {
  cfgRef = cfg;
  const d = $('#drawer');
  d.addEventListener('click', async (ev) => {
    const t = ev.target;
    if (t.closest('#cclose')) return closeCart();
    const m = t.closest('[data-qty]');
    if (m) { const [pid, vid, delta] = m.dataset.qty.split(','); const line = data.lines.find((l) => l.productId == pid && (l.variantId || '') == vid); cart.set(Number(pid), vid ? Number(vid) : null, (line ? line.qty : 1) + Number(delta)); return; }
    const r = t.closest('[data-rm]'); if (r) { const [pid, vid] = r.dataset.rm.split(','); cart.set(Number(pid), vid ? Number(vid) : null, 0); return; }
    if (t.closest('#capply')) { const code = $('#ccode').value.trim(); if (!code) return; cart.setCoupon(code); return; }
    if (t.closest('#cclear')) { cart.setCoupon(''); return; }
    if (t.closest('#cgo')) { closeCart(); go('/checkout'); }
  });
  d.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.id === 'ccode') { ev.preventDefault(); $('#capply').click(); } });
  onChange(() => { if (open) refresh(); });
}
function closeCart() { open = false; $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('on'); }
function openCart() { open = true; $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('on'); refresh(); }
async function priceNow(extra = {}) {
  return api('/api/cart/price', { body: { items: cart.items, coupon: cart.coupon, ...extra } });
}
async function refresh() {
  const my = ++busy; const d = $('#drawer');
  if (!d.innerHTML) d.innerHTML = '<div class="loading-page"></div>';
  if (!cart.items.length) { data = { lines: [] }; return paint(); }
  try { const r = await priceNow(); if (my !== busy) return; data = r;
    // drop items the server says no longer exist, and cap quantities to stock
    let changed = false;
    for (const i of r.issues || []) { if (/no longer available/.test(i.message)) { const idx = cart.items.findIndex((x) => x.productId === i.productId); if (idx >= 0) { cart.items.splice(idx, 1); changed = true; } } }
    for (const l of r.lines) { const it = cart.items.find((x) => x.productId === l.productId && (x.variantId || null) === (l.variantId || null)); if (it && it.qty !== l.qty) { it.qty = l.qty; changed = true; } }
    if (changed) { cart.save(); return; }
    if (r.couponError) { toast(r.couponError, 'bad'); cart.setCoupon(''); return; }
    paint(); } catch (er) { d.innerHTML = `<header><h3>Your cart</h3><button class="ibtn" id="cclose" aria-label="Close">✕</button></header><div class="body"><p class="err">${e(er.message)}</p></div>`; }
}
function paint() {
  const d = $('#drawer'); const r = data; const free = Number(cfgRef.settings.free_shipping_threshold || 0);
  const rem = free ? Math.max(0, free - (r.subtotal - (r.discount || 0))) : 0;
  d.innerHTML = `<header><h3>Your cart (${cart.count()})</h3><button class="ibtn" id="cclose" aria-label="Close cart">✕</button></header>
  <div class="body">${!r.lines.length ? '<div class="empty"><div class="em">🛒</div><p>Your cart is empty.</p></div>' : `
    ${free ? `<div style="font-size:13px">${rem > 0 ? `Add <b>${naira(rem)}</b> more for free delivery` : '🎉 You qualify for free delivery'}</div><div class="free-bar"><i style="width:${Math.min(100, ((r.subtotal - (r.discount || 0)) / free) * 100)}%"></i></div>` : ''}
    ${(() => { const gs = byStore(r.lines); return gs.map((g) => groupHead(g.name, gs) + g.lines.map((l) => `<div class="line"><a class="lt" href="/product/${e(l.slug)}" data-link>${tile({ id: l.productId, emoji: l.emoji, image: l.image, name: l.name })}</a>
      <div><a href="/product/${e(l.slug)}" data-link style="font-weight:600;font-size:14px">${e(l.name)}</a><div class="mu" style="font-size:12px">${e(l.variantLabel)}</div>
      <div class="qty" style="margin-top:6px"><button data-qty="${l.productId},${l.variantId || ''},-1" aria-label="Decrease">−</button><span>${l.qty}</span><button data-qty="${l.productId},${l.variantId || ''},1" aria-label="Increase" ${l.qty >= l.available ? 'disabled' : ''}>+</button></div></div>
      <div style="text-align:right"><b>${naira(l.price * l.qty)}</b><br><button class="rm" data-rm="${l.productId},${l.variantId || ''}">Remove</button></div></div>`).join('')).join(''); })()}`}</div>
  ${r.lines.length ? `<footer>
    <div style="display:flex;gap:8px;margin-bottom:10px"><input id="ccode" placeholder="Promo code" value="${e(cart.coupon)}" aria-label="Promo code"><button class="btn ghost sm" id="capply">Apply</button></div>
    ${r.coupon ? `<div class="sum" style="color:var(--ok)"><span>Code ${e(r.coupon)} <button class="rm" id="cclear" style="color:var(--muted)">(remove)</button></span><span>−${naira(r.discount)}</span></div>` : ''}
    <div class="sum"><span>Subtotal</span><span>${naira(r.subtotal)}</span></div><div class="sum mu"><span>Delivery</span><span>Calculated at checkout</span></div>
    <button class="btn lg block" id="cgo" style="margin-top:10px">Checkout · ${naira(r.subtotal - (r.discount || 0))}</button></footer>` : ''}`;
}

   <div class="shop"><aside class="filters" id="filters">
     <h4>Department</h4><div class="chips"><a class="chip ${!q.store ? 'on' : ''}" href="${url({ store: '', category: '' })}" data-link>All</a>${cfg.stores.map((s) => `<a class="chip ${q.store === s.slug ? 'on' : ''}" href="${url({ store: s.slug, category: '' })}" data-link>${e(s.tab_label)}</a>`).join('')}</div>
     ${(d.stores || []).some((x) => x.slug) || q.vendor ? `<h4>Store</h4><div class="chips">${q.vendor ? `<a class="chip" href="${url({ vendor: '' })}" data-link>All stores ✕</a>` : ''}${(d.stores || []).map((x) => `<a class="chip ${q.vendor === (x.slug || 'ours') ? 'on' : ''}" href="${url({ vendor: q.vendor === (x.slug || 'ours') ? '' : (x.slug || 'ours') })}" data-link>${e(x.name)} (${x.n})</a>`).join('')}</div>` : ''}
     ${cats.length ? `<h4>Category</h4><div class="chips">${cats.map((c) => `<a class="chip ${q.category === c.slug ? 'on' : ''}" href="${url({ category: q.category === c.slug ? '' : c.slug })}" data-link>${e(c.name)}</a>`).join('')}</div>` : ''}
     <h4>Price (₦)</h4><div class="row c2"><input id="pmin" type="number" min="0" placeholder="Min" value="${e(q.min || '')}" aria-label="Minimum price"><input id="pmax" type="number" min="0" placeholder="Max" value="${e(q.max || '')}" aria-label="Maximum price"></div><button class="btn sm ghost" id="papply" style="margin-top:8px">Apply</button>
     ${d.facets.sizes.length ? `<h4>Size</h4><div class="chips">${d.facets.sizes.map((s) => `<a class="chip ${q.size === s ? 'on' : ''}" href="${url({ size: q.size === s ? '' : s })}" data-link>${e(s)}</a>`).join('')}</div>` : ''}

     <h4>Rating</h4><div class="chips">${[4, 3].map((r) => `<a class="chip ${q.rating == r ? 'on' : ''}" href="${url({ rating: q.rating == r ? '' : r })}" data-link>${r}★ &amp; up</a>`).join('')}</div>

   ${d.pages > 1 ? `<nav class="pager" aria-label="Pages">${Array.from({ length: d.pages }, (_, i) => `<a class="btn sm ${d.page === i + 1 ? '' : 'ghost'}" href="${url({ page: i + 1 })}" data-link>${i + 1}</a>`).join('')}</nav>` : ''}</div></div></div>`;

  return title;
}

/* ================= product ================= */
async function productView(main, slug, cfg) {
  const d = await api('/api/products/' + encodeURIComponent(slug)); const p = d.product;
  recent(p.id);
  const hasVar = p.variants.length > 0;
  const sizes = [...new Set(p.variants.map((v) => v.size).filter(Boolean))], colors = [...new Set(p.variants.map((v) => v.color).filter(Boolean))];
  const sel = { size: sizes.length === 1 ? sizes[0] : '', color: colors.length === 1 ? colors[0] : '', qty: 1 };
  const st = cfg.stores.find((s) => s.slug === p.store);
  const imgs = p.images.length ? p.images : [];
  const find = () => p.variants.find((v) => (!sizes.length || v.size === sel.size) && (!colors.length || v.color === sel.color));
  const stockOf = () => (hasVar ? (find() ? find().stock : null) : p.stock);
  const rec = recent().filter((i) => i !== p.id);
  let recProducts = []; if (rec.length) { try { recProducts = (await api('/api/products/by-ids', { body: { ids: rec.slice(0, 8) } })).products; } catch { /* optional */ } }
  main.innerHTML = `<div class="wrap">
   <nav class="crumbs"><a href="/" data-link>Home</a> › <a href="/d/${e(p.store)}" data-link>${e(st ? st.name : p.store)}</a> › ${p.category ? `<a href="/shop?store=${e(p.store)}&category=${e(p.category_slug)}" data-link>${e(p.category)}</a> › ` : ''}${e(p.name)}</nav>
   <div class="pd"><div class="gal"><div class="main" id="gmain">${imgs.length ? `<img src="${e(imgs[0])}" alt="${e(p.name)}">` : tile(p)}</div>${imgs.length > 1 ? `<div class="thumbs">${imgs.map((s, i) => `<button class="${i ? '' : 'on'}" data-img="${e(s)}" aria-label="Image ${i + 1}"><img src="${e(s)}" alt=""></button>`).join('')}</div>` : ''}</div>
   <div><div class="mu" style="font-size:13px;font-weight:700">${e(p.brand)}</div><h1>${e(p.name)}</h1>
     <div style="font-size:14px;margin:-4px 0 8px">Sold by ${p.vendor ? `<a href="/store/${e(p.vendor.slug)}" data-link style="color:var(--accent);font-weight:700">🏪 ${e(p.vendor.name)}</a>` : '<b>Shop-Beta</b>'}</div>
     <div>${p.rating_n ? stars(p.rating, p.rating_n + ' reviews') : '<span class="mu">No reviews yet</span>'}</div>
     <div class="price">${naira(p.price)}${p.compare_price > p.price ? `<s>${naira(p.compare_price)}</s><span class="save">Save ${p.off}%</span>` : ''}</div>
     ${sizes.length ? `<div class="opt-label">${e(p.size_label || 'Size')}</div><div class="chips" id="osize">${sizes.map((s) => `<button class="chip ${sel.size === s ? 'on' : ''}" data-size="${e(s)}">${e(s)}</button>`).join('')}</div>` : ''}
     ${colors.length ? `<div class="opt-label">Colour</div><div class="chips" id="ocolor">${colors.map((s) => `<button class="chip ${sel.color === s ? 'on' : ''}" data-color="${e(s)}">${e(s)}</button>`).join('')}</div>` : ''}
     <p class="stock" id="stock" style="margin:14px 0 0"></p>
     <div class="buy"><div class="qty"><button id="qm" aria-label="Decrease">−</button><span id="qv">1</span><button id="qp" aria-label="Increase">+</button></div>
       <button class="btn lg" id="addbtn">Add to cart</button><button class="btn ghost lg" data-wish="${p.id}" id="wbtn">${wish.has(p.id) ? '♥ Saved' : '♡ Save'}</button></div>
     <div class="note">🚚 Delivery fee depends on your state, and is free over ${naira(cfg.settings.free_shipping_threshold)}. 💳 Pay by card, transfer or pay on delivery.</div>
     <p class="mu" style="font-size:12px;margin-top:10px">SKU ${e(p.sku)}</p></div></div>
   <div class="tabs2" role="tablist"><button class="on" data-tab="desc">Description</button><button data-tab="rev">Reviews (${p.rating_n})</button></div>
   <div id="tdesc" class="prose"><p style="color:var(--text)">${e(p.description).replace(/\n/g, '<br>')}</p></div>
   <div id="trev" class="hide">${reviewsHtml(p)}</div>
   ${d.related.length ? `<section class="blk"><div class="sec-head"><h2>You may also like</h2></div><div class="grid">${d.related.map(productCard).join('')}</div></section>` : ''}
   ${recProducts.length ? `<section class="blk"><div class="sec-head"><h2>Recently viewed</h2></div><div class="grid">${recProducts.map(productCard).join('')}</div></section>` : ''}</div>`;
  const upd = () => {
    const s = stockOf(), el = $('#stock'); const need = hasVar && (!find());
    el.className = 'stock ' + (need ? '' : s <= 0 ? 'out' : s <= 5 ? 'low' : 'in');
    el.textContent = need ? 'Select your options' : s <= 0 ? 'Out of stock' : s <= 5 ? `Only ${s} left!` : 'In stock';
    $('#addbtn').disabled = need || s <= 0; $('#qv').textContent = sel.qty;
    if (!need && sel.qty > s) { sel.qty = Math.max(1, s); $('#qv').textContent = sel.qty; }
  };
  main.addEventListener('click', (ev) => {
    const t = ev.target;

    if (t.closest('#addbtn')) { const v = find(); cart.add(p.id, v ? v.id : null, sel.qty); toast('Added to cart'); openCart(); try { if (window.gtag) window.gtag('event', 'add_to_cart', { value: p.price * sel.qty, currency: 'NGN' }); if (window.fbq) window.fbq('track', 'AddToCart'); } catch { /* blocked */ } }
    const star = t.closest('[data-star]'); if (star) { rating = Number(star.dataset.star); $$('.starpick button').forEach((b) => b.classList.toggle('on', Number(b.dataset.star) <= rating)); }
  });
  let rating = 0;
  main.addEventListener('submit', async (ev) => {
    if (ev.target.id !== 'rform') return; ev.preventDefault();
    if (!rating) return toast('Please choose a star rating', 'bad');
    try { await api('/api/products/' + p.id + '/reviews', { body: { rating, title: ev.target.title.value, body: ev.target.body.value, name: ev.target.name ? ev.target.name.value : '' } }); toast('Thank you for your review!'); go('/product/' + p.slug); } catch (er) { toast(er.message, 'bad'); }
  });
  const gm = $('#gmain'); if (imgs.length) { gm.addEventListener('mousemove', (ev) => { const r = gm.getBoundingClientRect(); gm.style.setProperty('--zx', ((ev.clientX - r.left) / r.width * 100) + '%'); gm.style.setProperty('--zy', ((ev.clientY - r.top) / r.height * 100) + '%'); }); gm.addEventListener('mouseenter', () => gm.classList.add('zoom')); gm.addEventListener('mouseleave', () => gm.classList.remove('zoom')); gm.addEventListener('click', () => gm.classList.toggle('zoom')); }
  upd();
  ldjson(p, cfg);
  return p.name;
}
function reviewsHtml(p) {
  const total = p.reviews.length || 1;
  return `<div class="row c2" style="align-items:start"><div>
    ${p.reviews.length ? `<div style="font-size:34px;font-weight:800">${p.rating} <span class="stars" style="font-size:20px">★</span></div>${p.dist.map((x) => `<div class="dist"><span>${x.stars} ★</span><div class="bar"><i style="width:${x.n / total * 100}%"></i></div><span>${x.n}</span></div>`).join('')}` : '<p class="mu">No reviews yet. Be the first!</p>'}
    ${p.reviews.map((r) => `<div class="rev"><b>${e(r.name)}</b>${stars(r.rating)}<div style="font-weight:600">${e(r.title)}</div><div class="mu">${e(r.body)}</div></div>`).join('')}</div>
    <form id="rform" class="card"><h3>Write a review</h3><div class="starpick" role="radiogroup" aria-label="Rating">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-star="${n}" aria-label="${n} stars">★</button>`).join('')}</div>
    ${store.user ? '' : '<label class="f">Your name<input name="name" required maxlength="60"></label>'}<label class="f">Title<input name="title" maxlength="80"></label><label class="f">Your review<textarea name="body" rows="3" maxlength="1000" required></textarea></label><button class="btn">Submit review</button></form></div>`;
}
function ldjson(p, cfg) {
  const old = document.getElementById('ldp'); if (old) old.remove();
  const s = document.createElement('script'); s.type = 'application/ld+json'; s.id = 'ldp';
  s.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'Product', name: p.name, description: p.description, sku: p.sku, brand: { '@type': 'Brand', name: p.brand }, offers: { '@type': 'Offer', priceCurrency: 'NGN', price: p.price, availability: p.stock > 0 ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock', url: location.href }, ...(p.rating_n ? { aggregateRating: { '@type': 'AggregateRating', ratingValue: p.rating, reviewCount: p.rating_n } } : {}) });
  document.head.appendChild(s);
}

async function view(main, seg, u, cfg) {
  const name = seg[0];
  if (name === 'checkout') return checkout(main, cfg);
  if (name === 'order') return orderPage(main, seg[1], u, cfg);
  if (name === 'login' || name === 'register') return authPage(main, name, u, cfg);
  if (name === 'forgot') return forgotPage(main, u);
  if (name === 'account') return account(main, u, cfg);
  if (name === 'wishlist') return wishlist(main);
  if (name === 'track') return track(main);
  if (name === 'rider') return riderPage(main);
  if (name === 'pharmacist') return pharmacistPage(main);
  if (name === 'partner') return partnerPortal(main);
  if (name === 'wholesale') return wholesalePage(main);
  return '';
}

    if (t.id === 'ce' && /^[^@\s]+@[^@\s]+\.\S+$/.test(t.value)) api('/api/cart/abandon', { body: { email: t.value, items: cart.items } }).catch(() => {});
  });
  $('#oapply').addEventListener('click', () => { cart.setCoupon($('#ocode').value.trim()); err(''); reprice(); });
  $('#cof').addEventListener('submit', async (ev) => {
    ev.preventDefault(); err('');
    const g = (i) => $('#' + i).value.trim();
    if (!g('cn') || !g('ce') || !g('cp')) return err('Please fill in your name, email and phone number.');
    if (!st.state) return err('Please choose your state.');
    if (st.delivery !== 'pickup' && !g('ca')) return err('Please enter your street address.');
    if (needPin() && !mp.pin) return err('Please drop a pin on the map so we know where to deliver.');
    if (needPin() && !(mp.quote && mp.quote.ok)) return err(mp.quote ? mp.quote.message : 'Please wait while we check delivery to your pin.');
    if (st.pharm && !st.rxReady) return err('Please finish the medicine checks above: verified phone, ID details and, for prescription-only items, a prescription.');
    const btn = $('#place'); btn.disabled = true; btn.textContent = 'Placing order…';
    // One key per attempt: if the connection drops and the shopper tries again, the server hands back the same order instead of making a second.
    if (!st.idem) st.idem = (window.crypto && crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2))).replace(/[^A-Za-z0-9_-]/g, '');
    ls.set('sb_checkout', { name: g('cn'), email: g('ce'), phone: g('cp'), state: st.state, city: g('cc'), address: g('ca') });
    try {
      const r = await api('/api/checkout', { body: { items: cart.items, coupon: cart.coupon, contact: { name: g('cn'), email: g('ce'), phone: g('cp') }, address: { state: st.state, city: g('cc'), address: g('ca') }, prescriptionIds: st.rx || [], delivery: st.delivery, payment: st.payment, notes: g('cnotes'), idempotencyKey: st.idem, location: needPin() && mp.pin ? { ...mp.pin, landmark: g('mland') } : undefined } });
      try { sessionStorage.setItem('sb_last', JSON.stringify({ ref: r.ref, email: g('ce'), token: r.token || '' })); } catch { /* private mode */ }
      try { if (window.gtag) window.gtag('event', 'begin_checkout', { value: st.data.total, currency: 'NGN' }); if (window.fbq) window.fbq('track', 'InitiateCheckout'); } catch { /* blocked */ }
      if (r.next === 'paystack') { location.href = r.url; return; }
      cart.clear(); cart.setCoupon('');
      go('/order/' + r.ref + (r.next === 'demo' ? '?demo=1' : '?new=1'));
    } catch (er) { if (er.status) st.idem = null; /* the server answered, so a new attempt needs a new key; a dropped connection keeps the key */ err(er.message); btn.disabled = false; btn.textContent = 'Place order'; reprice(); }
  });
  reprice();
  return 'Checkout';
}

   ${!['cancelled', 'refunded'].includes(order.status) ? `<div class="card" style="margin-bottom:16px"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;font-size:12px">${flow.map((s, i) => `<div><div style="height:6px;border-radius:3px;background:${i <= stepIdx ? 'var(--accent)' : 'var(--border)'};margin-bottom:6px"></div><span class="${i <= stepIdx ? '' : 'mu'}" style="font-weight:${i === stepIdx ? 800 : 500}">${STATUS[s]}</span></div>`).join('')}</div></div>` : ''}
   ${deliveryCard(order)}

   <p style="text-align:center;margin-top:20px"><button class="btn ghost sm" id="print">🖨 Print receipt</button> ${order.status === 'pending' && order.payment_status !== 'paid' ? '<button class="btn ghost sm" id="cancelo">Cancel order</button>' : ''} <a class="btn sm" href="/" data-link>Continue shopping</a></p></div>`;

  return 'Order ' + order.ref;
}

function deliveryCard(order) {
  const d = order.delivery_info; if (!d || ['cancelled', 'refunded'].includes(order.status)) return '';
  const late = d.promised_at && !d.delivered_at && Date.now() / 1000 > d.promised_at;
  const stages = [['Order placed', order.created], ['Rider accepted', d.accepted_at], ['Picked up', d.picked_up_at], ['On the way', d.on_way_at], ['Delivered', d.delivered_at]];
  return `<div class="card" style="margin-bottom:16px"><h3 style="margin-top:0">Delivery</h3>
    ${d.delivered_at ? `<p style="margin:0 0 8px">✅ Delivered at <b>${tm(d.delivered_at)}</b></p>` : d.promised_at ? `<p style="margin:0 0 8px">Expected by <b>${tm(d.promised_at)}</b>${d.km ? ' · ' + d.km + ' km' : ''}${late ? ' <span style="color:var(--bad)">· running late, sorry</span>' : ''}</p>` : ''}
    ${order.handover_code ? `<div class="note" style="text-align:center;margin:10px 0"><div style="font-size:13px">Your delivery code</div><div style="font-size:36px;font-weight:800;letter-spacing:8px">${e(order.handover_code)}</div><div style="font-size:13px">Read this code to the rider only when your parcel is in your hands. It completes the delivery.${order.payment_method === 'pod' ? ' Have ' + naira(order.total) + ' ready.' : ''} Never share it before then.</div></div>` : ''}
    ${d.locked ? '<p style="color:var(--bad)">Delivery is paused after too many wrong codes. We will contact you.</p>' : ''}
    <div style="display:grid;gap:4px;font-size:13px">${stages.map(([n, t]) => `<div style="display:flex;justify-content:space-between;opacity:${t ? 1 : 0.45}"><span>${t ? '●' : '○'} ${n}</span><span class="mu">${t ? tm(t) : '—'}</span></div>`).join('')}</div>
    ${order.status === 'shipped' ? '<div id="trackmap" style="height:260px;border-radius:12px;margin-top:12px;background:#e6ebf0"></div><div class="mu" style="font-size:12px;margin-top:4px">Your rider appears on the map while the delivery is on the way.</div>' : ''}</div>`;
}

/* ---------------- rider screen (/rider) ---------------- */
async function riderPage(main) {

  if (!store.user || store.user.role !== 'rider') {
    draw(`<div class="card"><p class="mu">Sign in with the rider account the store gave you.</p><form id="rl">${field('re', 'Email', { type: 'email', req: 1 })}${field('rp', 'Password', { type: 'password', req: 1 })}<p class="err hide" id="rerr"></p><button class="btn block">Sign in</button></form></div>`);
    $('#rl').addEventListener('submit', async (ev) => { ev.preventDefault(); try { const r = await api('/api/auth/login', { body: { email: $('#re').value.trim(), password: $('#rp').value } }); if (r.user.role !== 'rider') { await api('/api/auth/logout', { body: {} }); throw new Error('This page is for delivery riders.'); } location.reload(); } catch (er) { const x = $('#rerr'); x.textContent = er.message; x.classList.remove('hide'); } });
    return 'Rider';
  }
  const call = (id, act, body) => api(`/api/rider/orders/${id}/${act}`, { body: body || {} });
  const here = () => new Promise((res) => { if (!navigator.geolocation) return res(null); navigator.geolocation.getCurrentPosition((p) => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res(null), { enableHighAccuracy: true, timeout: 8000, maximumAge: 10000 }); });
  let orders = [];
  const card = (o) => {
    const accepted = !!o.stages.accepted, left = o.pickups.filter((p) => !p.picked_up_at), road = o.status === 'shipped';

     <p style="margin:8px 0"><b>${e(o.customer.name)}</b> · <a href="tel:${e(o.customer.phone)}">📞 ${e(o.customer.phone)}</a><br>${e(o.customer.address)}${o.customer.city ? ', ' + e(o.customer.city) : ''}, ${e(o.customer.state)}${o.customer.landmark ? '<br>Landmark: ' + e(o.customer.landmark) : ''}${o.notes ? '<br><span class="mu">Note: ' + e(o.notes) + '</span>' : ''}</p>
     ${o.customer.nav ? `<a class="btn ghost sm" href="${e(o.customer.nav)}" target="_blank" rel="noopener">🧭 Directions to customer</a> <a class="btn ghost sm" href="${e(o.customer.nav_osm)}" target="_blank" rel="noopener">OpenStreetMap</a>` : ''}
     ${o.collect ? `<p style="margin:10px 0;font-size:18px">💵 Collect <b>${naira(o.collect)}</b> at the door</p>` : '<p class="mu" style="margin:10px 0">Already paid online.</p>'}
     <h4 style="margin:10px 0 4px">Pick up</h4>${o.pickups.map((p) => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)"><span>${e(p.name)}<br><span class="mu" style="font-size:12px">${e(p.address)}${p.phone ? ' · <a href="tel:' + e(p.phone) + '">' + e(p.phone) + '</a>' : ''}</span></span><span>${p.picked_up_at ? '✅ ' + tm(p.picked_up_at) : `<a class="btn ghost sm" href="${e(p.nav)}" target="_blank" rel="noopener">🧭</a> ${accepted && !road ? `<button class="btn sm" data-pick="${p.partner_id}">Collected</button>` : ''}`}</span></div>`).join('')}
     <h4 style="margin:10px 0 4px">Items</h4><div style="font-size:14px">${o.items.map((i) => `${i.qty} × ${e(i.name)}${i.variant_label ? ' (' + e(i.variant_label) + ')' : ''}`).join('<br>')}</div>
     <div style="margin-top:12px;display:grid;gap:8px">
      ${!accepted ? '<button class="btn block" data-act="accept">Accept delivery</button>' : ''}
      ${accepted && !road && !left.length ? '<button class="btn block" data-act="start">I am on the way</button>' : ''}
      ${road ? `<div class="note"><b>At the door:</b> ask the customer for their 6-digit code.${o.pharmacy ? ' This is a <b>medicines</b> order: also ask for their full name and enter it. Hand over only to the buyer.' : ''}</div>${o.pharmacy ? '<input class="namein" maxlength="80" placeholder="Buyer\'s full name (as they say it)" style="margin-top:8px">' : ''}${o.locked ? '<p class="err">Locked after too many wrong codes. Call the shop.</p>' : `<input class="codein" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="off" style="font-size:24px;text-align:center;letter-spacing:6px"><button class="btn block" data-act="complete">Complete delivery</button>`}` : ''}
     </div>
     <div class="mu" style="font-size:12px;margin-top:8px">Accepted ${tm(o.stages.accepted) || '—'} · Picked up ${tm(o.stages.picked_up) || '—'} · On the way ${tm(o.stages.on_way) || '—'}</div></div>`;
  };
  const refresh = async () => {
    orders = (await api('/api/rider/orders')).orders;
    draw(`<p class="mu">Signed in as ${e(store.user.name)} · <button class="btn ghost sm" id="rlo">Sign out</button> <button class="btn ghost sm" id="rrf">Refresh</button></p>${orders.length ? orders.map(card).join('') : '<div class="card"><p class="mu">No deliveries assigned to you right now.</p></div>'}`);
    $('#rlo').addEventListener('click', async () => { await api('/api/auth/logout', { body: {} }); location.reload(); });
    $('#rrf').addEventListener('click', () => refresh().catch((er) => toast(er.message, 'bad')));
    $$('[data-o]', main).forEach((box) => {
      const id = box.dataset.o, act = async (a, body) => { try { await call(id, a, body); await refresh(); } catch (er) { toast(er.message, 'bad'); if (er.status === 423) refresh(); } };
      $$('[data-pick]', box).forEach((b) => b.addEventListener('click', () => act('pickup', { partnerId: Number(b.dataset.pick) })));
      $$('[data-act]', box).forEach((b) => b.addEventListener('click', async () => {
        if (b.dataset.act === 'complete') { const code = $('.codein', box).value.trim(); if (!/^\d{6}$/.test(code)) return toast('Enter the 6-digit code from the customer.', 'bad'); const p = await here(); const nm = $('.namein', box); if (nm && nm.value.trim().length < 3) return toast('Ask for the buyer\'s full name and enter it.', 'bad'); return act('complete', { code, ...(nm ? { recipientName: nm.value.trim() } : {}), ...(p || {}) }); }
        act(b.dataset.act);
      }));
    });

  await refresh();
  // Send the rider's position about every 15 seconds, only for deliveries that are on the way.
  const tick = async () => {
    if (!main.isConnected) return clearInterval(timer);
    const road = orders.filter((o) => o.status === 'shipped'); if (!road.length) return;
    const p = await here(); if (p) for (const o of road) call(o.id, 'location', p).catch(() => {});

  const timer = setInterval(tick, 15000);
  const poll = setInterval(() => { if (!main.isConnected) return clearInterval(poll); if (!document.querySelector('.codein:focus, .namein:focus')) refresh().catch(() => {}); }, 45000);
  return 'Rider';
}

// Order page: status of the pharmacist's check, paying after approval, answering questions, reporting a problem.
function pharmOrderCard(o) {
  const p = o.pharmacy; if (!p) return '';
  let msg = '';
  if (o.status === 'cancelled') msg = 'This order was cancelled. Any reason from the pharmacist is in the updates below.';
  else if (p.rx_required && p.rx_status === 'submitted') msg = '🩺 <b>Waiting for the pharmacist</b> to check your prescription. Nothing is charged or sent until it is approved. We will email you.';
  else if (p.rx_required && p.rx_status === 'needs_info') msg = '❓ <b>The pharmacist needs more information</b> (see the updates below). Add a clearer or additional prescription:';
  else if (p.held) msg = '🔎 This order is being reviewed by our pharmacy team. We will contact you.';
  else if (p.needs_payment) msg = '✅ <b>Approved.</b> Please pay to confirm your order.';
  else if (p.rx_required) msg = '✅ Your prescription was approved by the pharmacist.';
  return `<div class="card" style="margin-bottom:16px" id="pharmcard"><h3 style="margin-top:0">💊 Pharmacy order</h3><p style="margin:0 0 8px">${msg}</p>
   ${p.temp_sensitive ? '<p class="mu" style="font-size:13px">This order contains temperature-sensitive medicines and goes with a cold-chain rider.</p>' : ''}
   ${p.needs_payment ? '<button class="btn" id="pharmpay">Pay now</button>' : ''}
   ${p.rx_status === 'needs_info' && o.status !== 'cancelled' ? '<button class="btn ghost" id="pharmmore">Choose or upload another prescription</button>' : ''}
   ${o.status === 'delivered' ? '<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:700">Report a problem with these medicines</summary><label class="f">What is wrong?<select id="retr"><option value="tampered">Packaging tampered with</option><option value="expired">Expired</option><option value="damaged">Damaged</option><option value="wrong_item">Not what I ordered</option></select></label><label class="f">Details<input id="retn" maxlength="500"></label><button class="btn sm" id="retgo">Send</button></details>' : ''}</div>`;
}

const app = {};
const ctx = app;

/* ---------- router ---------- */
function go(url, replace) { if (replace) history.replaceState({}, '', url); else history.pushState({}, '', url); route(); window.scrollTo(0, 0); }
async function route() {
  const u = new URL(location.href); const p = u.pathname.replace(/\/+$/, '') || '/'; const seg = p.split('/').filter(Boolean);
  let main = $('#main'); if (!main) return;
  // Fresh node for every page: page views attach their own click/submit listeners, and reusing one node would stack them up.
  { const fresh = main.cloneNode(false); main.replaceWith(fresh); main = fresh; }
  main.innerHTML = '<div class="loading-page"></div>';
  try {
    let storeSlug = null;
    if (seg[0] === 'd' && seg[1]) storeSlug = seg[1];
    else if (u.searchParams.get('store')) storeSlug = u.searchParams.get('store');
    if (storeSlug && !cfg.stores.some((s) => s.slug === storeSlug)) storeSlug = null;
    if (storeSlug) setStoreTheme(storeSlug);
    let title = cfg.settings.store_name;
    if (p === '/' ) { go('/d/' + (cfg.stores.some((s) => s.slug === getStoreSlug()) ? getStoreSlug() : cfg.stores[0].slug), true); return; }
    else if (seg[0] === 'd' && seg.length === 2) title = await home(main, seg[1], cfg);
    else if (seg[0] === 'shop' || (seg[0] === 'd' && seg[2] === 'shop')) title = await shopView(main, u, cfg);
    else if (seg[0] === 'product' && seg[1]) title = await productView(main, seg[1], cfg);
    else if (seg[0] === 'stores' && seg.length === 1) title = await storesView(main, u, cfg);
    else if (seg[0] === 'store' && seg[1]) title = await storeView(main, seg[1], u, cfg);
    else if (seg[0] === 'sell' && seg.length === 1) title = await sellView(main, cfg);
    else if (seg[0] === 'page' && seg[1]) title = staticPage(main, seg[1], cfg);
    else if (['checkout', 'order', 'account', 'login', 'register', 'wishlist', 'track', 'forgot', 'rider', 'pharmacist', 'partner', 'wholesale'].includes(seg[0])) { title = await view(main, seg, u, cfg); }
    else main.innerHTML = `<div class="wrap empty"><div class="em">🧭</div><h2>Page not found</h2><p><a class="btn" href="/" data-link>Back to the store</a></p></div>`;
    document.title = (title ? title + ' · ' : '') + cfg.settings.store_name;
    syncHeader(); $('#main').focus({ preventScroll: true });
  } catch (err) {
    main.innerHTML = `<div class="wrap empty"><div class="em">😕</div><h2>${err.status === 404 ? 'We could not find that' : 'Something went wrong'}</h2><p class="mu">${e(err.message)}</p><p><a class="btn" href="/" data-link>Back to the store</a> <button class="btn ghost" data-reload>Try again</button></p></div>`;
  }
  trackPage();
}
function trackPage() { try { if (window.gtag) window.gtag('event', 'page_view', { page_path: location.pathname }); if (window.fbq) window.fbq('track', 'PageView'); } catch { /* analytics blocked */ } }

          <div class="row c2"><label class="f">Department<select id="pd">${cat.departments.map((d) => `<option value="${e(d.store)}" ${d.store === x.store ? 'selected' : ''}>${e(d.name)}</option>`).join('')}</select></label><label class="f">Category<select id="pcat"></select></label></div>
          <div class="row c2">${field('pp', 'Price (₦)', { req: 1, type: 'number', val: x.price })}${field('pcp', 'Old price (₦, optional)', { type: 'number', val: x.compare_price || '' })}</div>
          <div class="row c2">${field('ps', 'Stock', { type: 'number', val: x.stock })}${field('psku', 'SKU (optional)', { val: x.sku, max: 40 })}</div>
          <label class="f">Description<textarea id="pdesc" rows="4" maxlength="4000">${e(x.description)}</textarea></label>
          <h4 style="margin:10px 0 4px">Photos (up to 8)</h4><div style="display:flex;gap:8px;flex-wrap:wrap">${images.map((u2, i) => `<span style="position:relative"><img src="${e(u2)}" style="width:72px;height:72px;object-fit:cover;border-radius:10px"><button type="button" class="rm" data-rmi="${i}" style="position:absolute;top:-6px;right:-6px">✕</button></span>`).join('')}<label class="btn ghost sm" style="cursor:pointer">+ Add photo<input type="file" id="pimg" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none"></label></div>
          <label class="chk" style="margin-top:10px"><input type="checkbox" id="pact" ${x.active ? 'checked' : ''}> Show this product in my store</label>
          <p class="mu" style="font-size:12px">Sizes and colours: ask us to set them up for now.</p>
          <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="psave">Save</button><button class="btn ghost" id="pcancel">Cancel</button></div></div>`);
        const fillCats = () => { const d = $('#pd').value; $('#pcat').innerHTML = '<option value="">None</option>' + cat.categories.filter((c) => c.store === d).map((c) => `<option value="${c.id}" ${String(c.id) === String(x.category_id) ? 'selected' : ''}>${e(c.name)}</option>`).join(''); };
        fillCats(); $('#pd').addEventListener('change', () => { x.category_id = ''; fillCats(); });
        $$('[data-rmi]', main).forEach((b) => b.addEventListener('click', () => { images.splice(Number(b.dataset.rmi), 1); keep(); paint(); }));
        const keep = () => { Object.assign(x, { name: $('#pn').value, brand: $('#pb').value, price: $('#pp').value, compare_price: $('#pcp').value, stock: $('#ps').value, sku: $('#psku').value, description: $('#pdesc').value, store: $('#pd').value, category_id: $('#pcat').value, active: $('#pact').checked ? 1 : 0 }); };
        $('#pimg').addEventListener('change', run(async (ev) => { keep(); if (images.length >= 8) throw new Error('Up to 8 photos'); images.push(await upload(ev.target.files[0])); paint(); }));
        $('#pcancel').addEventListener('click', () => { editing = null; show(); });
        $('#psave').addEventListener('click', run(async () => { keep(); const body = { ...x, images, variants: x.variants || [], category_id: x.category_id || null }; const r = editing ? await P('/products/' + editing, { method: 'PUT', body }) : await P('/products', { body }); toast(r.resubmitted ? 'Saved. Sent to us for review.' : 'Saved'); editing = null; show(); }));
        wire();
      };
      paint(); return;
    }
    if (tab === 'products') {
      const r = await P('/products');
      wrap(`<div style="margin-bottom:10px"><button class="btn" id="pnew">+ Add product</button></div>${r.products.length ? r.products.map((p) => { const L = LIST[p.listing] || ['', '']; return `<div class="card" style="margin-bottom:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div><b>${e(p.name)}</b> · ${naira(p.price)}<br><span class="mu" style="font-size:12px">${e(p.category || '')} · ${L[0]}${p.listing === 'rejected' ? ': ' + e(p.listing_note) : ''}${p.active ? '' : ' · hidden'}</span></div>
        <div style="display:flex;gap:6px;align-items:center">Stock <input type="number" min="0" value="${p.stock}" data-stk="${p.id}" style="width:80px"><button class="btn ghost sm" data-edit="${p.id}">Edit</button><button class="btn ghost sm" data-del="${p.id}">Remove</button></div></div>`; }).join('') : '<div class="card"><p class="mu">No products yet. Add your first one. We review each product before customers see it.</p></div>'}`);
      wire(); $('#pnew').addEventListener('click', () => { editing = 0; show(); });
      $$('[data-edit]', main).forEach((b) => b.addEventListener('click', () => { editing = b.dataset.edit; show(); }));
      $$('[data-stk]', main).forEach((i) => i.addEventListener('change', run(async () => { await P(`/products/${i.dataset.stk}/stock`, { method: 'PUT', body: { stock: i.value } }); toast('Stock saved'); })));
      $$('[data-del]', main).forEach((b) => b.addEventListener('click', run(async () => { if (!confirm('Remove this product?')) return; await P('/products/' + b.dataset.del, { method: 'DELETE' }); show(); })));
      return;
    }
    if (tab === 'orders') {
      const r = await P('/orders');
      wrap(r.orders.length ? r.orders.map((o) => `<div class="card" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${e(o.ref)}</b><span class="mu">${e(o.status)} · ${fmt(o.created)}</span></div>${o.items.map((i) => `<div style="font-size:14px">${i.qty} × ${e(i.name)}${i.variant ? ' (' + e(i.variant) + ')' : ''} · ${naira(i.price * i.qty)}</div>`).join('')}<div class="mu" style="font-size:13px;margin-top:4px">Sales ${naira(o.gross)} · our commission ${naira(o.commission)} · yours ${naira(o.net)}</div></div>`).join('') + '<p class="mu" style="font-size:12px">Our rider collects the order from you. Customer details stay with us.</p>' : '<div class="card"><p class="mu">No orders yet.</p></div>');
      wire(); return;
    }
    if (tab === 'earnings') {
      const r = await P('/earnings');
      wrap(`<div class="row c2"><div class="card"><div class="mu">Owed to you now</div><h2 style="margin:4px 0">${naira(r.balance)}</h2><div class="mu" style="font-size:12px">Delivered sales ${naira(r.gross)} − our commission ${naira(r.commission)} − paid out ${naira(r.paid)}</div></div><div class="card"><div class="mu">On the way (not delivered yet)</div><h2 style="margin:4px 0">${naira(r.in_progress)}</h2><div class="mu" style="font-size:12px">Counted once the customer receives the order.</div></div></div>
        <div class="card" style="margin-top:12px"><h3>Payments we made to you</h3>${r.payouts.length ? r.payouts.map((p) => `<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${fmt(p.created)} · ${e(p.method)} ${e(p.reference)}</span><b>${naira(p.amount)}</b></div>`).join('') : '<p class="mu">None yet.</p>'}</div>`);
      wire(); return;
    }
    // store page
    wrap(`<div class="card"><h3>Your store page</h3><form id="stf">
      <div class="row c2">${field('mn', 'Store name', { req: 1, val: me.name, max: 80 })}${field('mt', 'Tagline', { val: me.tagline, max: 120 })}</div>
      <label class="f">About your store<textarea id="mab" rows="3" maxlength="1500">${e(me.about)}</textarea></label>
      <div class="row c2">${field('mph', 'Phone', { val: me.phone, max: 30 })}${field('mh', 'Opening hours', { val: me.opening_hours, max: 120, ph: 'Mon–Sat 8am–8pm' })}</div>
      ${field('mad', 'Address', { val: me.address, max: 200 })}<div class="row c2">${field('mst', 'State', { val: me.state, max: 60 })}${field('mci', 'City / area', { val: me.city, max: 60 })}</div>
      <div class="row c2"><div><h4 style="margin:6px 0">Logo</h4>${me.logo ? `<img src="${e(me.logo)}" style="width:64px;height:64px;object-fit:cover;border-radius:12px"><br>` : ''}<input type="file" id="mlogo" accept="image/*"></div><div><h4 style="margin:6px 0">Banner</h4>${me.banner ? `<img src="${e(me.banner)}" style="width:140px;height:60px;object-fit:cover;border-radius:10px"><br>` : ''}<input type="file" id="mban" accept="image/*"></div></div>
      <h4 style="margin:12px 0 4px">Departments (up to 3)</h4><div class="chips" id="mdep"></div>
      <p class="mu" style="font-size:12px">To remove a department, first switch off or move its products. Changing the address sends our team a note to re-check your map position.</p>
      <button class="btn" style="margin-top:10px">Save</button></form></div>`);
    const cat = await P('/catalogue'); const have = new Set(me.departments.map((d) => d.store));
    $('#mdep').innerHTML = cat.all_departments.map((d) => `<label class="chip" style="cursor:pointer"><input type="checkbox" value="${e(d.slug)}" ${have.has(d.slug) ? 'checked' : ''} style="width:auto;margin-right:6px">${e(d.icon)} ${e(d.name)}</label>`).join('');
    $('#mdep').addEventListener('change', (ev) => { if ($$('#mdep input:checked').length > 3) { ev.target.checked = false; toast('Up to 3 departments', 'bad'); } });
    let logo = me.logo, ban = me.banner;
    $('#mlogo').addEventListener('change', run(async (ev) => { logo = await upload(ev.target.files[0]); toast('Logo ready. Press Save.'); }));
    $('#mban').addEventListener('change', run(async (ev) => { ban = await upload(ev.target.files[0]); toast('Banner ready. Press Save.'); }));
    $('#stf').addEventListener('submit', run(async (ev) => { ev.preventDefault();
      await P('/me', { method: 'PUT', body: { name: $('#mn').value, tagline: $('#mt').value, about: $('#mab').value, phone: $('#mph').value, opening_hours: $('#mh').value, address: $('#mad').value, state: $('#mst').value, city: $('#mci').value, logo, banner: ban } });
      await P('/departments', { method: 'PUT', body: { departments: $$('#mdep input:checked').map((i) => i.value) } }); toast('Saved'); show(); }));
    wire();
  });
  await show();
  return 'Partner store';
}


/* ===== wholesale (buyers) ===== */
const WSTATUS = { requested: 'Waiting for our quotation', quoted: 'Quotation ready: please approve', accepted: 'Approved: waiting for payment', paid: 'Paid: being arranged', shipped: 'Shipped', delivered: 'Delivered', declined: 'Declined', cancelled: 'Cancelled', expired: 'Expired' };
const wdate = (t) => (t ? new Date(t * 1000).toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' }) : '');
function proformaHtml(q, biz) {
  return `<div id="proforma" class="card" style="padding:22px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h2 style="margin:0">Proforma invoice &amp; quotation</h2><div class="mu">${e(q.ref)} · requested ${wdate(q.created)}${q.valid_until ? ' · valid until <b>' + wdate(q.valid_until) + '</b>' : ''}</div></div><div style="text-align:right"><b>${e(biz || '')}</b><div class="mu" style="font-size:13px">${e(q.ship.name)}<br>${e(q.ship.address)}, ${e([q.ship.city, q.ship.state].filter(Boolean).join(', '))}<br>${e(q.ship.phone)}</div></div></div>
   <table class="wtab" style="margin-top:14px"><tr><th>Item</th><th>Qty</th><th>Wholesale price</th><th style="text-align:right">Amount</th></tr>${q.items.map((i) => `<tr><td>${e(i.name)}</td><td>${i.qty}</td><td>${naira(i.unit_price)}</td><td style="text-align:right">${naira(i.line_total)}</td></tr>`).join('')}</table>
   <div class="totals" style="margin-top:12px"><div><span>Total value of goods</span><b>${naira(q.goods_total)}</b></div><div><span>Logistics fee</span><b>${naira(q.logistics_fee)}</b></div><div><span>Service fee${q.service_pct ? ' (' + q.service_pct + '%)' : ''}</span><b>${naira(q.service_fee)}</b></div><div class="big"><span>Total to pay</span><span>${naira(q.total)}</span></div></div>
   ${q.shipment_plan ? `<p style="margin:14px 0 0"><b>Shipment:</b> ${e(q.shipment_plan)}</p>` : ''}${q.admin_note ? `<p class="mu" style="margin:6px 0 0">${e(q.admin_note)}</p>` : ''}
   <p class="mu" style="font-size:12px;margin:14px 0 0">Payment is made in full before shipment. This is a proforma invoice, not a tax receipt.</p></div>`;
}

async function wholesalePage(main) {
  const parts = location.pathname.split('/').filter(Boolean), ref = parts[1] === 'quote' ? (parts[2] || '').toUpperCase() : '';
  const draw = (inner) => { main.innerHTML = `<div class="wrap page" style="max-width:1000px"><nav class="crumbs noprint"><a href="/" data-link>Home</a> › <a href="/wholesale" data-link>Wholesale</a>${ref ? ' › ' + e(ref) : ''}</nav><h1 style="font-size:28px;margin:0 0 6px" class="noprint">📦 Wholesale</h1>${inner}</div>`; };
  const W = (p, o) => api('/api/wholesale' + p, o);
  const run = (fn) => async (ev) => { try { await fn(ev); } catch (x) { toast(x.message, 'bad'); } };
  if (!store.user) {
    draw(`<div class="card"><p>Buy our products in bulk at wholesale prices. Customers and partner stores can both apply. We evaluate every application for a few weeks and check your business registration before approving it. After that you pick products, we send a proforma invoice and quotation, you approve it and pay, and we ship.</p><p><a class="btn" href="/login?next=/wholesale" data-link>Sign in</a> <a class="btn ghost" href="/register?next=/wholesale" data-link>Create an account</a></p></div>`);
    return 'Wholesale';
  }
  if (!['customer', 'vendor'].includes(store.user.role)) { draw('<div class="card"><p class="mu">Wholesale is for customer and partner store accounts.</p></div>'); return 'Wholesale'; }
  const { account, terms } = await W('/me');
  const zones = (store.cfg && store.cfg.zones) || [];
  if (!account) {
    draw(`<div class="card"><p class="mu" style="margin-top:0">Tell us about your business. We evaluate applications for about ${terms.eval_days} days, then email you. Wholesale prices are shown only to approved buyers.</p><form id="wf" novalidate>
      <div class="row c2">${field('wb', 'Business name', { req: 1, max: 100 })}${field('wc', 'Contact person', { req: 1, max: 80, val: store.user.name })}</div>
      <div class="row c2">${field('wp', 'Phone', { req: 1, type: 'tel', val: store.user.phone })}${field('we', 'Email', { req: 1, type: 'email', val: store.user.email })}</div>
      ${field('wa', 'Business address', { req: 1, max: 200 })}<div class="row c2"><label class="f">State<select id="ws" required><option value="">Choose…</option>${zones.map((z) => `<option>${e(z.state)}</option>`).join('')}</select></label>${field('wci', 'City / area', { max: 60 })}</div>
      <div class="row c2">${field('wr', 'Business registration number (CAC)', { req: 1, max: 40 })}${field('wt', 'Type of business', { max: 40, ph: 'Retailer, restaurant, reseller…' })}</div>
      <label class="f">What do you plan to buy?<textarea id="wbuy" rows="2" maxlength="500" required></textarea></label>${field('wm', 'Rough monthly spend', { max: 80, ph: '₦1,000,000' })}
      <p class="err hide" id="werr" role="alert"></p><button class="btn lg">Apply for wholesale</button></form></div>`);
    $('#wf').addEventListener('submit', async (ev) => { ev.preventDefault(); try { await W('/apply', { body: { business_name: $('#wb').value, contact_name: $('#wc').value, phone: $('#wp').value, email: $('#we').value, address: $('#wa').value, state: $('#ws').value, city: $('#wci').value, reg_no: $('#wr').value, business_type: $('#wt').value, buys: $('#wbuy').value, est_monthly: $('#wm').value } }); toast('Application sent'); wholesalePage(main); } catch (x) { $('#werr').textContent = x.message; $('#werr').classList.remove('hide'); } });
    return 'Wholesale';
  }
  if (account.status !== 'approved') {
    draw(`<div class="card"><h3 style="margin-top:0">${account.status === 'pending' ? 'Your application is being evaluated' : 'Your wholesale account is ' + e(account.status)}</h3><p>${account.status === 'pending' ? `Thank you, ${e(account.business_name)}. We check your details over a few weeks (planned until ${wdate(account.evaluate_until)}) and will email you. Wholesale prices appear here once you are approved.` : e(account.status_note || 'Please contact us.')}</p></div>`);
    return 'Wholesale';
  }
  if (ref) {
    const { quote: q } = await W('/quotes/' + encodeURIComponent(ref));
    const act = {
      requested: '<p class="mu">We are preparing your proforma invoice. You will get an email.</p><button class="btn ghost" id="wdec">Cancel this request</button>',
      quoted: '<p>Please check the invoice. When you approve it, we set these goods aside for you, then you pay, and only then do we ship.</p><button class="btn" id="wacc">Approve quotation</button> <button class="btn ghost" id="wdec">Decline</button>',
      accepted: `<p><b>Pay before ${wdate(q.pay_by)}</b> or the goods are released. We ship after payment.</p><button class="btn" id="wpay">Pay ${naira(q.total)} online</button>${q.bank ? `<div class="card" style="margin-top:12px"><b>Or pay by bank transfer</b><p style="white-space:pre-line;margin:6px 0">${e(q.bank)}</p><p class="mu" style="font-size:13px;margin:0">Use <b>${e(q.ref)}</b> as the payment reference. We confirm your transfer and email you.</p></div>` : ''}`,
      paid: '<p>✅ Payment received. We will arrange the shipment as agreed above.</p>',
      shipped: `<p>🚚 Shipped with <b>${e(q.carrier || 'our carrier')}</b>${q.tracking ? ', tracking ' + e(q.tracking) : ''}.</p>`, delivered: '<p>✅ Delivered.</p>',
    }[q.status] || `<p class="mu">${e(WSTATUS[q.status] || q.status)}</p>`;
    draw(`<p class="noprint"><span class="pill">${e(WSTATUS[q.status] || q.status)}</span> <button class="btn ghost sm" onclick="window.print()">Print invoice</button></p>${proformaHtml(q, account.business_name)}<div class="card noprint" style="margin-top:14px">${act}</div>
      <div class="card noprint" style="margin-top:14px"><h4 style="margin-top:0">Progress</h4>${q.events.map((x) => `<div style="font-size:13px;padding:2px 0"><span class="mu">${wdate(x.created)}</span> · ${e(x.note || x.status)}</div>`).join('')}</div>`);
    const after = () => wholesalePage(main);
    const acc = $('#wacc'); if (acc) acc.addEventListener('click', run(async () => { await W(`/quotes/${q.ref}/accept`, { body: {} }); toast('Approved'); after(); }));
    const dec = $('#wdec'); if (dec) dec.addEventListener('click', run(async () => { if (!confirm('Decline this quotation?')) return; await W(`/quotes/${q.ref}/decline`, { body: {} }); after(); }));
    const pay = $('#wpay'); if (pay) pay.addEventListener('click', run(async () => { const r = await W(`/quotes/${q.ref}/pay`, { body: {} }); if (r.url) { location.href = r.url; return; } if (r.demo) { await W(`/quotes/${q.ref}/pay/demo`, { body: {} }); toast('Demo payment recorded'); after(); } }));
    if (new URLSearchParams(location.search).get('reference') && q.status === 'accepted') api('/api/paystack/verify?reference=' + encodeURIComponent(q.ref)).then(after).catch(() => {});
    return 'Quotation ' + q.ref;
  }
  const [{ products }, { quotes }] = await Promise.all([W('/catalog'), W('/quotes')]);
  draw(`<div class="card" style="margin-bottom:14px"><b>${e(account.business_name)}</b> · approved wholesale buyer. Choose quantities (at or above the minimum), tell us where to deliver, and request a quotation. We reply with a proforma invoice.</div>
    ${quotes.length ? `<div class="card" style="margin-bottom:14px"><h4 style="margin-top:0">Your quotations</h4>${quotes.map((x) => `<a href="/wholesale/quote/${e(x.ref)}" data-link style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span><b>${e(x.ref)}</b> · ${wdate(x.created)}</span><span>${naira(x.total)} · ${e(WSTATUS[x.status] || x.status)}</span></a>`).join('')}</div>` : ''}
    <div class="card"><h3 style="margin-top:0">Wholesale price list</h3><input id="wq" placeholder="Filter products" style="max-width:300px;margin-bottom:8px">
     ${products.length ? `<div style="overflow-x:auto"><table class="wtab" id="wt"><tr><th>Product</th><th>Retail</th><th>Wholesale</th><th>Minimum</th><th>In stock</th><th>Quantity</th></tr>${products.map((p) => `<tr data-n="${e(p.name.toLowerCase())}"><td><b>${e(p.name)}</b><div class="mu" style="font-size:12px">${e(p.category || '')}</div></td><td class="mu"><s>${naira(p.retail_price)}</s></td><td><b>${naira(p.price)}</b></td><td>${p.min_qty}</td><td>${p.stock}</td><td><input type="number" min="0" max="${p.stock}" data-pid="${p.id}" data-min="${p.min_qty}" data-price="${p.price}" placeholder="0"></td></tr>`).join('')}</table></div>` : '<p class="mu">No wholesale products are listed yet. Ask us, or check back soon.</p>'}
     <div class="totals" style="margin-top:10px"><div><span>Goods at wholesale price</span><b id="wsum">₦0</b></div></div>
     <h4 style="margin:14px 0 4px">Deliver to</h4><div class="row c2">${field('xn', 'Receiver name', { val: account.contact_name })}${field('xp', 'Receiver phone', { val: account.phone })}</div>${field('xa', 'Address', { val: account.address, req: 1 })}<div class="row c2"><label class="f">State<select id="xs">${zones.map((z) => `<option ${z.state === account.state ? 'selected' : ''}>${e(z.state)}</option>`).join('')}</select></label>${field('xc', 'City / area', { val: account.city })}</div>
     <label class="f">Note to us (when you need it, how you would like it shipped…)<textarea id="xnote" rows="2" maxlength="800"></textarea></label>
     <p class="mu" style="font-size:12px">Our quotation adds a logistics fee and a service fee (usually ${terms.service_pct}%). You approve the quotation, pay, and then we ship.</p><button class="btn lg" id="wreq">Request quotation</button></div>`);
  const sum = () => { let t = 0; for (const i of $$('[data-pid]')) t += (Number(i.value) || 0) * Number(i.dataset.price); $('#wsum').textContent = naira(t); };
  $$('[data-pid]').forEach((i) => i.addEventListener('input', sum));
  const wq = $('#wq'); if (wq) wq.addEventListener('input', () => { const t = wq.value.toLowerCase(); $$('#wt tr[data-n]').forEach((r) => { r.style.display = r.dataset.n.includes(t) ? '' : 'none'; }); });
  $('#wreq').addEventListener('click', run(async () => {
    const items = $$('[data-pid]').filter((i) => Number(i.value) > 0).map((i) => { if (Number(i.value) < Number(i.dataset.min)) throw new Error('The minimum for one of the products is ' + i.dataset.min); return { productId: Number(i.dataset.pid), qty: Number(i.value) }; });
    if (!items.length) throw new Error('Enter a quantity for at least one product.');
    const r = await W('/quotes', { body: { items, ship_name: $('#xn').value, ship_phone: $('#xp').value, ship_address: $('#xa').value, ship_state: $('#xs').value, ship_city: $('#xc').value, note: $('#xnote').value } });
    toast('Request sent'); go('/wholesale/quote/' + r.ref);
  }));
  return 'Wholesale';
}

/* ---------- shell ---------- */
function shell() {
  const s = cfg.settings;
  $('#shell').innerHTML = `

document.addEventListener('click', async (ev) => {
  const t = ev.target;
  const a = t.closest('a[data-link]');
  if (a && !ev.metaKey && !ev.ctrlKey && !ev.shiftKey && a.target !== '_blank') { ev.preventDefault(); closeCart(); go(a.getAttribute('href')); return; }
  if (t.closest('[data-reload]')) { location.reload(); return; }
  const w = t.closest('[data-wish]');
  if (w) { ev.preventDefault(); const id = Number(w.dataset.wish); const on = await wish.toggle(id); $$(`[data-wish="${id}"]`).forEach((b) => { b.classList.toggle('on', on); b.textContent = on ? '♥' : '♡'; b.setAttribute('aria-pressed', on); }); toast(on ? 'Saved to your wishlist' : 'Removed from wishlist'); syncHeader(); return; }
  const q = t.closest('[data-quick]');
  if (q) { ev.preventDefault(); const id = Number(q.dataset.quick);
    try { const d = await api('/api/products/by-ids', { body: { ids: [id] } }); const p = d.products[0]; if (!p) return;
      const pd = await api('/api/products/' + p.slug);

      cart.add(id, null, 1); toast('Added to cart'); openCart(); } catch (er) { toast(er.message, 'bad'); }
    return; }
  if (t.closest('#cartBtn')) { openCart(); return; }
  if (t.closest('#modeBtn')) { const m = document.documentElement.getAttribute('data-mode') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-mode', m); ls.set('sb_mode', m); return; }
  if (t.closest('#scrim')) closeCart();
});
